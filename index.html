<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Hundred — Year 6 SATs English</title><meta name="theme-color" content="#5B6BAE">
<!-- Home screen. Without these iOS uses a screenshot of the page, and two
     apps built from the same shell become two identical tiles. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<style>
/* ================= One Hundred =================
   Built on the 2025 and 2026 KS2 papers rather than on the programme of study:
   every stop names the content-domain codes it serves and carries as many
   questions as that code's weight in the test deserves.
   Paper 1 is 36 constructed answers, so arithmetic is typed on a keypad, never
   chosen from four options — offering options would train a skill the test
   does not reward. */
:root{
 --ink:#1B2430;--ink2:#4A5A6B;--muted:#8494A4;--paper:#FBF8F3;--card:#fff;--line:#E8E1D6;
 --band:#4C5BA8;--sun:#E0A32E;--sun-bg:#FDF3DE;--yes:#2F7D57;--yes-bg:#E8F4EC;
 --no:#B0463C;--no-bg:#FBECEA;
 --t1:9px;--t2:11px;--t3:13px;--t4:15px;--t5:18px;--t6:22px;--t7:28px;--t8:40px;--t9:52px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:var(--t4)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color:var(--ink);background:var(--paper);padding-top:env(safe-area-inset-top)}
.num{font-variant-numeric:tabular-nums}
header{padding:10px 14px 8px;background:var(--paper);position:relative;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{flex:1 1 auto;min-width:0}
.htitle b{display:block;font-size:var(--t5);font-weight:650;line-height:1.2}
.htitle span{display:block;font-size:var(--t3);color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font:inherit;font-size:var(--t3);font-weight:700;
 color:var(--muted);padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--band);color:#fff}
.track{height:6px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;background:var(--band);width:0;transition:width .5s}
/* v11: main used to start at y=0, under the header, so the first line of every
   screen was hidden. render() measures the header and sets --hh. */
main{position:absolute;left:0;right:0;bottom:0;top:var(--hh,74px);overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.pad{height:40px}
.wrap{max-width:520px;margin:0 auto}
.mhead{text-align:center;margin:16px 0 14px}
.mhead h1{margin:0;font-size:var(--t7);font-weight:650}
.mhead p{margin:4px 0 0;font-size:var(--t4);color:var(--ink2)}
.mhead .alt{font-size:var(--t3);color:var(--muted);margin-top:6px}
.paperbtn{display:flex;align-items:center;gap:12px;width:100%;padding:15px;margin:6px 0 16px;
 border-radius:18px;border:2px solid var(--sun);background:var(--sun-bg);cursor:pointer;
 font:inherit;text-align:left}
.paperbtn b{display:block;font-size:var(--t5);color:#6A4A05}
.paperbtn span{display:block;font-size:var(--t3);color:#8A6A25}
.camp{margin:0 0 6px}
.chead{display:flex;align-items:center;gap:11px;padding:12px 4px 8px}
.chead .em{font-size:var(--t6)}
.chead b{flex:1 1 auto;font-size:var(--t5);font-weight:650}
.chead small{font-size:var(--t3);color:var(--muted);display:block;font-weight:400}
.chead .cnt{font-size:var(--t3);color:var(--band);font-weight:700}
.slope{display:flex;flex-direction:column-reverse}
.stop{position:relative;display:flex;align-items:center;gap:11px;padding:7px 0}
.stop:before{content:"";position:absolute;left:23px;top:0;bottom:0;width:3px;background:var(--line)}
.stop.done:before{background:var(--band)}
.stop:first-child:before{top:50%}.stop:last-child:before{bottom:50%}
.pin{position:relative;z-index:2;width:48px;height:48px;border-radius:50%;flex:0 0 auto;
 display:flex;align-items:center;justify-content:center;font-size:var(--t4);font-weight:700;
 background:#fff;border:2.5px solid var(--line);cursor:pointer;font-family:inherit;color:var(--muted)}
.pin.done{border-color:var(--band);background:var(--band);color:#fff}
.pin.now{border-color:var(--band);color:var(--band);box-shadow:0 0 0 5px rgba(78,140,106,.16)}
.si{flex:1 1 auto;min-width:0;text-align:left}
.si b{display:block;font-size:var(--t4);font-weight:600}
.si span{display:block;font-size:var(--t2);color:var(--muted)}
.sc{font-size:var(--t3);color:var(--band);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:20px 16px;
 box-shadow:0 1px 2px rgba(27,36,48,.05),0 8px 24px rgba(27,36,48,.05);
 display:flex;flex-direction:column;align-items:center;text-align:center}
.step{font-size:var(--t3);color:var(--muted);text-align:center;margin:10px 0 12px}
.qbig{font-size:var(--t9);font-weight:600;line-height:1.1;letter-spacing:.01em;margin:14px 0}
.qmid{font-size:var(--t7);font-weight:600;margin:14px 0}
.hint{font-size:var(--t3);color:var(--muted);margin:0 0 4px}
.slot{min-height:56px;display:flex;align-items:center;justify-content:center;
 font-size:var(--t8);font-weight:600;color:var(--band);margin:2px 0 6px}
.slot.empty{color:var(--line)}
.slot.wrong{color:var(--no)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px;margin-top:8px}
.key{border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;
 font-size:var(--t6);font-weight:600;padding:14px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.key:active{transform:translateY(1px)}
.key.wide{grid-column:span 1}
.key.go{background:var(--band);color:#fff;border-color:var(--band)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-top:16px}
.opt{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px 8px;font:inherit;
 font-size:var(--t5);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.opt.yes{border-color:var(--yes);background:var(--yes-bg);color:var(--yes)}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.teach{font-size:var(--t4);line-height:1.6;margin:16px 6px 0;max-width:36ch;color:var(--ink)}
.code{font-size:var(--t2);color:var(--muted);letter-spacing:.04em;margin-top:14px}
.go2{width:100%;max-width:340px;border:0;border-radius:14px;background:var(--band);color:#fff;
 font:inherit;font-size:var(--t5);font-weight:700;padding:15px;margin-top:16px;cursor:pointer}
.go2.quiet{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
/* v11: the back button floated at the bottom left on top of the answers. It
   lives in the header now, left of the title. */
.back{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 font-size:var(--t6);line-height:1;color:var(--ink2);cursor:pointer;padding:0 0 3px}
.back[hidden]{display:none}
.tally{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tally i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tally i.on{background:var(--band)}.tally i.bad{background:var(--no)}
.note{margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--sun-bg);
 font-size:var(--t3);line-height:1.55;color:#6A4A05;max-width:36ch}
.timer{font-size:var(--t6);font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.timer.low{color:var(--no)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%;margin-top:12px}
.pg{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;
 font:inherit;font-size:var(--t2);color:var(--muted);cursor:pointer;padding:0}
.pg.ans{border-color:var(--band);color:var(--band);font-weight:700}
.pg.now{background:var(--band);color:#fff;border-color:var(--band)}
.res{text-align:center}.res .em{font-size:var(--t8)}
.res h2{margin:6px 0 2px;font-size:var(--t6)}
.res p{margin:0;color:var(--muted);font-size:var(--t4)}
.bar2{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px;width:100%;max-width:340px}
.bar2 i{display:block;height:100%;background:var(--band)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.phases{display:flex;gap:5px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.pz{font-size:var(--t2);color:var(--muted);padding:4px 10px;border-radius:999px;background:#fff;
 border:1.5px solid var(--line)}
.pz.on{background:var(--band);color:#fff;border-color:var(--band);font-weight:700}
.pz.past{color:var(--band);border-color:var(--band)}
.storyem{font-size:var(--t9);line-height:1;margin:8px 0 14px}
.storyline{font-size:var(--t5);line-height:1.55;margin:0;max-width:32ch;color:var(--ink)}
.steps{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:14px;text-align:left}
.stepline{border-left:3px solid var(--band);padding:8px 0 8px 12px}
.stepline b{display:block;font-size:var(--t6);color:var(--ink)}
.stepline span{display:block;font-size:var(--t4);color:var(--ink2);margin-top:3px;line-height:1.5}
.stepline i{display:block;font-style:normal;font-size:var(--t3);color:var(--muted);margin-top:5px;line-height:1.5}
.stepline.done{border-left-color:var(--line);opacity:.6}
.stepline.done b{font-size:var(--t5);color:var(--band)}
.guideq{font-size:var(--t5);line-height:1.5;margin:16px 4px 4px;max-width:32ch;color:var(--ink)}

.cover{text-align:center;padding-top:14px}
.covmark{font-size:56px;line-height:1}
.covh{margin:10px 0 2px;font-size:var(--t7);font-weight:650;line-height:1.2}
.covsub{margin:0 0 16px;font-size:var(--t4);color:var(--muted)}
.covcard{align-items:flex-start;text-align:left;gap:0}
.covwho{margin:0 0 12px;font-size:var(--t5);font-weight:600;line-height:1.45}
.covp{margin:0 0 11px;font-size:var(--t4);line-height:1.6;color:var(--ink2)}
.covsm{margin:4px 0 0;font-size:var(--t3);color:var(--muted)}
.wcard{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;
 border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.wcard.next{border-color:var(--band);background:#F2F8F4}
.wm{flex:0 0 auto;min-width:34px;height:34px;border-radius:10px;background:var(--sun-bg);color:#6A4A05;
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--t4)}
.wcard.next .wm{background:var(--band);color:#fff}
.wx{flex:1 1 auto;min-width:0}
.wx b{display:block;font-size:var(--t4);font-weight:600}
.wx small{display:block;font-size:var(--t2);color:var(--muted)}
.wa{color:var(--muted)}
.shelfh{margin:16px 0 4px;font-size:var(--t3);color:var(--muted)}
.strong{margin:0 0 6px;font-size:var(--t3);color:var(--ink2);line-height:1.6}
.sh{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-top:8px;
 border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.sh.open{border-color:var(--band);border-bottom-left-radius:0;border-bottom-right-radius:0}
.sh .em{font-size:var(--t6)}
.shx{flex:1 1 auto;min-width:0}
.shx b{display:block;font-size:var(--t4);font-weight:650}
.shx small{display:block;font-size:var(--t2);color:var(--muted)}
.shc{font-size:var(--t3);color:var(--band);font-weight:700}
.shbody{border:1.5px solid var(--band);border-top:0;border-radius:0 0 16px 16px;padding:4px;background:#fff}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:transparent;
 cursor:pointer;font:inherit;text-align:left;border-radius:11px}
.row:active{background:#F2F8F4}
.rm{flex:0 0 auto;width:22px;text-align:center;color:var(--muted)}
.row.done .rm{color:var(--band)}
.rx{flex:1 1 auto;min-width:0}
.rx b{display:block;font-size:var(--t4);font-weight:500}
.rx small{display:block;font-size:var(--t1);color:var(--muted);letter-spacing:.03em}
.rs{font-size:var(--t3);color:var(--band);font-weight:700}

.whybtn{margin-top:6px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
 font:inherit;font-size:var(--t2);color:var(--muted);padding:3px 11px;cursor:pointer}
.covlead{margin:0 0 18px;font-size:var(--t5);line-height:1.5;color:var(--ink)}
.covmore{margin-top:18px;border:0;background:transparent;font:inherit;font-size:var(--t3);
 color:var(--muted);text-decoration:underline;cursor:pointer}
.dgbar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.dgback{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 font-size:var(--t5);color:var(--ink2);cursor:pointer;flex:0 0 auto}
.dgback:disabled{opacity:.3}
.dgdots{flex:1 1 auto;display:flex;gap:5px;justify-content:center}
.dgdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dgdots i.on{background:var(--band)}
.dgdots i.now{box-shadow:0 0 0 3px rgba(78,140,106,.22)}
.dgn{font-size:var(--t3);color:var(--muted);flex:0 0 auto}
.shw{color:var(--band);font-weight:700}

.shdots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px}
.shdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.shdots i.on{background:var(--band)}
.gotline{margin:8px 0 0;font-size:var(--t3);color:var(--muted)}
.gotline b{font-size:var(--t5);color:var(--band)}
.go2.small{font-size:var(--t4);padding:11px;max-width:280px}

.artbox{width:100%;display:flex;justify-content:center;margin:4px 0 10px}
.art{width:100%;max-width:280px;height:auto;display:block}
.trap{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:10px 13px;border-radius:14px;
 background:var(--sun-bg);color:#6A4A05;font-size:var(--t3);line-height:1.5}
.nice{margin:0 0 10px;padding:9px 14px;border-radius:999px;background:var(--yes-bg);color:var(--yes);
 font-size:var(--t4);font-weight:700;text-align:center;animation:pop .22s ease}
.nice.fix{background:var(--sun-bg);color:#6A4A05}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.shfill{position:relative;flex:0 0 auto;width:34px;height:40px;border-radius:9px;background:var(--line);
 overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.shfill>span{position:absolute;left:0;right:0;bottom:0;background:var(--band);transition:height .4s ease}
.shfill b{position:relative;font-size:var(--t1);color:var(--ink);width:100%;text-align:center;padding-bottom:3px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;border:1.5px solid var(--line);
 background:#fff;cursor:pointer;font:inherit;text-align:left;padding:14px;
 display:flex;flex-direction:column;align-items:flex-start;overflow:hidden}
/* v9: 30px in a tile 170px across read as a stray character rather than
   an icon. Big enough to be the thing you look at, and pushed to the
   middle of the space above the label. */
.tem{font-size:52px;line-height:1;margin:6px auto 0;display:block}
.tname{margin-top:auto;padding-top:8px;font-size:var(--t4);font-weight:650;line-height:1.25;color:var(--ink)}
.tsub{font-size:var(--t2);color:var(--muted);margin-top:2px}
.tbar{width:100%;height:5px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--band);transition:width .4s ease}
.tnum{position:absolute;top:14px;right:14px;font-size:var(--t2);color:var(--muted);font-weight:700}
.sublist{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.subrow{display:flex;align-items:center;gap:11px;width:100%;padding:14px;border-radius:16px;
 border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.subrow.done{border-color:var(--band)}
.srm{flex:0 0 auto;width:24px;text-align:center;color:var(--muted);font-size:var(--t3)}
.subrow.done .srm{color:var(--band)}
.srx{flex:1 1 auto;min-width:0}
.srx b{display:block;font-size:var(--t4);font-weight:600}
.srx small{display:block;font-size:var(--t2);color:var(--muted)}
.srs{font-size:var(--t3);color:var(--band);font-weight:700}
.vidbox{margin:2px 0 12px}
.vidph{display:flex;align-items:center;gap:13px;padding:16px;border-radius:18px;
 border:2px dashed var(--line);background:#fff}
.vidplay{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--sun-bg);
 color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:var(--t5)}
.vidt b{display:block;font-size:var(--t4);font-weight:650}
.vidt small{display:block;font-size:var(--t2);color:var(--muted);letter-spacing:.02em}
.card.story{align-items:flex-start;text-align:left;flex-direction:row;gap:13px;padding:15px;margin-bottom:8px}
.card.story .storyem{font-size:28px;margin:0;line-height:1.1}
.card.story .storyline{font-size:var(--t4);line-height:1.55;max-width:none;margin:0}
.lh{margin:16px 0 8px;font-size:var(--t5);font-weight:650}
.card.artcard{padding:14px;margin-bottom:8px}
.card.lesson{align-items:stretch;text-align:left}
.card.lesson .qmid{text-align:center;margin:0 0 4px}
.go2.warm{background:var(--sun);color:#3B2A05}

.lh.first{margin-top:6px}
.vid{width:100%;border-radius:18px;display:block;background:#000;aspect-ratio:16/9}
.jumph{margin:14px 0 7px;font-size:var(--t3);color:var(--muted)}
.jumps{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.jump{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:13px;
 border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.jump:active{background:#F2F8F4}
.jt{flex:0 0 auto;font-size:var(--t2);color:var(--band);font-weight:700;min-width:32px}
.jx{flex:1 1 auto;font-size:var(--t3);color:var(--ink2);line-height:1.4}
.fallback{margin:0 0 10px;font-size:var(--t3);color:var(--muted);font-style:italic}

.lhsub{margin:-4px 0 8px;font-size:var(--t3);color:var(--muted);line-height:1.5}
.card.recall{align-items:stretch;text-align:left;padding:16px}
.card.recall .qmid{text-align:center;margin:0 0 10px;font-size:var(--t6)}
.rsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.rsteps li{font-size:var(--t5);font-weight:600;color:var(--ink);line-height:1.35}
.rsteps li::marker{color:var(--muted);font-size:var(--t3);font-weight:400}

.covart{width:100%;max-width:300px;height:auto;display:block;margin:6px auto 10px}
.covgot{margin:2px 0 0;font-size:var(--t3);color:var(--muted)}
.covgot b{font-size:var(--t6);color:var(--band);margin-right:5px}
.insideh{margin:26px 0 9px;font-size:var(--t3);color:var(--muted);font-weight:600;text-align:center}
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.ic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 6px;border-radius:16px;
 background:#fff;border:1.5px solid var(--line);font-size:var(--t2);color:var(--muted);
 text-align:center;line-height:1.3}
.ic b{font-size:var(--t6);color:var(--ink);font-weight:650}
.peek{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:23px}

  const row=pick(r,APOS);

          opts:shuffle(r,[row.a].concat(row.w)), a:row.a};
 },
 contract(r){
  const [full,short]=pick(r,CONTR);
  return {ask:"type", q:"Write the contracted form of <b>"+full+"</b>", a:short, hint:"Remember the apostrophe."};
 },
 func(r){
  const [s,f]=pick(r,FUNC);
  return {ask:"choose", sent:s, q:"What kind of sentence is this?",
          opts:shuffle(r,["statement","question","command","exclamation"]), a:f};
 },
 syn(r){
  const row=pick(r,SYN);
  return {ask:"choose", q:"Which word means the same as <b>"+row[0]+"</b>?",
          opts:shuffle(r,row.slice(1)), a:row[1]};
 },
 ant(r){
  const row=pick(r,ANT);
  return {ask:"choose", q:"Which word means the opposite of <b>"+row[0]+"</b>?",
          opts:shuffle(r,row.slice(1)), a:row[1]};
 },
 prefix(r){
  const [p,w,full]=pick(r,PREFIX);
  return {ask:"type", q:"Add a prefix to <b>"+w+"</b> to make it mean the opposite or undo it.",
          a:full, hint:"Write the whole word."};
 },
 suffix(r){
  const [w,s,full]=pick(r,SUFFIX);
  return {ask:"type", q:"Add the suffix <b>"+s+"</b> to <b>"+w+"</b>.", a:full, hint:"Watch the spelling."};
 },
 standard(r){
  const [sent,a]=pick(r,STD);
  const both=sent.match(/\|([^|]+)\|/)[1].split(" / ");
  return {ask:"choose", sent:sent.replace(/\|[^|]+\|/,"______"),
          q:"Which is Standard English?", opts:shuffle(r,both), a:a};
 },
 formal(r){
  const [inf,form]=pick(r,FORMAL);
  const others=shuffle(r,FORMAL.filter(x=>x[1]!==form)).slice(0,3).map(x=>x[1]);
  return {ask:"choose", q:"Which is the more formal word for <b>"+inf+"</b>?",
          opts:shuffle(r,others.concat([form])), a:form};
 },
 clause(r){
  const [sent,kind]=pick(r,CLAUSE);
  return {ask:"choose", sent:sent.replace(/\|/g,""), q:"The underlined part is a\u2026",
          opts:shuffle(r,["main clause","subordinate clause","relative clause","noun phrase"]),
          a:kind==="main"?"main clause":kind==="subordinate"?"subordinate clause":
            kind==="relative"?"relative clause":"noun phrase", marked:sent};
 },
 tense(r){
  const [sent,ans,name]=pick(r,TENSE);
  const w=sent.match(/\|([^|]+)\|/)[1];
  /* v11: every marked verb became a blank but only the first was asked for,
     so "Oliver ______ proud when he ______ his medal" had two gaps and one
     answer box. The other verbs are now shown already in the right tense. */
  let k=0;
  return {ask:"type", sent:sent.replace(/\|([^|]+)\|/g,()=>k++===0?"______":ans[k-1]),
          q:"Put <b>"+w+"</b> into the "+name+" tense.", a:ans[0], hint:"One word, or two if it needs a helper."};
 },
 modal(r){
  const [sent,deg]=pick(r,MODAL);
  const w=sent.match(/\|([^|]+)\|/)[1];
  return {ask:"choose", sent:sent.replace(/\|/g,""),
          q:"What does <b>"+w+"</b> show?", opts:shuffle(r,["certain","possible","expected"]), a:deg};
 },
 voice(r){
  const [a,b,kind]=pick(r,VOICE);
  return {ask:"choose", sent:a, q:"Is this sentence active or passive?",
          opts:["active","passive"], a:kind};
 },
 spell(r,lvl,code){
  const set=code?SPELL.filter(s=>s.c===code)[0]:pick(r,SPELL);
  const [w,sent]=pick(r,set.w);
  return {ask:"type", sent:sent, q:"Write the missing word.", a:w,
          hint:set.r, clip:"spell/"+w+".mp3"};
 },
};

/* ================= the shell =================
   Lifted from the maths app on purpose: same cover, same name prompt, same
   tiles, same subtopic page, same phases, same paper. Two courses that feel
   like one product is the point. */
/* v2: English only. In the maths app the French earned its place — the maths
   is language-independent, so a French-speaking child can genuinely do it in
   French. Here the subject IS English: answering "quel type de phrase" about
   an English sentence makes a child translate on top of the grammar, and the
   test they are sitting is in English. The French strings stay in the file so
   nothing had to be rewritten; nothing reads them. */
const L="en";
const t=k=>(T[k]||{})[L]||(T[k]||{}).en||k;
const w=(o,k)=>o[k+"_"+L]!==undefined?o[k+"_"+L]:o[k+"_en"];
const KEY="oh-en.v1";
let S=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{d:{},b:{},p:[]}}catch(e){return{d:{},b:{},p:[]}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ALL=[]; CAMPS.forEach((c,ci)=>c.stops.forEach((s,si)=>ALL.push(Object.assign({},s,{id:c.id+"."+si,camp:ci}))));
const BANDS=["#4C5BA8"];
const esc=s=>(s===undefined||s===null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const norm=x=>String(x).replace(/\s+/g," ").trim().toLowerCase().replace(/[.!?]$/,"").replace(/\u2019/g,"'");
const byId=id=>ALL.filter(s=>s.id===id)[0];
/* v11: lessons were keyed by generator, so the eleven spelling subtopics all
   showed the -tion lesson ("Silent letters" taught shun endings), the four
   punctuation subtopics all showed paired commas, and the eight word classes
   shared one lesson. A lesson can now be written for one subtopic, keyed
   "generator:arg" (e.g. "spell:S60", "wordClass:adverb"), and a subtopic with
   no lesson of its own falls back to the generator's. */
const LK=s=>s.arg===undefined?s.g:s.g+":"+(s.arg===null?"mixed":s.arg);
const LESSON=s=>TEACH[LK(s)]||TEACH[s.g];
const VIDEO={};
const mmss=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
/* ---------- hearing the word ----------
   Spelling is dictated in the real test: the child hears a word, sees the
   sentence with a gap, and writes it. Until the recordings exist the phone
   reads it, which is enough to check the course and enough for a child to
   practise with. AUDIO[word] takes a real file the moment there is one, and
   the recorded voice is preferred over the synthetic one automatically. */
const AUDIO={};   /* e.g. "rough":"audio/rough.mp3" */
function say(word){
 const w=String(word).trim();
 if(AUDIO[w]){ try{ new Audio(AUDIO[w]).play(); return }catch(e){} }
 try{
  const ss=window.speechSynthesis;
  if(!ss||typeof SpeechSynthesisUtterance==="undefined") return;
  ss.cancel();
  const u=new SpeechSynthesisUtterance(w);
  u.lang="en-GB"; u.rate=0.85;
  ss.speak(u);
 }catch(e){}
}
function sayTwice(word,sentence){
 say(word);
 if(sentence){ setTimeout(()=>say(sentence.replace(/_+/g,word)), 1200); }
}

/* ================= who is using this =================
   Asking a child their name once per course is the app admitting it does not
   know who is using it. Inside Notice Me the child has already been chosen, so
   the host tells the course and the course never asks. Opened on its own there
   is nothing to ask about either — a name prompt in front of a revision app is
   a form standing between a child and the thing they came for.
   The Pular course keeps its prompt: that one is most often used alone, and
   there the greeting is the point rather than an obstacle. */
const COURSE="english";
/* ================= One Hundred \u2014 the house brand =================
   Shared by both courses. Notice Me is deliberately untouched: if this earns
   its place here, it can move up later.

   The rule is that ONE layer changes between courses \u2014 a hue, a hat, a motif.
   Everything else (type, spacing, radius, card, shadow, the character himself)
   is identical, so the two read as siblings at a glance and are never confused
   for each other. */
const BRAND = {
  maths:  { hue:"#2F7D62", hue2:"#E7F2EC", ink:"#16302A", hat:"cap",
            warm:"#E8A33C", warmBg:"#FCF2E0", name:"Maths" },
  english:{ hue:"#4C5BA8", hue2:"#EAECF8", ink:"#1C2140", hat:"mortar",
            warm:"#E8A33C", warmBg:"#FCF2E0", name:"English" },
};
/* The ground is a warm off-white, not the cold grey it was. A child's app
   should feel like paper, not like a dashboard. */

/* ---------- the character ----------
   One hare across both courses, wearing what he is teaching. Drawn rather than
   borrowed: an emoji is somebody else's artwork and renders differently on
   every phone, which is why the shelf looked unfinished.
   Poses: hello, think, cheer, point. Same construction every time \u2014 only the
   ears, the arm and the mouth move, so he is recognisably one animal. */
function MASCOT(pose, course, size){
  const B=BRAND[course]||BRAND.maths;
  const s=size||120;
  /* A crow. Counts, uses tools, solves puzzles, and has a hard enough
     silhouette not to read as soft \u2014 which matters for ten and eleven year
     olds, who resent being talked down to more than any other age.
     Two tones and one dark eye, same construction in every pose, so he is
     recognisably one bird whichever hat he is wearing. */
  const dk="#2B303B", md="#3C4352", lt="#4E5666", beak=B.warm, D="#1A1D24";
  /* Wings grow out of the body rather than floating beside it, and there is a
     tail, so the silhouette is a bird rather than two stacked circles. */
  const wing = pose==="cheer"
    ? `<path d="M70 126 C50 118 38 100 48 92 C58 84 68 106 78 124 Z" fill="${md}"/>
       <path d="M130 126 C150 118 162 100 152 92 C142 84 132 106 122 124 Z" fill="${md}"/>`
    : pose==="point"
    ? `<path d="M64 126 C52 122 48 136 60 142 C70 147 76 136 74 126 Z" fill="${md}"/>
       <path d="M136 124 C158 116 176 96 168 86 C160 76 142 92 132 116 Z" fill="${md}"/>
       <circle cx="172" cy="83" r="5.5" fill="${beak}"/>`
    : `<path d="M64 126 C52 122 48 136 60 142 C70 147 76 136 74 126 Z" fill="${md}"/>
       <path d="M136 126 C148 122 152 136 140 142 C130 147 124 136 126 126 Z" fill="${md}"/>`;
  /* The tail sat low and to the right, where it read as a single leg. It is
     up and back now, and he has two actual feet. */
  const tail = `<path d="M144 128 C166 122 186 124 190 132 L150 148 Z" fill="${dk}"/>`;
  const feet = `<path d="M84 166 L84 174 M76 176 L84 174 L92 176" stroke="${beak}" stroke-width="4.5"
      fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 166 L116 174 M108 176 L116 174 L124 176" stroke="${beak}" stroke-width="4.5"
      fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  /* The head is front-on, so the beak must come FORWARD from between the eyes,
     not sideways off the cheek. Drawing a profile beak on a face looking at you
     is why he looked wrong: two viewpoints in one head.
     The head spans y 41 to 107. Every hat is therefore built to sit across
     y 26 to 58 so it overlaps the crown and rests on it, rather than hovering
     above it or being pasted flat across it. */
  const head = pose==="think" ? `rotate(-8 100 74)` : `rotate(0 100 74)`;
  const beakShape = `<path d="M88 82 L100 106 L112 82 Z" fill="${beak}"/>
    <path d="M92 94 L100 106 L108 94 Z" fill="#C07C1F"/>`;
  const eyes = pose==="think"
    ? `<circle cx="85" cy="70" r="8" fill="#fff"/><circle cx="87" cy="71" r="4.4" fill="${D}"/>
       <circle cx="115" cy="70" r="8" fill="#fff"/><circle cx="117" cy="71" r="4.4" fill="${D}"/>
       <path d="M74 56 C79 51 90 51 95 55" stroke="${D}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : pose==="cheer"
    ? `<path d="M77 70 C81 62 91 62 95 70" stroke="${D}" stroke-width="3.8" fill="none" stroke-linecap="round"/>
       <path d="M105 70 C109 62 119 62 123 70" stroke="${D}" stroke-width="3.8" fill="none" stroke-linecap="round"/>`
    : `<circle cx="85" cy="70" r="8.5" fill="#fff"/><circle cx="86" cy="71" r="4.6" fill="${D}"/>
       <circle cx="115" cy="70" r="8.5" fill="#fff"/><circle cx="116" cy="71" r="4.6" fill="${D}"/>`;
  /* Both hats are cut to the crown: the base line dips to y=58, well inside the
     head, so the head shows through beneath them and they look worn. */
  const hat = B.hat==="cap"
    ? `<g transform="rotate(-7 100 44)">
        <path d="M66 56 C66 33 82 24 100 24 C118 24 134 33 134 56 C120 51 80 51 66 56 Z" fill="${B.hue}"/>
        <path d="M124 52 C142 50 156 52 158 57 C150 61 134 61 124 58 Z" fill="${B.hue}"/>
        <circle cx="100" cy="26" r="4.5" fill="${B.warm}"/></g>`
    : `<g transform="rotate(-6 100 42)">
        <path d="M70 50 C70 34 84 28 100 28 C116 28 130 34 130 50 C116 46 84 46 70 50 Z" fill="${B.hue}" opacity=".95"/>
        <path d="M58 44 L100 29 L142 44 L100 59 Z" fill="${B.hue}"/>
        <path d="M139 45 L139 64" stroke="${B.warm}" stroke-width="3" stroke-linecap="round"/>
        <circle cx="139" cy="66" r="4.2" fill="${B.warm}"/></g>`;
  return `<svg class="mascot" viewBox="0 0 200 175" width="${s}" height="${s*0.875}"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
   ${tail}
   ${feet}
   <path d="M100 94 C134 94 154 116 154 140 C154 159 128 169 100 169 C72 169 46 159 46 140 C46 116 66 94 100 94 Z" fill="${dk}"/>
   <path d="M100 116 C116 116 126 130 126 144 C126 157 114 163 100 163 C86 163 74 157 74 144 C74 130 84 116 100 116 Z" fill="${lt}" opacity=".5"/>
   ${wing}
   <g transform="${head}">
    <ellipse cx="100" cy="74" rx="36" ry="33" fill="${dk}"/>
    ${beakShape}
    ${eyes}
    ${hat}
   </g>
  </svg>`;
}

/* ================= telling Notice Me what was done =================
   The same arrangement the Fulfulde course uses: when this app is opened in a
   frame it posts the whole list of finished subtopics to the parent, which
   marks the ones it does not yet have. The whole list rather than the newest,
   so a child who worked through three offline is not missing two when they
   next connect. It posts only to its own origin and only when framed; opened
   on its own this does nothing. */

  if(window.parent===window) return;

const DIAG=[
 {g:"spell",en:"Spelling",fr:"Orthographe",hot:20},
 {g:"punct",en:"Commas and brackets",fr:"Virgules et parenth\u00e8ses",hot:14},
 {g:"wordClass",en:"Word classes",fr:"Classes de mots",hot:13},
 {g:"apostrophe",en:"Apostrophes",fr:"Apostrophes",hot:12},
 {g:"syn",en:"Synonyms",fr:"Synonymes",hot:11},
 {g:"clause",en:"Clauses",fr:"Propositions",hot:10},
 {g:"voice",en:"Active and passive",fr:"Actif et passif",hot:9},
 {g:"tense",en:"Tense",fr:"Les temps",hot:8},
 {g:"func",en:"Kinds of sentence",fr:"Types de phrases",hot:7},
 {g:"standard",en:"Standard English",fr:"Anglais standard",hot:6}];
function startDiag(){
 S.seen=1;save();
 const seed=Date.now()%99991;
 V={s:"diag",i:0,typed:"",res:[],qs:DIAG.map((d,k)=>GEN[d.g](R(seed+k*7919),1))};
 render();
}
function diagHTML(){
 if(V.i>=DIAG.length) return diagResult();
 const q=V.qs[V.i];
 return `<div class="wrap">
  <div class="mhead"><h1>${esc(t("dgtitle"))}</h1><p>${esc(t("dgsub"))}</p></div>
  <div class="dgbar">
   <button class="dgback" onclick="diagBack()" ${V.i===0?"disabled":""}>\u2039</button>
   <div class="dgdots">${DIAG.map((_,k)=>`<i class="${V.res[k]===undefined?"":"on"}${k===V.i?" now":""}"></i>`).join("")}</div>
   <span class="dgn num">${V.i+1}/${DIAG.length}</span></div>
  <div class="card">${qBody(q,true)}</div>
  <button class="go2 quiet" onclick="diagSkip()">${esc(t("dgskip"))}</button></div>`;
}
function diagCheck(ok){ V.res[V.i]=ok; V.typed=""; V.pick=null; V.i++; render(); }
function diagSkip(){ V.res[V.i]=false; V.typed=""; V.pick=null; V.i++; render(); }
function diagBack(){ if(V.i>0){V.i--;V.typed="";V.pick=null} render(); }
function diagResult(){
 const weak=DIAG.map((d,k)=>({d,ok:V.res[k]===true})).filter(x=>!x.ok).sort((a,b)=>b.d.hot-a.d.hot);
 const strong=DIAG.filter((d,k)=>V.res[k]===true);
 S.weak=weak.map(x=>x.d.g); save();
 return `<div class="wrap"><div class="mhead"><h1>${esc(t("dgdone"))}</h1><p>${esc(t("dgsub2"))}</p></div>
  ${weak.map(x=>{const st=ALL.filter(s=>s.g===x.d.g)[0];
   return `<button class="wcard" onclick="openStop('${st?st.id:ALL[0].id}')">
    <span class="wm">\u25b6</span><span class="wx"><b>${esc(x.d[L]||x.d.en)}</b>
    <small>${esc(t("marks"))}</small></span><span class="wa">\u203a</span></button>`}).join("")}
  ${strong.length?`<p class="shelfh">${esc(t("strong"))}</p>
   <p class="strong">${strong.map(d=>esc(d[L]||d.en)).join(" \u00b7 ")}</p>`:""}
  <button class="go2 quiet" onclick="goShelf()">${esc(t("covbrowse"))}</button></div>`;
}

/* ================= today =================
   The courses were a library: forty-odd subtopics, hundreds of questions, no
   unit of work and no stopping point, so a child never knew how much was
   enough. Attainment at this age comes from short regular practice rather
   than from access to material, so there is now a session: ten questions,
   about five minutes, drawn from what they have not finished. Finish it and
   the streak goes up. */
const TODAY=()=>new Date().toISOString().slice(0,10);
function streakInfo(){
 const last=S.lastDay, st=S.streak||0, today=TODAY();
 if(last===today) return {n:st, doneToday:true};
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 return {n:(last===y?st:0), doneToday:false};
}
function startSession(){
 const seed=Date.now()%99991;
 const pool=ALL.filter(s=>!S.d[s.id]);
 const from=(pool.length?pool:ALL).slice(0,12);
 const qs=[];
 for(let i=0;i<10;i++){
  const s=from[i%from.length];
  qs.push({s:s, q:GEN[s.g](R(seed+i*7919), i<3?1:(s.lvl||1), s.arg)});
 }
 V={s:"session",i:0,qs:qs,right:0,typed:"",pick:null,miss:0,shown:false};
 render();
}
function sessionHTML(){
 if(V.i>=V.qs.length) return sessionDone();
 const cur=V.qs[V.i];
 V.q=cur.q;
 const dots=V.qs.map((_,k)=>`<i class="${k<V.i?"on":""}"></i>`).join("");
 return `<div class="wrap">
  <p class="step">${esc(t("todays"))} \u00b7 ${V.i+1} ${esc(t("of"))} ${V.qs.length}</p>
  <div class="sesbar"><i style="width:${V.i/V.qs.length*100}%"></i></div>
  <p class="sestop">${esc(cur.s[L]||cur.s.en)}</p>
  <div class="card">${!V.shown&&V.miss>=2?stuckNote(LESSON(cur.s),"sesShow"):""}
   ${V.shown
   ? `<div class="reveal"><p class="rl">${esc(t("theans"))}</p>
      <p class="ra">${esc(Array.isArray(cur.q.a)?cur.q.a.join(", "):cur.q.a)}</p></div>`
   : SESBODY(cur.q)}
   <div class="tally">${dots}</div></div>
  ${V.shown?`<button class="go2" onclick="sesNext()">${esc(t("moveon"))}</button>`:""}
  </div>`;
}
function sesShow(){V.shown=true;render()}
function sesNext(){V.shown=false;V.i++;V.typed="";V.pick=null;V.miss=0;render()}
function sessionDone(){
 const today=TODAY();
 if(S.lastDay!==today){
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.lastDay===y?(S.streak||0):0)+1;
  S.lastDay=today; S.sessions=(S.sessions||0)+1; save();
 }
 const st=S.streak||1;
 return `<div class="wrap cover">
  ${MASCOT("cheer",COURSE,150)}
  <h1 class="covh">${esc(t("sesdone"))}</h1>
  <p class="covsub num">${V.right} ${esc(t("of"))} ${V.qs.length}</p>
  <div class="streakbig"><span class="sflame">\u{1f525}</span>
   <b class="num">${st}</b><span>${esc(st===1?t("day1"):t("days"))}</span></div>
  <button class="go2" onclick="goShelf()">${esc(t("back"))}</button></div>`;
}

function newQ(){const s=byId(V.id);V.q=GEN[s.g](R(Date.now()%99991+V.i*7919),s.lvl||1,s.arg);V.typed="";V.pick=null;V.miss=0}

   file name), then timecodes, then the bare steps under "not for learning

function checkGuided(){
 const el=document.getElementById("win"); if(el) V.typed=el.value;
 const T2=LESSON(byId(V.id)), steps=T2.guided.steps;
 if(!V.typed.trim()) return;
 if(norm(V.typed)===norm(steps[Math.min(V.g,steps.length-1)].a)){
  V.g++; V.typed=""; V.miss=0;
  if(V.g>=steps.length){V.ph="drill";V.i=0;V.bad=0;newQ();S.at={id:V.id,ph:"drill",i:0};save()}
 } else { V.miss++; V.typed=""; }

function phaseBar(n){
 const ks=[{en:"Learn it",fr:"Apprendre"},{en:"Together",fr:"Ensemble"},{en:"On your own",fr:"\u00c0 toi"}];
 return `<div class="phases">${ks.map((k,i)=>
  `<span class="pz${i===n?" on":""}${i<n?" past":""}">${esc(k[L]||k.en)}</span>`).join("")}</div>`;
}
/* ---------- the question surfaces ---------- */
function qBody(q,isDiag){
 const done=isDiag?"diagCheck":"answer";
 if(q.ask==="tapWords"){
  const parts=q.sent.split("|");
  const picked=V.pick||[];
  return `<p class="hint">${esc(q.hint)}</p><p class="sent">${parts.map((p,i)=>
   i%2===1?`<button class="tw${picked.includes(p)?(q.a.includes(p)?" on":" bad"):""}"
    onclick="tapWord('${p.replace(/'/g,"\\'")}','${done}')">${esc(p)}</button>`:esc(p)).join("")}</p>`;
 }
 if(q.ask==="tapGaps"){
  /* v11: the only gap drawn was the right one, so one tap always scored and
     the question taught nothing. Now there is a gap between every pair of
     words; the right ones show the mark when tapped, a wrong one turns red. */
  const G=gapModel(q.sent), picked=V.pick||[];
  return `<p class="hint">${esc(q.hint)}</p><p class="sent gaps">${G.words.map((wd,i)=>{
   if(i===G.words.length-1) return esc(wd);
   const sl=G.slots[i], on=picked.includes(i);
   return esc(wd)+`<button class="gap${on?(sl.ok?" ok":" no"):""}" aria-label="gap after ${esc(wd)}"
    onclick="tapGap(${i},'${done}')">${on&&sl.ok?esc(sl.mark):""}</button>`;
  }).join("")}</p>`;
 }
 if(q.ask==="choose"){
  /* v11: "the underlined part" was asked about with nothing underlined */
  const sentHTML=q.marked?q.marked.split("|").map((p,i)=>i%2?`<u>${esc(p)}</u>`:esc(p)).join(""):esc(q.sent||"");
  return `${q.sent?`<p class="sent">${sentHTML}</p>`:""}
   <p class="qq">${q.q}</p>
   <div class="opts">${q.opts.map(o=>`<button class="opt${V.pick===o?(o===q.a?" yes":" no"):""}"
    onclick="tapOpt('${String(o).replace(/'/g,"\\'")}','${done}')">${esc(o)}</button>`).join("")}</div>`;
 }
 /* type */
 return `${q.sent?`<p class="sent">${esc(q.sent)}</p>`:""}
  <p class="qq">${q.q}</p>
  ${q.clip?`<button class="listen" onclick="sayTwice('${String(q.a).replace(/'/g,"\\'")}','${String(q.sent||"").replace(/'/g,"\\'")}')">
   <span>\u{1f50a}</span>${esc(t("listen"))}</button>
   <p class="covsm">${esc(t("saysyn"))}</p>`:""}
  <input class="wordin" id="win" type="text" value="${esc(V.typed)}" oninput="V.typed=this.value"
   placeholder="\u2026" autocapitalize="none" autocorrect="off" spellcheck="false">
  <button class="go2" onclick="typeCheck('${done}')">${esc(t("check"))}</button>
  ${q.hint?`<p class="covsm">${esc(q.hint)}</p>`:""}`;
}
function tapWord(word,done){
 const q=V.q||V.qs[V.i]; if(!V.pick)V.pick=[];
 if(!V.pick.includes(word))V.pick.push(word);
 const need=q.a;
 if(need.every(x=>V.pick.includes(x))){
  const clean=!V.pick.some(x=>!need.includes(x));
  finish(clean,done);
 } else if(V.pick.some(x=>!need.includes(x))){ V.miss=(V.miss||0)+1; markWrong(done); }
 render();
}
/* The sentence without its marks, split into words, with a slot after every
   word but the last. A slot is right if the mark was written straight after
   that word, so "Pepper |(|a black cat" puts the bracket in the gap after
   Pepper and "ready|-|made" puts the hyphen after ready. */
function gapModel(sent){
 const parts=String(sent).split("|"), words=[], slots=[];
 parts.forEach((p,i)=>{
  if(i%2===1){ if(words.length) slots[words.length-1]={ok:true,mark:p.trim()}; return; }
  p.split(/\s+/).filter(Boolean).forEach(wd=>{ words.push(wd); slots[words.length-1]=slots[words.length-1]||{ok:false}; });
 });
 /* a word split by a hyphen mark ("ready|-|made") arrives as two words */
 return {words, slots:words.map((_,i)=>slots[i]||{ok:false})};
}
function tapGap(i,done){
 const q=V.q||V.qs[V.i]; if(!V.pick)V.pick=[];
 if(V.pick.includes(i)) return;
 V.pick.push(i);
 const G=gapModel(q.sent), need=G.slots.map((s,k)=>s.ok?k:-1).filter(k=>k>=0);
 if(!G.slots[i].ok){ V.miss=(V.miss||0)+1; markWrong(done); }
 if(need.every(k=>V.pick.includes(k))) finish(!V.pick.some(k=>!G.slots[k].ok),done);
 render();
}
function tapOpt(o,done){
 const q=V.q||V.qs[V.i];
 V.pick=o;
 finish(String(o)===String(q.a),done);
 render();
}
function typeCheck(done){
 const el=document.getElementById("win"); if(el) V.typed=el.value;
 if(!V.typed.trim()) return;
 const q=V.q||V.qs[V.i];
 finish(norm(V.typed)===norm(q.a),done);
 render();
}
function markWrong(done){ if(done==="answer"){V.bad=(V.bad||0)+1} }
function finish(ok,done){
 if(done==="session"){
  if(ok){ V.right++; sesNext(); }
  else { V.miss=(V.miss||0)+1; V.typed=""; V.pick=null; }
  return;
 }
 if(done==="diagCheck"){ diagCheck(ok); return; }
 if(ok){ advance(); }
 else { V.bad=(V.bad||0)+1; V.miss=(V.miss||0)+1; V.typed=""; V.pick=null; }
}
/* v2: a wrong answer used to keep a child on the same question for ever. There
   was no skip and no reveal, so the only way out of a spelling you did not
   know was to close the app. Three wrong and the answer is offered; taking it
   costs the mark and moves on, which is what a teacher would do. */
function giveUp(){ V.shown=true; render(); }
function moveOn(){ V.shown=false; V.bad=(V.bad||0)+1; advance(); render(); }
function drillHTML(s,T2){
 const q=V.q, dots=Array.from({length:s.n}).map((_,k)=>`<i class="${k<V.i?"on":""}"></i>`).join("");
 return `<div class="wrap"><p class="step">${esc(s[L]||s.en)} \u00b7 ${V.i+1} ${esc(t("of"))} ${s.n}</p>
  ${phaseBar(2)}
  <div class="card">${!V.shown&&V.miss>=2?stuckNote(T2,"giveUp",V.bad>=3?againBtn(s):""):""}
   ${V.shown?"":qBody(q,false)+peekHTML(T2)}
   ${V.shown?`<div class="reveal"><p class="rl">${esc(t("theans"))}</p>
     <p class="ra">${esc(Array.isArray(q.a)?q.a.join(", "):q.a)}</p>
     ${q.clip||q.ask==="type"?`<button class="listen" onclick="say('${String(q.a).replace(/'/g,"\\'")}')">
      <span>\u{1f50a}</span>${esc(t("hearit"))}</button>`:""}</div>`:""}
   ${!V.shown&&V.miss<2&&V.bad>=3?againBtn(s):""}
   <div class="tally">${dots}</div></div>
  ${V.shown?`<button class="go2" onclick="moveOn()">${esc(t("moveon"))}</button>`:""}
  </div>`;
}
/* v11: the hint and the way out sit at the top of the card, where a stuck child
   is looking; under the answers they were often off the bottom of the screen. */
function stuckNote(T2,giveFn,extra){
 const txt=T2?w(T2.steps[0],"why"):"";
 return `<div class="note stuck">${txt?`<span>${esc(t("look"))} \u2014 ${esc(txt)}</span>`:""}
  <span class="stuckbtns"><button class="go2 quiet small" onclick="${giveFn}()">${esc(t("giveup"))}</button>${extra||""}</span></div>`;
}
function againBtn(s){
 return `<button class="go2 warm small" onclick="backToLesson()">${(VIDEO[s.g]||{})[L]?"\u25b6 "+esc(t("vidagain")):esc(t("exagain"))}</button>`;
}
function advance(){
 const s=byId(V.id); V.i++; V.typed=""; V.pick=null; V.miss=0; V.shown=false;
 S.at={id:V.id,ph:"drill",i:V.i}; save();
 if(V.i>=s.n){ S.d[s.id]=1; S.b[s.id]=Math.max(S.b[s.id]||0,Math.max(0,s.n-V.bad)); save(); tellHost(); V.ph="done"; }
 else newQ();
}
function doneHTML(s){
 return `<div class="wrap"><div class="card res"><div class="em">\u2713</div>
  <h2>${esc(t("camp"))}</h2><p class="num">${S.b[s.id]||0} ${esc(t("of"))} ${s.n}</p></div>
  <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
  <button class="go2 quiet" onclick="openStop('${V.id}')">${esc(t("again"))}</button></div>`;
}
function resume(){
 const a=S.at; if(!a)return; const s=byId(a.id); if(!s)return;
 openStop(a.id);
 if(a.ph==="drill"){V.ph="drill";V.i=Math.min(a.i,s.n-1);V.bad=0;newQ()}
 else if(a.ph==="guided") toGuided();
 render();
}
/* ---------- the whole paper: 50 questions, 45 minutes ---------- */
const PAPERMIX=["punct","wordClass","apostrophe","syn","clause","func","standard","tense",
 "voice","prefix","suffix","contract","wcName","modal","ant","formal","punct","wordClass","spell","spell"];
let TID=null;
function openPaper(){
 const seed=Date.now()%99991, qs=[];
 for(let i=0;i<50;i++){ const g=PAPERMIX[i%PAPERMIX.length];
  qs.push(Object.assign(GEN[g](R(seed+i*7919),1),{m:1})); }
 V={s:"paper",qs,i:0,ans:qs.map(()=>null),t0:Date.now(),mark:null,typed:"",pick:null};
 tick(); render();
}
function tick(){ clearInterval(TID); TID=setInterval(()=>{
 if(V.s!=="paper"||V.mark){clearInterval(TID);return}
 const left=2700-Math.floor((Date.now()-V.t0)/1000);
 if(left<=0){clearInterval(TID);markPaper();return}
 const e=document.getElementById("clk");
 if(e){e.textContent=mmss(left); e.className="timer"+(left<300?" low":"")}
},500) }
function paperHTML(){
 if(V.mark!==null){
  return `<div class="wrap"><div class="card res"><div class="em">\u{1f4c4}</div>
   <h2 class="num">${V.mark} / 50</h2><p>${esc(t("score"))}</p>
   <div class="bar2"><i style="width:${Math.round(V.mark/50*100)}%"></i></div></div>
   <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
   <button class="go2 quiet" onclick="openPaper()">${esc(t("again"))}</button></div>`;
 }
 const q=V.qs[V.i];
 return `<div class="wrap">
  <div class="step" style="display:flex;justify-content:space-between;align-items:center">
   <span>${V.i+1} ${esc(t("of"))} 50</span><span class="timer" id="clk">45:00</span></div>
  <div class="card">${qBody(q,false).replace(/'answer'/g,"'paper'")}
   <div class="pgrid">${V.qs.map((_,k)=>`<button class="pg${V.ans[k]!==null?" ans":""}${k===V.i?" now":""}"
    onclick="pgo(${k})">${k+1}</button>`).join("")}</div></div>
  <button class="go2 quiet" onclick="markPaper()">${esc(t("finish"))}</button></div>`;
}
function pgo(k){V.i=k;V.typed="";V.pick=null;render()}
function markPaper(){
 let m=0; V.ans.forEach(a=>{if(a===true)m++});
 V.mark=m; S.p=(S.p||[]).concat([m]); save(); render();
}
/* in the paper, an answer is recorded and it moves on \u2014 no marking as you go */
const _finish=finish;
finish=function(ok,done){
 if(done==="paper"){ V.ans[V.i]=ok; V.typed=""; V.pick=null;
  if(V.i<49) V.i++; render(); return; }
 _finish(ok,done);
};
render();


</script></body></html>
