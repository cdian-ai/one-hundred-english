<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Hundred — Year 6 SATs English</title><meta name="theme-color" content="#5B6BAE">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="100 English">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* v2: the Woven design from Claude Design (One Hundred, turn 2): square corners,
   2px ink rules, a woven band in the course colour (indigo for English),
   progress as ten blocks with block 8 as the "ready" line. Nunito, so it reads
   as part of Notice Me. */
:root{
  --page:#dcdada; --ground:#f3f2f2; --tile:#ffffff; --ink:#201e1d; --muted:#4a4645; --outline:#7d7979; --try:#eae9e9;
  --brand:#5B6BAE; --acc:#4a59a0; --tint:#e6e8f4; --acc-ink:#ffffff; --nu:#aab4ec; --nu2:#4a59a0; --warm:#E8A33C;
  --dark-panel:#201e1d; --dark-ink:#f3f2f2;
  --band-c:var(--acc); --line:var(--outline); --sun:var(--warm); --scree:var(--muted);
  --f:"Nunito","Helvetica Neue",Arial,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0f0e0d; --ground:#1a1817; --tile:#262322; --ink:#f3f2f2; --muted:#bab6b6; --outline:#9b9797; --try:#34312f;
  --acc:#a3aff0; --tint:#2f3140; --acc-ink:#1a1817; --dark-panel:#0f0e0d; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0f0e0d; --ground:#1a1817; --tile:#262322; --ink:#f3f2f2; --muted:#bab6b6; --outline:#9b9797; --try:#34312f;
  --acc:#a3aff0; --tint:#2f3140; --acc-ink:#1a1817; --dark-panel:#0f0e0d; color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.5 var(--f)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:900;line-height:1.15;text-wrap:balance}
p{margin:0}
.app{max-width:560px;margin:0 auto;background:var(--ground);min-height:100vh;display:flex;flex-direction:column}
@media (min-width:600px){.app{border-left:2px solid var(--ink);border-right:2px solid var(--ink)}}
.band{height:12px;flex:none;background:repeating-linear-gradient(90deg,var(--acc) 0 12px,var(--ink) 12px 15px,var(--tint) 15px 27px,var(--ink) 27px 30px)}
.top{position:sticky;top:0;z-index:5;background:var(--ground);padding-top:env(safe-area-inset-top,0px)}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:62px;border-bottom:2px solid var(--ink)}
.hdr .ttl{flex:1;display:flex;flex-direction:column;line-height:1.2;min-width:0}
.hdr .ttl b{font-size:19px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .ttl span{font-size:14px;color:var(--muted);font-weight:600}
.backb{width:44px;height:44px;border:2px solid var(--ink);background:var(--tile);display:grid;place-items:center;cursor:pointer;flex:none}
.view{flex:1;padding:14px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.nu{flex:none;display:block}
.greet{display:flex;gap:12px;align-items:center}
.greet p{font-size:18px;line-height:1.4;font-weight:700}
.btn{min-height:56px;width:100%;border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;text-align:left;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--tile);color:var(--ink);border-color:var(--ink);min-height:52px;font-size:16px}
.btn.sec:hover{filter:none;background:var(--try)}
.btn.mid{justify-content:center}
.btn.quiet{background:none;border-color:transparent;color:var(--muted);min-height:44px;justify-content:center;font-size:15px;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{aspect-ratio:1.15;background:var(--tile);border:2px solid var(--ink);display:flex;flex-direction:column;text-align:left;padding:0;cursor:pointer;min-width:0}
.tile:hover{background:color-mix(in srgb,var(--tint) 45%,var(--tile))}
.tile .band{width:100%}
.tile .in{flex:1;padding:10px 12px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;width:100%;min-width:0}
.tile .nm{font-size:16.5px;font-weight:800;line-height:1.25}
.tile svg.ic{stroke:var(--acc)}
.strip{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--tile);border:2px solid var(--ink);padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.strip:hover{background:var(--try)}
.strip b{font-size:16px;white-space:nowrap}
.strip small{font-size:13px;color:var(--muted);font-weight:700}
.carry{grid-template-columns:auto 1fr auto}
.carry .ar{font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:240px}
.dy{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)}
.dy i{width:100%;aspect-ratio:1;max-width:26px;border:1.5px solid var(--outline);display:grid;place-items:center;font-style:normal;color:var(--acc-ink);font-size:11px}
.dy.p i{background:var(--acc);border-color:var(--acc)}
.dy.r i{border:2px dashed var(--ink)}
.dy.t i{box-shadow:0 0 0 2px var(--ink)}
.blocks{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.blocks i{height:9px;background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--outline)}
.blocks i.f{background:var(--acc);box-shadow:none}
.blocks i.rl{box-shadow:0 0 0 2px var(--ink)}
.blocks i.f.rl{box-shadow:0 0 0 2px var(--ink)}
.blocks.lg i{height:16px}
.blocks i.new{animation:pop .5s .3s both}
@keyframes pop{from{transform:scaleY(.2);opacity:.2}}
.links{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);background:var(--tile)}
.links button{border:0;background:none;padding:10px 8px;font-weight:900;font-size:14.5px;cursor:pointer;text-align:left;display:grid;gap:2px;align-content:start}
.links button+button{border-left:2px solid var(--ink)}
.links button:hover{background:var(--try)}
.links small{font-weight:700;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eb{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--tile);border:2px solid var(--ink);padding:14px;display:grid;gap:10px}
.small-note{font-size:14px;color:var(--muted);font-weight:600}
.sublist{display:grid;border:2px solid var(--ink);background:var(--tile)}
.sub{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px;border:0;background:none;text-align:left;cursor:pointer;min-height:58px;width:100%}
.sub+.sub{border-top:1.5px solid var(--outline)}
.sub:hover{background:var(--try)}
.sub .n{width:30px;height:30px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:14px}
.sub.done .n{background:var(--ink);color:var(--ground)}
.sub.here{background:var(--tint);box-shadow:inset 6px 0 0 var(--acc)}
.sub.soon{color:var(--muted)}
.sub .s{font-size:13px;color:var(--muted);font-weight:800;text-align:right}
.sub.here .s{color:var(--ink)}
.sub .t{font-weight:800;line-height:1.3}
.sub .t small{display:block;font-weight:700;color:var(--muted);font-size:13px}

/* the video, and the jump index under it */
.vid{background:#201e1d;color:#f3f2f2;border:2px solid var(--ink);display:grid}
.vid video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.vid .scr{aspect-ratio:16/9;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;position:relative}
.vid .cap2{font-size:clamp(16px,4vw,20px);font-weight:800;line-height:1.35}
.vid .tag{position:absolute;top:8px;left:10px;right:10px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#bab6b6}
.vid .ctl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid #444141}
.vid .pp{width:44px;height:40px;border:2px solid #f3f2f2;background:none;color:#f3f2f2;cursor:pointer;display:grid;place-items:center}
.vid .bar{flex:1;height:6px;background:#444141}
.vid .bar i{display:block;height:100%;background:var(--brand);width:0}
.vid .tm{font-size:13px;font-variant-numeric:tabular-nums}
.vid .cc{font-size:11px;font-weight:900;border:1.5px solid #f3f2f2;padding:1px 4px}
.hint{font-size:15px;color:var(--muted);font-weight:600}
.jumps{display:grid;border:2px solid var(--ink);background:var(--tile)}
.jump{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline;border:0;background:none;padding:10px 12px;text-align:left;cursor:pointer;font-size:15.5px;font-weight:700}
.jump+.jump{border-top:1.5px solid var(--outline)}
.jump:hover{background:var(--try)}
.jump .jt{font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.recall .show{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.rsteps{margin:0;padding-left:22px;display:grid;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.stepline{display:grid;gap:4px;padding:10px 0;border-top:1.5px solid var(--outline)}
.stepline:first-child{border-top:0;padding-top:0}
.stepline b{font-variant-numeric:tabular-nums}
.stepline i{font-style:normal;border-left:4px solid var(--acc);padding-left:10px;color:var(--muted);font-weight:600}
.whybtn{justify-self:start;border:2px solid var(--ink);background:var(--tile);font-weight:800;font-size:14px;padding:2px 10px;cursor:pointer}
.story{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.story .em{font-size:30px}
svg.art,svg.qart{width:100%;height:auto;max-height:260px;display:block}
.artbox{border:2px solid var(--ink);background:var(--tile);padding:10px}

/* a question */
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbar{display:flex;gap:3px;flex:1;max-width:240px}
.qbar i{flex:1;height:6px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--outline)}
.qbar i.d{background:var(--ink);box-shadow:none}.qbar i.c{background:var(--acc);box-shadow:none}
.qtext{font-size:clamp(19px,4.8vw,22px);font-weight:800;line-height:1.4}
.qshow{font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums;text-align:center;padding:4px 0;overflow-wrap:anywhere}
.qshow.mid{font-size:clamp(22px,6vw,30px)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 4px;font-weight:900;justify-content:center}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 4px 3px}
.fr span:last-child{padding:3px 4px 0}
.slot{display:flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--tile);min-height:60px;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.slot.empty{color:var(--outline)}
.slot.ok{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.slot .u{font-size:18px;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{min-height:54px;border:2px solid var(--ink);background:var(--tile);font-size:22px;font-weight:900;cursor:pointer;display:grid;place-items:center}
.key:active{background:var(--try)}
.key.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.key.sm{font-size:17px}
.opts{display:grid;gap:8px}
.opts.grid4{grid-template-columns:repeat(4,1fr)}
.op{display:flex;gap:12px;align-items:center;border:2px solid var(--ink);background:var(--tile);padding:12px 14px;min-height:56px;text-align:left;font-size:18px;font-weight:800;cursor:pointer;width:100%}
.op::before{content:"";width:20px;height:20px;flex:none;border:2px solid var(--ink);background:var(--tile)}
.opts.grid4 .op{justify-content:center;padding:10px 6px;font-size:20px}
.opts.grid4 .op::before{display:none}
.op[aria-checked="true"]{background:var(--ink);color:var(--ground)}
.op[aria-checked="true"]::before{background:var(--ground);box-shadow:inset 0 0 0 4px var(--ink)}
.op.right{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.op.right::before{border-color:var(--acc-ink)}
.op.miss{background:var(--try);border-style:dashed;color:var(--muted)}
.op:disabled{cursor:default}
.fbp{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;align-items:start;border:2px solid var(--ink)}
.fbp.ok{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.fbp.no{background:var(--try)}
.fbp b.t{font-size:20px;font-weight:900;display:block;margin-bottom:4px}
.fbp .acts{grid-column:1/-1;display:grid;gap:8px}
.fbp .why{display:block;margin-top:6px;font-weight:600}
.trap{border-left:6px solid var(--warm);background:var(--tile);padding:10px 12px;font-weight:800}

/* the end of a session, and the other pages */
.mix{display:grid;border:2px solid var(--ink);background:var(--tile)}
.mix div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px;align-items:center}
.mix div+div{border-top:1.5px solid var(--outline)}
.mix .big{font-size:28px;font-weight:900;color:var(--acc)}
.mix small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.end{background:var(--dark-panel);color:var(--dark-ink);margin:-14px -16px 0;padding:22px 18px;display:grid;gap:12px;border-bottom:2px solid var(--ink)}
.end .score{font-size:clamp(88px,26vw,140px);font-weight:900;line-height:.85;letter-spacing:-.03em}
.end .score small{font-size:28px;font-weight:900;letter-spacing:0}
.end h2{font-size:32px}
.end .tp{display:flex;justify-content:space-between;font-size:14px;font-weight:800;color:#bab6b6}
.mile{border:2px solid var(--ink);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;background:var(--tile)}
.mile b{font-size:36px;font-weight:900;line-height:1;color:var(--acc)}
.bigstreak{display:flex;align-items:baseline;gap:10px}
.bigstreak b{font-size:72px;font-weight:900;line-height:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border:1.5px solid var(--outline)}
.legend .p{background:var(--acc);border-color:var(--acc)}.legend .r{border:2px dashed var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thirty{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.thirty i{aspect-ratio:1;background:var(--acc)}
.thirty i.r{background:none;box-shadow:inset 0 0 0 2px var(--acc)}
.thirty i.e{background:none;box-shadow:inset 0 0 0 1.5px var(--outline)}
.rlist{display:grid;border:2px solid var(--ink);background:var(--tile)}
.rrow{display:grid;gap:6px;padding:12px;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.rrow+.rrow{border-top:1.5px solid var(--outline)}
.rrow .tp{display:flex;justify-content:space-between;gap:10px;font-weight:800}
.st{font-size:13px;font-weight:900;padding:2px 8px;border:2px solid var(--ink);white-space:nowrap;height:fit-content}
.st.ready{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.st.nearly{background:var(--tint)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);background:var(--tile)}
.kpis div{padding:10px;display:grid;gap:2px}
.kpis div+div{border-left:2px solid var(--ink)}
.kpis b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.kpis span{font-size:13px;color:var(--muted);font-weight:700}
.ptab{display:grid;border:2px solid var(--ink);background:var(--tile)}
.ptab .h{padding:8px 12px;font-weight:900;background:var(--acc);color:var(--acc-ink)}
.ptab .r{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;font-size:15.5px;border-top:1px solid var(--outline);font-weight:600}
.ptab .r b{font-variant-numeric:tabular-nums;white-space:nowrap}
.papers{display:grid;border:2px solid var(--ink);background:var(--tile)}
.papers div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-weight:700}
.papers div+div{border-top:1.5px solid var(--outline)}
.papers small{color:var(--muted);font-size:14px;white-space:nowrap}
.mset{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;border:2px solid var(--ink);background:var(--tile);padding:12px 14px}
.mset b{font-size:18px}
.mset small{grid-column:1/-1;color:var(--muted);font-size:14px;font-weight:600}
.timer{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;border:2px solid var(--ink);padding:2px 10px}
.timer.low{background:var(--try)}
.pgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.pg{min-height:34px;border:1.5px solid var(--outline);background:var(--tile);font-size:13px;font-weight:800;cursor:pointer;padding:0}
.pg.ans{background:var(--tint);border-color:var(--ink)}
.pg.now{box-shadow:0 0 0 2px var(--ink);background:var(--ink);color:var(--ground)}
.review{display:grid;border:2px solid var(--ink);background:var(--tile)}
.review div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:9px 12px;align-items:center;font-size:15.5px;font-weight:700}
.review div+div{border-top:1px solid var(--outline)}
.review .m{font-weight:900;text-align:center}
.review .ok{color:var(--acc)}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:grid;align-items:end;justify-items:center;z-index:20}
.sheet{background:var(--ground);border-top:2px solid var(--ink);padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ground);padding:10px 16px;opacity:0;transition:.25s;z-index:60;font-size:14px;font-weight:800;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* English: sentences to tap, texts to read, words to write */
.card{grid-template-columns:minmax(0,1fr)}
.ansrow input{width:100%}
.passage{border-left:6px solid var(--acc);background:var(--tile);padding:12px 14px;font-size:17.5px;line-height:1.6;font-weight:600}
.passage .src{display:block;margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.passage u{text-decoration-thickness:2.5px;text-underline-offset:3px}
.blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--ink);margin:0 3px}
.sent{font-size:20px;line-height:2.2;font-weight:700}
.tw{border:2px solid var(--ink);background:var(--tile);padding:0 6px;font-weight:800;cursor:pointer;line-height:1.6}
.tw.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.tw.bad{background:var(--try);border-style:dashed;color:var(--muted)}
.gapsent{line-height:2.4}
.gp{display:inline-block;width:26px;height:34px;vertical-align:middle;border:2px dashed var(--outline);background:transparent;margin:0 1px;cursor:pointer;font-weight:900;font-size:20px;padding:0;line-height:1}
.gp:hover{border-color:var(--ink)}
.gp.on{border:2px solid var(--acc);background:var(--acc);color:var(--acc-ink)}
.gp.bad{border-color:var(--ink);background:var(--try)}
.op.ml{white-space:pre-line;align-items:flex-start;font-size:16px}
.listen{display:grid;grid-template-columns:1fr auto;gap:8px}
.ansrow{display:flex;gap:10px;align-items:stretch}
.ansrow input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--tile);font-size:22px;font-weight:800;padding:6px 12px;min-height:58px}

 wordClass(r,lvl,cls){
  const c=cls||pick(r,["noun","verb","adjective","adverb","pronoun","determiner","preposition","conjunction"]);

 syn(r){

 },
 ant(r){

"sc.1":T2E("“It’s hot today, isn’t it?” The little question on the end is a question tag.","Question tags check that someone agrees.","You’re coming, ______",[["find the helping verb: are","You’re means you are.","The tag repeats the helping verb."],["flip it: aren’t","Positive sentence, negative tag.","A negative sentence gets a positive tag: It isn’t raining, is it?"],["aren’t you?","Add the pronoun and a question mark.","The tag always ends with a question mark."]]),
"sc.2":T2E("“We ate under the mango tree because it was hot.”","Which part could stand on its own as a sentence?","We ate under the mango tree because it was hot.",[["cover half","Read each part on its own.","A main clause makes sense alone."],["“We ate under the mango tree” ✓","This works as a sentence.","It has a subject and a verb and is complete."],["“because it was hot” ✗","This needs the rest.","It starts with a subordinating conjunction, so it can’t stand alone."]]),
"sc.3":T2E("“My uncle, who lives in Labé, keeps bees.”","The part between the commas tells you more about my uncle.","My uncle, who lives in Labé, keeps bees.",[["find the noun: my uncle","What is the extra information about?","A relative clause adds detail to a noun."],["who lives in Labé","It starts with a relative pronoun.","who for people, which for things, whose for belonging."],["remove it: still works","My uncle keeps bees.","That shows it was extra information."]]),

"vt.0":T2E("“Yesterday Amina walked to the market.”","The time word tells you the tense before you read the verb.","Yesterday Amina ______ (walk)",[["time word: yesterday","Look for when it happens.","Yesterday, last week: past. Every day, always: present."],["past: walk → walked","Most verbs add -ed in the past.","Some are irregular: go → went, win → won."],["walked","Yesterday Amina walked to the market.","Check the whole sentence sounds right."]]),

"vt.5":T2E("“If I were you, I would ask for help.”","You’re not me, so it isn’t real. That’s when the subjunctive is used.","If I ______ you…",[["is it real or wished?","Wishes and ‘if’ situations that aren’t real.","Also demands: She insisted that he be on time."],["use were","Even with I, he or she.","In speech people say was, but the formal form is were."],["If I were you","If I were you, I would ask for help.","It sounds formal, and the test asks for it."]]),

/* ---------- blocks and the ready line ----------
   A part counts its last ten answers that were right first time, from its own
   practice and from the daily sessions. A topic's blocks are the average of its
   parts out of ten, so 8 of 10 means about eight in ten right first time across
   every part of the topic, recently. Parts not tried yet count as nothing:
   blocks never fill from time spent, only from answers. */
function mastery(id){const h=S.h[id]||[];return h.reduce((a,b)=>a+b,0)/10;}

/* ---------- the streak, forgiving ----------
   Worked out from the days practised, so it can't drift: two rest days a week
   are covered automatically, every seven days practised earns a freeze (two at
   most) that covers a missed day after that, and only then does the streak go
   back to the start. Blocks never go back. */
function weekKey(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return dayStr(x);}
function streak(){
 const ds=Object.keys(S.days).sort(); const out={n:0,freezes:0,cover:{},today:!!S.days[TODAY()],practised:0,earned:false};
 if(!ds.length) return out;
 const rest={}; let d=new Date(ds[0]+"T12:00:00"); const end=TODAY();
 for(;;){const k=dayStr(d); if(k>end) break;
  if(S.days[k]){out.n++;out.practised++;out.earned=false;if(out.practised%7===0){out.freezes=Math.min(2,out.freezes+1);out.earned=(k===end);}}
  else if(k!==end){const wk=weekKey(d);
   if((rest[wk]||0)<2){rest[wk]=(rest[wk]||0)+1;out.cover[k]="r";out.n++;}
   else if(out.freezes>0){out.freezes--;out.cover[k]="f";out.n++;}
   else {out.n=0;}}
  d.setDate(d.getDate()+1);}

}

 for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const k=dayStr(d);
  const cls=(S.days[k]?"p":st.cover[k]?"r":"")+(k===today?" t":"");
  h+=`<span class="dy ${cls}"><i>${S.days[k]?"✓":""}</i>${"MTWTFSS"[i]}</span>`;}
 return `<div class="week">${h}</div>`;}

  if(q.marked) o.passage=esc(q.marked).replace(/\|([^|]+)\|/,"<u>$1</u>"); else if(q.sent) o.passage=esc(q.sent).replace(/______/g,"<span class=\"blank\"></span>");

function wordToks(q){if(q._toks)return q._toks;const out=[];q.sent.split("|").forEach((p,i)=>{
  if(i%2){out.push({w:p,ok:true,p:""});return;}
  p.split(/\s+/).filter(Boolean).forEach(x=>{const m=x.match(/^([^A-Za-z’']*)([A-Za-z’'-]+)(.*)$/);if(!m){if(out.length)out[out.length-1].p+=x;return;}out.push({w:m[2],ok:false,p:m[3],pre:m[1]});});});
 /* punctuation straight after a marked word joins it */
 for(let k=0;k<out.length;k++){if(out[k].pre){if(k>0)out[k-1].p+=out[k].pre;}}
 return q._toks=out;}
function tapWordQ(i){const q=curQ(),A=V.ans;if(A.locked)return;const t=wordToks(q)[i];if(!A.picks.includes(i))A.picks.push(i);
 const need=wordToks(q).map((x,k)=>x.ok?k:-1).filter(k=>k>=0),allIn=need.every(k=>A.picks.includes(k)),wrong=A.picks.some(k=>!wordToks(q)[k].ok);
 if(V.s==="paper"||V.s==="diag"){if(allIn){examDone(!wrong);return;}render();return;}
 if(!t.ok){A.tries++;if(A.tries>=2){finishQ(false);return;}A.fb={kind:"no",title:"Nearly.",msg:"<b>"+esc(t.w)+"</b> isn’t "+(/^[aeiou]/.test(q.lab)?"an ":"a ")+esc(q.lab)+" here. "+(SAY[q.lab]?"A "+q.lab+" "+SAY[q.lab]+".":""),html:true};}
 else if(allIn){finishQ(true);return;}
 render();}
function tapGapQ(i){const q=curQ(),A=V.ans;if(A.locked)return;if(!A.picks.includes(i))A.picks.push(i);const right=q._right;
 if(V.s==="paper"||V.s==="diag"){if(A.picks.length>=right.length){examDone(right.every(x=>A.picks.includes(x))&&A.picks.length===right.length);return;}render();return;}
 if(!right.includes(i)){A.tries++;if(A.tries>=2){finishQ(false);return;}A.fb={kind:"no",title:"Nearly.",msg:"Read the sentence aloud. Where would you pause, or where does the extra part start or stop?"};}
 else if(right.every(x=>A.picks.includes(x))){finishQ(true);return;}
 render();}
function longCompare(){const A=V.ans,el=$("#lta");if(el)A.typed=el.value;if(A.typed.trim().length<20){A.fb={kind:"no",title:"Write a little more first.",msg:"Aim for two or three sentences, with evidence from the text.",soft:true};render();return;}A.fb=null;A.model=true;render();}
function longTick(i,on){const A=V.ans;A.ticks=A.ticks.filter(x=>x!==i);if(on)A.ticks.push(i);}
function longMark(){const q=curQ(),A=V.ans,k=A.ticks.length;A.locked=true;A.ok=k>=Math.ceil(q.marks/2)+(q.marks>2?0:0);
 A.fb={kind:k>=q.marks-1?"ok":"no",title:k+" of "+q.marks+" marks.",msg:k===q.marks?"That’s the full method: point, evidence, explanation.":"Next time, check each point on the list before you finish."};
 if(q.sub)record(q.sub,k===q.marks);if(V.s==="sub")V.first=(V.first||0)+(k===q.marks?1:0);if(V.s==="session"){S.sess.res.push(k===q.marks?1:0);save();}render();}
function checkAns(){
 const q=curQ(),A=V.ans; if(!q||A.locked)return;
 let v;
 if(q.ask==="ch"){if(A.pick==null){A.fb={kind:"no",title:"Pick one first.",msg:"",soft:true};render();return;}v=A.pick;}
 else {const el=$("#tin");if(el)A.typed=el.value;v=A.typed.trim();if(v==="")return;}
 if(V.ctx==="exam"||V.ctx==="diag"){A.locked=true;A.ok=isRight(q,v);examDone(A.ok);return;}
 if(isRight(q,v)){finishQ(true);return;}
 A.tries++;
 const slip=(q.slips||[]).find(x=>q.ask==="ch"?x[0]===v:norm(x[0])===norm(v));
 if(q.ask==="ch"){if(!A.missed.includes(v))A.missed.push(v);A.pick=null;}
 if(A.tries>=2){finishQ(false,slip);return;}
 const near=q.ask!=="ch"&&close(v,q.ask==="copy"?q.acc[0]:q.a);
 A.fb={kind:"no",title:slip?slip[1]:near?"Very close.":"Nearly. Have another look.",msg:slip?slip[2]:near?"One or two letters are different. Listen again and check each part of the word.":q.ask==="copy"?"Find the exact words in the text and copy them.":q.spell?"Listen again and try each part of the word.":"Read the question again and try again.",retry:true,html:true};
 if(q.ask!=="ch")A.typed="";
 render();
}
/* how near a spelling is: one or two letters out */
function close(a,b){a=norm(a);b=norm(b);if(Math.abs(a.length-b.length)>2)return false;const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}}return d[b.length]<=2;}
function finishQ(ok,slip){
 const q=curQ(),A=V.ans; A.locked=true; A.ok=ok;
 const first=ok&&A.tries===0;
 if(ok) A.fb={kind:"ok",title:(A.tries?NICE.en[1]:NICE.en[(V.i||0)%10])+(q.ask==="type"||q.ask==="copy"?" "+answerText(q)+".":""),msg:q.why||"",html:true};
 else A.fb={kind:"no",title:slip?slip[1]:"Not this time.",msg:(slip?slip[2]+" ":"")+(q.ask==="tapWords"||q.ask==="gaps"?"The right answers are marked in colour. ":`The answer is <b>${esc(answerText(q))}</b>. `)+(q.why||""),final:true,html:true};
 if(q.sub) record(q.sub,first);
 if(V.s==="sub"){V.first=(V.first||0)+(first?1:0);}
 if(V.s==="session"){S.sess.res.push(first?1:0);save();}
 render();
}

}

/* ---------- the video ----------
   VIDEO[part id] is filled in as each Synthesia film is rendered. Until then the
   panel steps through the film's own lines as captions, so a child can follow
   the method now and the page looks the same when the film arrives. Every step
   has a timestamp, so the list under the player jumps straight to it. */
const VIDEO={};   /* e.g. "calc.6":{en:"vid/longDiv-en.mp4"} */
function stepsOf(s){const T2=TEACH[s.teach];return T2?T2.steps.concat(TEACHX[s.id]||[]):[];}
function capsFor(s){const T2=TEACH[s.teach];return T2?stepsOf(s).map(x=>enNum(x.line)+": "+x.en):[s.t,"Watch the example, then try it yourself.","Pause any time. The captions stay on."];}
function marksFor(s){const T2=TEACH[s.teach];if(!T2)return[];const vm=VMARK[s.teach];
 if(!vm)return estMarks(T2,TEACHX[s.id]).marks;
 const m=T2.steps.map((x,i)=>vm[i]!=null?vm[i]:Math.round(8+i*11));(TEACHX[s.id]||[]).forEach(()=>m.push(m[m.length-1]+13));return m;}
const mmss=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
function videoHTML(s){
 const src=(VIDEO[s.id]||{}).en;
 if(src) return `<div class="vid"><video id="theVid" controls playsinline preload="metadata" src="${esc(src)}"></video></div>`;
 return `<div class="vid" id="vp"><div class="scr"><span class="tag">Video coming soon · its steps as captions</span>${nuuru({size:72,pose:"think"})}<p class="cap2" id="vcap"></p></div>
  <div class="ctl"><button class="pp" id="vpp" aria-label="Play" onclick="vPlay()">▶</button><div class="bar"><i id="vbar"></i></div><span class="tm" id="vtm">0:00</span><span class="cc">CC on</span></div></div>`;
}
let VT=null,VP={t:0,T:120,caps:[]};
function vInit(s){clearInterval(VT);VT=null;VP={t:0,T:120,caps:capsFor(s)};vDraw();}
function vDraw(){const c=$("#vcap");if(!c)return;const P=VP;c.textContent=P.caps[Math.min(P.caps.length-1,Math.floor(P.t/P.T*P.caps.length))]||"";$("#vbar").style.width=(P.t/P.T*100)+"%";$("#vtm").textContent=mmss(Math.floor(P.t))+" / "+mmss(P.T);}
function vPlay(){const b=$("#vpp");if(VT){clearInterval(VT);VT=null;b.textContent="▶";b.setAttribute("aria-label","Play");return;}
 if(VP.t>=VP.T)VP.t=0;b.textContent="❚❚";b.setAttribute("aria-label","Pause");
 VT=setInterval(()=>{if(!$("#vp")){clearInterval(VT);VT=null;return;}VP.t+=1;if(VP.t>=VP.T){VP.t=VP.T;clearInterval(VT);VT=null;b.textContent="↻";}vDraw();},250);}
function seekTo(sec){const v=$("#theVid");if(v){try{v.currentTime=sec;v.play();}catch(e){}return;}VP.t=Math.min(VP.T,sec);vDraw();if(!VT)vPlay();}

/* ---------- the daily ten ----------
   Three on the topic being built, two spellings (heard, then written), two
   reading questions on a short text, and three to try again from recent misses.
   Saved as it goes, so stopping loses nothing. */
function focusTopic(){
 if(S.at&&SUB(S.at.id)&&SUB(S.at.id).tp!=="rd")return SUB(S.at.id).tp;
 const tried=TOPICS.filter(tp=>tp.id!=="rd"&&tp.subs.some(s=>(S.h[s.id]||[]).length));
 if(!tried.length)return "pu";
 return tried.reduce((a,tp)=>blocksOf(tp.id)<blocksOf(a.id)?tp:a,tried[0]).id;
}
function pickGen(s,k){return s.gens[k%s.gens.length];}
function buildSession(sd,ahead){
 const r=R(sd+(ahead?1:0)), items=[], f=focusTopic(), tp=TOP(f);
 const pool=tp.subs.filter(s=>s.built&&!s.fixed);
 const tried=pool.filter(s=>(S.h[s.id]||[]).length).sort((a,b)=>mastery(a.id)-mastery(b.id));
 const here=pool.find(s=>!S.d[s.id]); const fs3=(tried.length?tried.slice(0,2):[]).concat(here?[here]:[]); if(!fs3.length)fs3.push(pool[0]);
 for(let i=0;i<3;i++){const s=fs3[i%fs3.length],g=pickGen(s,i+sd);items.push({g:g[0],lvl:g[1],arg:g[2],sub:s.id,tag:"Building",sd:sd+i*7919});}
 const sps=shuffle(r,SUBS.filter(s=>s.tp==="sp"&&s.gens.some(g=>g[0]==="spell"||g[0]==="spellList")));
 for(let i=0;i<2;i++){const s=sps[i%sps.length],g=s.gens.find(g=>g[0]==="spell"||g[0]==="spellList");items.push({g:g[0],lvl:1,arg:g[2],sub:s.id,tag:"Spelling",sd:sd+(3+i)*7919});}
 const rds=shuffle(r,SUBS.filter(s=>s.tp==="rd"&&!s.fixed));
 for(let i=0;i<2;i++){const s=rds[i],g=s.gens[0];items.push({g:g[0],lvl:1,arg:g[2],sub:s.id,tag:"Reading",sd:sd+(5+i)*7919});}
 const miss=SUBS.filter(s=>s.built&&!s.fixed&&(S.h[s.id]||[]).slice(-3).includes(0)).slice(0,5);
 for(let i=0;i<3;i++){const s=miss[i]||fs3[(i+1)%fs3.length],g=pickGen(s,i+3);items.push({g:g[0],lvl:g[1],arg:g[2],sub:s.id,tag:miss[i]?"Try again":"Building",sd:sd+(7+i)*7919});}
 return {day:TODAY(),items,pos:0,res:[],focus:f,before:blocksOf(f)};
}
function sessMix(sess){const c={};sess.items.forEach(it=>{const k=it.tag==="Building"?"on "+TOP(SUB(it.sub).tp).n:it.tag==="Spelling"?"spellings":it.tag==="Reading"?"reading questions":"to try again";c[k]=(c[k]||0)+1;});
 const why={spellings:"Listen and spell","reading questions":"Short texts","to try again":"Ones that tripped you up"};
 return Object.keys(c).map(k=>[c[k],k,why[k]||"The topic you’re building"]);}
function ensureSession(){if(!S.sess||S.sess.day!==TODAY()||S.sess.pos>=S.sess.items.length){S.sess=buildSession(seed());save();}return S.sess;}
function sessQ(){const sess=ensureSession(),it=sess.items[sess.pos];V={s:"session",q:makeQ(it.g,it.lvl,it.sd,it.sub,it.arg),ctx:"session",i:sess.pos};newAns();render();try{window.scrollTo(0,0)}catch(e){}}

 S.days[TODAY()]=1;save();tellHost();
 STACK=[];V={s:"end",res:{score,total:sess.items.length,focus:sess.focus,before:sess.before,after:blocksOf(sess.focus)}};render();try{window.scrollTo(0,0)}catch(e){}}

/* ---------- the three papers ----------

   One try per question, no feedback until the end, then a review. */
const GPSMIX=[["func",1],["wordClass",1,"noun"],["capEnd",1],["coord",1],["wcNameC",1,"adverb"],["apostrophe",1],["syn",1],["punctAt",1,"list"],["standard",1],["tense",1],
 ["wordClass",1,"verb"],["qTag",1],["relative",1],["presPerf",1],["speech",1],["ant",1],["modal",1],["frontedAdv",1],["wcNameC",1,"determiner"],["subord",1],
 ["prefix",1],["clause",1],["contract",1],["simpleTense",1],["punctAt",1,"brackets,comma"],["wordClass",1,"adjective"],["mainClause",1],["progressive",1],["formal",1],["wcNameC",1,"preposition"],
 ["suffix",1],["punctAt",1,"colon"],["voice",1],["subjObj",1],["nounPhrase",1],["wcNameC",1,"pronoun"],["punctAt",1,"semicolon"],["subjunctive",1],["bullets",1],["wordClass",1,"conjunction"],
 ["punctAt",1,"dash"],["func",1],["apostrophe",1],["punctAt",1,"hyphen"],["standard",1],["syn",1],["tense",1],["voice",1],["wcNameC",1,"noun"],["formal",1]];
const PAPERS={1:{name:"Paper 1: Grammar and punctuation",short:"Paper 1",secs:2700,marks:50},2:{name:"Paper 2: Spelling",short:"Paper 2",secs:1200,marks:20},3:{name:"Reading paper",short:"Reading",secs:3600,marks:null}};
function openPaper(kind){
 kind=kind||1; const qs=[]; const sd=seed();
 if(kind===1) GPSMIX.forEach(([g,l,a],i)=>qs.push(Object.assign(makeQ(g,l,sd+i*7919,null,a),{m:1})));
 if(kind===2){const used=new Set();for(let i=0;qs.length<20&&i<200;i++){const g=i%3===0?["spellList"]:["spell",SPELL[i%SPELL.length].c];const q=makeQ(g[0],1,sd+i*7919,null,g[1]);if(used.has(q.a))continue;used.add(q.a);qs.push(Object.assign(q,{m:1}));}}
 if(kind===3) ["nf","hw","hm"].forEach(t=>RQ.filter(q=>q.t===t).forEach(q=>qs.push(Object.assign({},q,{rd:true,full:t,m:q.ask==="long"?q.marks:1,sub:GSUB_RD[q.skill]}))));
 STACK.push(V);V={s:"paper",kind,qs,i:0,pans:qs.map(()=>""),ptk:qs.map(()=>[]),t0:Date.now(),mark:null,ctx:"exam",showText:true};newAns();render();try{window.scrollTo(0,0)}catch(e){}
}

function savePaper(first){if(!first&&V.saved)return;const sc=paperScore();S.mocks=S.mocks||{};const key="p"+V.kind;const arr=S.mocks[key]=(S.mocks[key]||[]);
 if(V.saved)arr[arr.length-1]={s:sc,of:paperTotal()};else arr.push({s:sc,of:paperTotal()});if(arr.length>20)arr.shift();V.saved=true;save();tellHost();}
const lastMock=k=>{const a=(S.mocks||{})["p"+k]||[];return a.length?a[a.length-1]:null;};
/* GPS is out of 70 (50 + 20) in the real test; 2026 expected standard 34. Reading is out of 50; expected standard 25. */
function mockTotalHTML(){
 const g1=lastMock(1),g2=lastMock(2),rd=lastMock(3);
 let h="";
 if(g1&&g2){const t=g1.s+g2.s;h+=`<div class="mile"><b>${t}</b><span>out of 70 in grammar, punctuation and spelling. ${t>=38?"Above the expected standard (34 in 2026), with room to spare.":t>=34?"At the expected standard (34 in 2026). Aim for about 38 to be safe.":"The expected standard in 2026 was 34. "+(34-t)+" more to reach it."}</span></div>`;}
 if(rd){const pc=Math.round(rd.s/rd.of*50);h+=`<div class="mile"><b>${pc}</b><span>out of 50 in reading, scaled from ${rd.s} of ${rd.of}. ${pc>=28?"Above the expected standard (25 in 2026).":pc>=25?"At the expected standard (25 in 2026). Aim for about 28.":"The expected standard in 2026 was 25."}</span></div>`;}
 return h||`<div class="card"><b>Your totals</b><span class="small-note">Do Papers 1 and 2 for a grammar, punctuation and spelling total out of 70, and the reading paper for a reading score out of 50.</span></div>`;
}

/* ---------- find where to start ---------- */
function startDiag(){const sd=seed();STACK.push(V);V={s:"diag",i:0,qs:DIAG.map((d,k)=>makeQ(d.g,1,sd+k*7919,null,d.g==="wordClass"?"noun":undefined)),res:[],ctx:"diag"};newAns();render();try{window.scrollTo(0,0)}catch(e){}}
function diagHTML(){
 if(V.i>=DIAG.length){V.s="diagres";return diagResult();}
 const q=V.qs[V.i];
 return `<div class="greet">${nuuru({size:56,pose:"think"})}<p>Ten quick questions. Nothing is marked. They show where to start.</p></div>
  <div class="qh"><div class="qbar">${DIAG.map((_,k)=>`<i class="${k<V.i?"d":""}"></i>`).join("")}</div><b>${V.i+1} of ${DIAG.length}</b></div>
  <div class="card">${qBody(q,"diag")}</div>
  <div class="two"><button class="btn sec mid" onclick="diagBack()" ${V.i===0?"disabled":""}>Back</button><button class="btn sec mid" onclick="diagSkip()">I don’t know this yet</button></div>`;
}
function diagSkip(){V.res[V.i]=false;V.i++;newAns();render();}
function diagBack(){if(V.i>0)V.i--;newAns();render();}
function diagResult(){
 const weak=DIAG.map((d,k)=>({d,ok:V.res[k]===true})).filter(x=>!x.ok).sort((a,b)=>b.d.hot-a.d.hot);
 const strong=DIAG.filter((d,k)=>V.res[k]===true);
 return `<div class="greet">${nuuru({size:64,pose:"cheer"})}<p>Done. Here’s where to start, biggest marks first.</p></div>
  ${weak.length?`<div class="sublist">${weak.map(x=>{const s=SUB(x.d.g==="spell"?"sp.3":GSUB[x.d.g]);return `<button class="sub" onclick="openSub('${s.id}')"><span class="n">${x.d.hot}</span><span class="t">${esc(s.n)}<small>${esc(TOP(s.tp).n)}</small></span><span class="s">›</span></button>`}).join("")}</div>`:`<div class="card"><b>All ten right.</b><span>Start with today’s session and the Mock papers.</span></div>`}
  ${strong.length?`<p class="eb">Already strong</p><p style="font-weight:700">${strong.map(d=>esc(SUB(d.g==="spell"?"sp.3":GSUB[d.g]).n)).join(" · ")}</p>`:""}
  <button class="btn" onclick="home()">Go to home ${arrow()}</button>`;
}

/* ---------- telling Notice Me what was done ----------
   As before: framed inside Notice Me, the course posts the whole list of
   finished parts to its own origin. v2 also sends each topic's blocks. */
const COURSE="english";
function tellHost(){
 try{if(window.parent===window)return;
  const b={};TOPICS.forEach(tp=>b[tp.id]=blocksOf(tp.id));
  window.parent.postMessage({app:"one-hundred",course:COURSE,type:"progress",v:2,done:Object.keys(S.d||{}),blocks:b,days:Object.keys(S.days).length,mocks:[1,2,3].map(lastMock)},location.origin);
 }catch(e){}
}
function hostSays(ev){
 if(!ev||!ev.data||ev.data.app!=="one-hundred")return;
 if(ev.origin!==location.origin)return;
 if(ev.data.type==="who"&&ev.data.name){S.name=String(ev.data.name).slice(0,18);save();render();}
}
window.addEventListener("message",hostSays);
render();

</script></body></html>
