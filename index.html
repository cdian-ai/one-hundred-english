<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Hundred — Year 6 SATs English</title><meta name="theme-color" content="#5B6BAE">
<!-- Home screen. Without these iOS uses a screenshot of the page, and two
     apps built from the same shell become two identical tiles. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<style>
/* ================= One Hundred =================
   Built on the 2025 and 2026 KS2 papers rather than on the programme of study:
   every stop names the content-domain codes it serves and carries as many
   questions as that code's weight in the test deserves.
   Paper 1 is 36 constructed answers, so arithmetic is typed on a keypad, never
   chosen from four options — offering options would train a skill the test
   does not reward. */
:root{
 --ink:#1B2430;--ink2:#4A5A6B;--muted:#8494A4;--paper:#FBF8F3;--card:#fff;--line:#E8E1D6;
 --band:#4C5BA8;--sun:#E0A32E;--sun-bg:#FDF3DE;--yes:#2F7D57;--yes-bg:#E8F4EC;
 --no:#B0463C;--no-bg:#FBECEA;
 --t1:9px;--t2:11px;--t3:13px;--t4:15px;--t5:18px;--t6:22px;--t7:28px;--t8:40px;--t9:52px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font:var(--t4)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color:var(--ink);background:var(--paper);padding-top:env(safe-area-inset-top)}
.num{font-variant-numeric:tabular-nums}
header{padding:10px 14px 8px;background:var(--paper);position:relative;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.htitle{flex:1 1 auto;min-width:0}
.htitle b{display:block;font-size:var(--t5);font-weight:650;line-height:1.2}
.htitle span{display:block;font-size:var(--t3);color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.lang button{border:0;background:transparent;font:inherit;font-size:var(--t3);font-weight:700;
 color:var(--muted);padding:6px 11px;cursor:pointer}
.lang button.on{background:var(--band);color:#fff}
.track{height:6px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;background:var(--band);width:0;transition:width .5s}
/* v11: main used to start at y=0, under the header, so the first line of every
   screen was hidden. render() measures the header and sets --hh. */
main{position:absolute;left:0;right:0;bottom:0;top:var(--hh,74px);overflow-y:auto;-webkit-overflow-scrolling:touch;
 padding:0 14px calc(30px + env(safe-area-inset-bottom))}
.pad{height:40px}
.wrap{max-width:520px;margin:0 auto}
.mhead{text-align:center;margin:16px 0 14px}
.mhead h1{margin:0;font-size:var(--t7);font-weight:650}
.mhead p{margin:4px 0 0;font-size:var(--t4);color:var(--ink2)}
.mhead .alt{font-size:var(--t3);color:var(--muted);margin-top:6px}
.paperbtn{display:flex;align-items:center;gap:12px;width:100%;padding:15px;margin:6px 0 16px;
 border-radius:18px;border:2px solid var(--sun);background:var(--sun-bg);cursor:pointer;
 font:inherit;text-align:left}
.paperbtn b{display:block;font-size:var(--t5);color:#6A4A05}
.paperbtn span{display:block;font-size:var(--t3);color:#8A6A25}
.camp{margin:0 0 6px}
.chead{display:flex;align-items:center;gap:11px;padding:12px 4px 8px}
.chead .em{font-size:var(--t6)}
.chead b{flex:1 1 auto;font-size:var(--t5);font-weight:650}
.chead small{font-size:var(--t3);color:var(--muted);display:block;font-weight:400}
.chead .cnt{font-size:var(--t3);color:var(--band);font-weight:700}
.slope{display:flex;flex-direction:column-reverse}
.stop{position:relative;display:flex;align-items:center;gap:11px;padding:7px 0}
.stop:before{content:"";position:absolute;left:23px;top:0;bottom:0;width:3px;background:var(--line)}
.stop.done:before{background:var(--band)}
.stop:first-child:before{top:50%}.stop:last-child:before{bottom:50%}
.pin{position:relative;z-index:2;width:48px;height:48px;border-radius:50%;flex:0 0 auto;
 display:flex;align-items:center;justify-content:center;font-size:var(--t4);font-weight:700;
 background:#fff;border:2.5px solid var(--line);cursor:pointer;font-family:inherit;color:var(--muted)}
.pin.done{border-color:var(--band);background:var(--band);color:#fff}
.pin.now{border-color:var(--band);color:var(--band);box-shadow:0 0 0 5px rgba(78,140,106,.16)}
.si{flex:1 1 auto;min-width:0;text-align:left}
.si b{display:block;font-size:var(--t4);font-weight:600}
.si span{display:block;font-size:var(--t2);color:var(--muted)}
.sc{font-size:var(--t3);color:var(--band);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:20px 16px;
 box-shadow:0 1px 2px rgba(27,36,48,.05),0 8px 24px rgba(27,36,48,.05);
 display:flex;flex-direction:column;align-items:center;text-align:center}
.step{font-size:var(--t3);color:var(--muted);text-align:center;margin:10px 0 12px}
.qbig{font-size:var(--t9);font-weight:600;line-height:1.1;letter-spacing:.01em;margin:14px 0}
.qmid{font-size:var(--t7);font-weight:600;margin:14px 0}
.hint{font-size:var(--t3);color:var(--muted);margin:0 0 4px}
.slot{min-height:56px;display:flex;align-items:center;justify-content:center;
 font-size:var(--t8);font-weight:600;color:var(--band);margin:2px 0 6px}
.slot.empty{color:var(--line)}
.slot.wrong{color:var(--no)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:320px;margin-top:8px}
.key{border:1.5px solid var(--line);border-radius:14px;background:#fff;font:inherit;
 font-size:var(--t6);font-weight:600;padding:14px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.key:active{transform:translateY(1px)}
.key.wide{grid-column:span 1}
.key.go{background:var(--band);color:#fff;border-color:var(--band)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-top:16px}
.opt{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px 8px;font:inherit;
 font-size:var(--t5);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--ink)}
.opt.yes{border-color:var(--yes);background:var(--yes-bg);color:var(--yes)}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.teach{font-size:var(--t4);line-height:1.6;margin:16px 6px 0;max-width:36ch;color:var(--ink)}
.code{font-size:var(--t2);color:var(--muted);letter-spacing:.04em;margin-top:14px}
.go2{width:100%;max-width:340px;border:0;border-radius:14px;background:var(--band);color:#fff;
 font:inherit;font-size:var(--t5);font-weight:700;padding:15px;margin-top:16px;cursor:pointer}
.go2.quiet{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
/* v11: the back button floated at the bottom left on top of the answers. It
   lives in the header now, left of the title. */
.back{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 font-size:var(--t6);line-height:1;color:var(--ink2);cursor:pointer;padding:0 0 3px}
.back[hidden]{display:none}
.tally{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tally i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tally i.on{background:var(--band)}.tally i.bad{background:var(--no)}
.note{margin-top:14px;padding:11px 13px;border-radius:14px;background:var(--sun-bg);
 font-size:var(--t3);line-height:1.55;color:#6A4A05;max-width:36ch}
.timer{font-size:var(--t6);font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.timer.low{color:var(--no)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:100%;margin-top:12px}
.pg{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;
 font:inherit;font-size:var(--t2);color:var(--muted);cursor:pointer;padding:0}
.pg.ans{border-color:var(--band);color:var(--band);font-weight:700}
.pg.now{background:var(--band);color:#fff;border-color:var(--band)}
.res{text-align:center}.res .em{font-size:var(--t8)}
.res h2{margin:6px 0 2px;font-size:var(--t6)}
.res p{margin:0;color:var(--muted);font-size:var(--t4)}
.bar2{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 0 4px;width:100%;max-width:340px}
.bar2 i{display:block;height:100%;background:var(--band)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.phases{display:flex;gap:5px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.pz{font-size:var(--t2);color:var(--muted);padding:4px 10px;border-radius:999px;background:#fff;
 border:1.5px solid var(--line)}
.pz.on{background:var(--band);color:#fff;border-color:var(--band);font-weight:700}
.pz.past{color:var(--band);border-color:var(--band)}
.storyem{font-size:var(--t9);line-height:1;margin:8px 0 14px}
.storyline{font-size:var(--t5);line-height:1.55;margin:0;max-width:32ch;color:var(--ink)}
.steps{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:14px;text-align:left}
.stepline{border-left:3px solid var(--band);padding:8px 0 8px 12px}
.stepline b{display:block;font-size:var(--t6);color:var(--ink)}
.stepline span{display:block;font-size:var(--t4);color:var(--ink2);margin-top:3px;line-height:1.5}
.stepline i{display:block;font-style:normal;font-size:var(--t3);color:var(--muted);margin-top:5px;line-height:1.5}
.stepline.done{border-left-color:var(--line);opacity:.6}
.stepline.done b{font-size:var(--t5);color:var(--band)}
.guideq{font-size:var(--t5);line-height:1.5;margin:16px 4px 4px;max-width:32ch;color:var(--ink)}

.cover{text-align:center;padding-top:14px}
.covmark{font-size:56px;line-height:1}
.covh{margin:10px 0 2px;font-size:var(--t7);font-weight:650;line-height:1.2}
.covsub{margin:0 0 16px;font-size:var(--t4);color:var(--muted)}
.covcard{align-items:flex-start;text-align:left;gap:0}
.covwho{margin:0 0 12px;font-size:var(--t5);font-weight:600;line-height:1.45}
.covp{margin:0 0 11px;font-size:var(--t4);line-height:1.6;color:var(--ink2)}
.covsm{margin:4px 0 0;font-size:var(--t3);color:var(--muted)}
.wcard{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;
 border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.wcard.next{border-color:var(--band);background:#F2F8F4}
.wm{flex:0 0 auto;min-width:34px;height:34px;border-radius:10px;background:var(--sun-bg);color:#6A4A05;
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--t4)}
.wcard.next .wm{background:var(--band);color:#fff}
.wx{flex:1 1 auto;min-width:0}
.wx b{display:block;font-size:var(--t4);font-weight:600}
.wx small{display:block;font-size:var(--t2);color:var(--muted)}
.wa{color:var(--muted)}
.shelfh{margin:16px 0 4px;font-size:var(--t3);color:var(--muted)}
.strong{margin:0 0 6px;font-size:var(--t3);color:var(--ink2);line-height:1.6}
.sh{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-top:8px;
 border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.sh.open{border-color:var(--band);border-bottom-left-radius:0;border-bottom-right-radius:0}
.sh .em{font-size:var(--t6)}
.shx{flex:1 1 auto;min-width:0}
.shx b{display:block;font-size:var(--t4);font-weight:650}
.shx small{display:block;font-size:var(--t2);color:var(--muted)}
.shc{font-size:var(--t3);color:var(--band);font-weight:700}
.shbody{border:1.5px solid var(--band);border-top:0;border-radius:0 0 16px 16px;padding:4px;background:#fff}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:transparent;
 cursor:pointer;font:inherit;text-align:left;border-radius:11px}
.row:active{background:#F2F8F4}
.rm{flex:0 0 auto;width:22px;text-align:center;color:var(--muted)}
.row.done .rm{color:var(--band)}
.rx{flex:1 1 auto;min-width:0}
.rx b{display:block;font-size:var(--t4);font-weight:500}
.rx small{display:block;font-size:var(--t1);color:var(--muted);letter-spacing:.03em}
.rs{font-size:var(--t3);color:var(--band);font-weight:700}

.whybtn{margin-top:6px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
 font:inherit;font-size:var(--t2);color:var(--muted);padding:3px 11px;cursor:pointer}
.covlead{margin:0 0 18px;font-size:var(--t5);line-height:1.5;color:var(--ink)}
.covmore{margin-top:18px;border:0;background:transparent;font:inherit;font-size:var(--t3);
 color:var(--muted);text-decoration:underline;cursor:pointer}
.dgbar{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.dgback{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;
 font-size:var(--t5);color:var(--ink2);cursor:pointer;flex:0 0 auto}
.dgback:disabled{opacity:.3}
.dgdots{flex:1 1 auto;display:flex;gap:5px;justify-content:center}
.dgdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dgdots i.on{background:var(--band)}
.dgdots i.now{box-shadow:0 0 0 3px rgba(78,140,106,.22)}
.dgn{font-size:var(--t3);color:var(--muted);flex:0 0 auto}
.shw{color:var(--band);font-weight:700}

.shdots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px}
.shdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.shdots i.on{background:var(--band)}
.gotline{margin:8px 0 0;font-size:var(--t3);color:var(--muted)}
.gotline b{font-size:var(--t5);color:var(--band)}
.go2.small{font-size:var(--t4);padding:11px;max-width:280px}

.artbox{width:100%;display:flex;justify-content:center;margin:4px 0 10px}
.art{width:100%;max-width:280px;height:auto;display:block}
.trap{display:flex;gap:8px;align-items:flex-start;margin:0 0 10px;padding:10px 13px;border-radius:14px;
 background:var(--sun-bg);color:#6A4A05;font-size:var(--t3);line-height:1.5}
.nice{margin:0 0 10px;padding:9px 14px;border-radius:999px;background:var(--yes-bg);color:var(--yes);
 font-size:var(--t4);font-weight:700;text-align:center;animation:pop .22s ease}
.nice.fix{background:var(--sun-bg);color:#6A4A05}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.shfill{position:relative;flex:0 0 auto;width:34px;height:40px;border-radius:9px;background:var(--line);
 overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.shfill>span{position:absolute;left:0;right:0;bottom:0;background:var(--band);transition:height .4s ease}
.shfill b{position:relative;font-size:var(--t1);color:var(--ink);width:100%;text-align:center;padding-bottom:3px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;border:1.5px solid var(--line);
 background:#fff;cursor:pointer;font:inherit;text-align:left;padding:14px;
 display:flex;flex-direction:column;align-items:flex-start;overflow:hidden}
/* v9: 30px in a tile 170px across read as a stray character rather than
   an icon. Big enough to be the thing you look at, and pushed to the
   middle of the space above the label. */
.tem{font-size:52px;line-height:1;margin:6px auto 0;display:block}
.tname{margin-top:auto;padding-top:8px;font-size:var(--t4);font-weight:650;line-height:1.25;color:var(--ink)}
.tsub{font-size:var(--t2);color:var(--muted);margin-top:2px}
.tbar{width:100%;height:5px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--band);transition:width .4s ease}
.tnum{position:absolute;top:14px;right:14px;font-size:var(--t2);color:var(--muted);font-weight:700}
.sublist{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.subrow{display:flex;align-items:center;gap:11px;width:100%;padding:14px;border-radius:16px;
 border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.subrow.done{border-color:var(--band)}
.srm{flex:0 0 auto;width:24px;text-align:center;color:var(--muted);font-size:var(--t3)}
.subrow.done .srm{color:var(--band)}
.srx{flex:1 1 auto;min-width:0}
.srx b{display:block;font-size:var(--t4);font-weight:600}
.srx small{display:block;font-size:var(--t2);color:var(--muted)}
.srs{font-size:var(--t3);color:var(--band);font-weight:700}
.vidbox{margin:2px 0 12px}
.vidph{display:flex;align-items:center;gap:13px;padding:16px;border-radius:18px;
 border:2px dashed var(--line);background:#fff}
.vidplay{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--sun-bg);
 color:var(--sun);display:flex;align-items:center;justify-content:center;font-size:var(--t5)}
.vidt b{display:block;font-size:var(--t4);font-weight:650}
.vidt small{display:block;font-size:var(--t2);color:var(--muted);letter-spacing:.02em}
.card.story{align-items:flex-start;text-align:left;flex-direction:row;gap:13px;padding:15px;margin-bottom:8px}
.card.story .storyem{font-size:28px;margin:0;line-height:1.1}
.card.story .storyline{font-size:var(--t4);line-height:1.55;max-width:none;margin:0}
.lh{margin:16px 0 8px;font-size:var(--t5);font-weight:650}
.card.artcard{padding:14px;margin-bottom:8px}
.card.lesson{align-items:stretch;text-align:left}
.card.lesson .qmid{text-align:center;margin:0 0 4px}
.go2.warm{background:var(--sun);color:#3B2A05}

.lh.first{margin-top:6px}
.vid{width:100%;border-radius:18px;display:block;background:#000;aspect-ratio:16/9}
.jumph{margin:14px 0 7px;font-size:var(--t3);color:var(--muted)}
.jumps{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.jump{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:13px;
 border:1.5px solid var(--line);background:#fff;cursor:pointer;font:inherit;text-align:left}
.jump:active{background:#F2F8F4}
.jt{flex:0 0 auto;font-size:var(--t2);color:var(--band);font-weight:700;min-width:32px}
.jx{flex:1 1 auto;font-size:var(--t3);color:var(--ink2);line-height:1.4}
.fallback{margin:0 0 10px;font-size:var(--t3);color:var(--muted);font-style:italic}

.lhsub{margin:-4px 0 8px;font-size:var(--t3);color:var(--muted);line-height:1.5}
.card.recall{align-items:stretch;text-align:left;padding:16px}
.card.recall .qmid{text-align:center;margin:0 0 10px;font-size:var(--t6)}
.rsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.rsteps li{font-size:var(--t5);font-weight:600;color:var(--ink);line-height:1.35}
.rsteps li::marker{color:var(--muted);font-size:var(--t3);font-weight:400}

.covart{width:100%;max-width:300px;height:auto;display:block;margin:6px auto 10px}
.covgot{margin:2px 0 0;font-size:var(--t3);color:var(--muted)}
.covgot b{font-size:var(--t6);color:var(--band);margin-right:5px}
.insideh{margin:26px 0 9px;font-size:var(--t3);color:var(--muted);font-weight:600;text-align:center}
.inside{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.ic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:13px 6px;border-radius:16px;
 background:#fff;border:1.5px solid var(--line);font-size:var(--t2);color:var(--muted);
 text-align:center;line-height:1.3}
.ic b{font-size:var(--t6);color:var(--ink);font-weight:650}
.peek{display:flex;justify-content:center;gap:10px;margin-top:12px;font-size:23px}

const GEN={
 wordClass(r,lvl,cls){
  const c=cls||pick(r,["noun","verb","adjective","adverb","pronoun","determiner","preposition","conjunction"]);
  const [sent,ans]=pick(r,CLASSES[c]);
  return {ask:"tapWords", sent:sent, a:ans, lab:c, hint:"Tap every "+c+"."};
 },
 wcName(r){
  const c=pick(r,["noun","verb","adjective","adverb","pronoun","determiner","preposition","conjunction"]);
  const [sent,ans]=pick(r,CLASSES[c]);
  const w=ans[0];
  const opts=shuffle(r,["noun","verb","adjective","adverb","pronoun","determiner","preposition","conjunction"]).filter(x=>x!==c).slice(0,3);
  return {ask:"choose", sent:sent.replace(/\|/g,""), q:"What word class is <b>"+w+"</b>?",
          opts:shuffle(r,opts.concat([c])), a:c};
 },
 punct(r,lvl,kind){
  /* v11: every punctuation subtopic drew from all six kinds, so "Colons"
     asked about brackets. A subtopic now asks about its own marks; the
     paper, the check and today's practice still mix them. */
  const pool=kind?PUNCT.filter(p=>PUNCTSET[kind].includes(p.k)):PUNCT;
  const p=pick(r,pool);
  return {ask:"tapGaps", sent:p.sent, hint:"Where does "+p.ask+" go? Tap the place.", a:p.n, lab:p.k};
 },
 apostrophe(r){
  const row=pick(r,APOS);
  return {ask:"choose", q:"Which is correct? <i>("+row.q+")</i>",
          opts:shuffle(r,[row.a].concat(row.w)), a:row.a};
 },
 contract(r){
  const [full,short]=pick(r,CONTR);
  return {ask:"type", q:"Write the contracted form of <b>"+full+"</b>", a:short, hint:"Remember the apostrophe."};
 },
 func(r){
  const [s,f]=pick(r,FUNC);
  return {ask:"choose", sent:s, q:"What kind of sentence is this?",
          opts:shuffle(r,["statement","question","command","exclamation"]), a:f};
 },
 syn(r){
  const row=pick(r,SYN);
  return {ask:"choose", q:"Which word means the same as <b>"+row[0]+"</b>?",
          opts:shuffle(r,row.slice(1)), a:row[1]};
 },
 ant(r){
  const row=pick(r,ANT);
  return {ask:"choose", q:"Which word means the opposite of <b>"+row[0]+"</b>?",
          opts:shuffle(r,row.slice(1)), a:row[1]};
 },
 prefix(r){
  const [p,w,full]=pick(r,PREFIX);

 },
 suffix(r){
  const [w,s,full]=pick(r,SUFFIX);

 },
 standard(r){
  const [sent,a]=pick(r,STD);
  const both=sent.match(/\|([^|]+)\|/)[1].split(" / ");

 },
 formal(r){
  const [inf,form]=pick(r,FORMAL);

 clause(r){

 tense(r){

  /* v11: every marked verb became a blank but only the first was asked for,
     so "Oliver ______ proud when he ______ his medal" had two gaps and one
     answer box. The other verbs are now shown already in the right tense. */
  let k=0;
  return {ask:"type", sent:sent.replace(/\|([^|]+)\|/g,()=>k++===0?"______":ans[k-1]),
          q:"Put <b>"+w+"</b> into the "+name+" tense.", a:ans[0], hint:"One word, or two if it needs a helper."};
 },
 modal(r){
  const [sent,deg]=pick(r,MODAL);

 voice(r){
  const [a,b,kind]=pick(r,VOICE);

};




/* ================= pictures for English =================
   v13: the maths app draws fractions and columns; here the thing being taught
   is a sentence, so the picture is the sentence itself with the part that
   matters marked the way a teacher would mark it on the board. Lessons write
   it as markup and each step redraws it:
     [[x]]  the thing being taught      {{x}}  the other part
     __x__  underlined (as in the test) ~~x~~  crossed out
     ^^x^^  added in                    a <label> after any of them tags it.
   Three small drawn models sit beside it for questions: a scale (when it
   happened, how certain, how formal), word-building blocks, and the gaps
   between words for punctuation. */
const SEE=/(\[\[(.+?)\]\]|\{\{(.+?)\}\}|__(.+?)__|~~(.+?)~~|\^\^(.+?)\^\^)(?:<([^<>]{1,32})>)?/g;
function seeHTML(str){
 if(!str) return "";
 if(/_{3,}/.test(str)) return String(str).split(/_{3,}/).map(seeHTML).join('<span class="blank"></span>');
 const re=new RegExp(SEE.source,"g");   /* a fresh pattern each call: marks can sit inside an underline */
 let out="", last=0, m;
 while((m=re.exec(str))){
  out+=esc(str.slice(last,m.index));
  const cls=m[2]!==undefined?"s1":m[3]!==undefined?"s2":m[4]!==undefined?"su":m[5]!==undefined?"sx":"sa";
  const txt=m[2]??m[3]??m[4]??m[5]??m[6];
  const span=`<span class="${cls}">${new RegExp(SEE.source).test(txt)?seeHTML(txt):esc(txt)}</span>`;
  out+=m[7]?`<span class="lab">${span}<small>${esc(m[7])}</small></span>`:span;
  last=re.lastIndex;
 }
 return out+esc(str.slice(last));
}
/* the same text with the marks taken off: the labels go, a blank stays a blank */
const seePlain=str=>{ let x=String(str||"").replace(/_{3,}/g,"\u0000"), y;
 while((y=x.replace(new RegExp(SEE.source,"g"),(...m)=>(m[2]??m[3]??m[4]??m[5]??m[6])))!==x) x=y;
 return x.replace(/<[^<>]{1,32}>/g,"").replace(/\u0000/g,"___"); };
const PSVG=(w,h,inner,label)=>`<svg class="pic" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(label)}">${inner}</svg>`;
const ptx=(x,y,s2,o)=>{o=o||{};return `<text x="${x}" y="${y}" text-anchor="${o.a||"middle"}" font-size="${o.fs||12}" fill="${o.c||"var(--muted)"}"${o.b?' font-weight="650"':""}>${esc(s2)}</text>`;};
/* scale: labelled points on a line; `at` marks one, `from` an arrow start */
function scaleSVG(points,at,label){
 const W=280, x=i=>24+i*(W-48)/(points.length-1);
 let s=`<line x1="24" y1="30" x2="${W-24}" y2="30" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`;
 points.forEach((p,i)=>{ const on=i===at;
  s+=`<circle cx="${x(i)}" cy="30" r="${on?9:5}" fill="${on?"var(--band)":"#fff"}" stroke="${on?"var(--band)":"var(--line)"}" stroke-width="2"/>`+
   ptx(x(i),58,p,{c:on?"var(--band)":"var(--muted)",b:on,fs:on?13:12}); });
 return PSVG(W,68,s,label);
}
/* blocks: word parts joined with + and an = result ("?" until revealed) */
function blocksSVG(parts,result,label){
 const cw=c=>Math.max(44,String(c).length*10+20);
 let x=6, s="";
 parts.forEach((p,i)=>{ const w2=cw(p.t);
  if(i) { s+=ptx(x+8,34,"+",{fs:18,c:"var(--ink2)"}); x+=18; }
  s+=`<rect x="${x}" y="12" width="${w2}" height="34" rx="9" fill="${p.k===1?"color-mix(in srgb,var(--band) 18%,#fff)":p.k===2?"var(--sun-bg)":"#fff"}" stroke="${p.k===1?"var(--band)":p.k===2?"var(--sun)":"var(--line)"}" stroke-width="2"/>`+
   ptx(x+w2/2,35,p.t,{fs:16,b:true,c:p.k===1?"var(--band)":p.k===2?"#6A4A05":"var(--ink)"});
  x+=w2+4; });
 if(result!==undefined){ s+=ptx(x+10,35,"=",{fs:18,c:"var(--ink2)"}); x+=24;
  s+=ptx(x,35,result,{a:"start",fs:17,b:true,c:result==="?"?"var(--muted)":"var(--yes)"}); x+=String(result).length*10+10; }
 return PSVG(Math.max(200,x+6),58,s,label);
}
/* the drawing for a question: shown on the first two of a subtopic, and in
   the reveal, where it carries the answer */
const QPIC={
 tense(q,rv){ const name=(String(q.q).match(/the (.+) tense/)||[])[1]||"";
  return scaleSVG(["before","past","now","later"],/perfect/.test(name)?0:/past/.test(name)?1:2,`When it happens: the ${name} tense`); },
 modal(q,rv){ return scaleSVG(["possible","expected","certain"],rv?["possible","expected","certain"].indexOf(q.a):-1,"How sure: possible, expected or certain"); },
 formal(q,rv){ const inf=bold(q)[0]; return blocksSVG([{t:inf}],rv?q.a:"?",`Informal ${inf}, formal ${rv?q.a:"?"}`); },
 prefix(q,rv){ const wd=bold(q)[0], row=PREFIX.filter(r=>r[1]===wd)[0]||[];
  return blocksSVG([{t:rv?row[0]:"?",k:2},{t:wd,k:1}],rv?q.a:undefined,`A prefix added to ${wd}`); },
 suffix(q,rv){ const [suf,wd]=bold(q); return blocksSVG([{t:wd,k:1},{t:suf,k:2}],rv?q.a:"?",`${wd} plus ${suf}`); },
 contract(q,rv){ const full=bold(q)[0]||""; return blocksSVG(full.split(" ").map((t2,i)=>({t:t2,k:i?2:1})),rv?q.a:"?",`${full} shortened`); },
};

   question also carries

const DEF={

const EXPLAIN={

 inTest:"Write the missing word: We used plain ___ to make bread.",
 key:[
  {term:"homophone", def:"is a word that sounds the same as another word but has a different spelling and meaning."}],
 story:[
  {em:"🍞", en:"Zara bakes bread with flour. She puts a flower in a vase."},
  {em:"👂", en:"flour and flower sound the same. The sentence tells you which one to write."}],
 show:"We used plain flour to make bread.",
 steps:[
  {line:"Hear the word.", en:"The word sounds like flower. It could be flour or flower.", why_en:"Think of both spellings before you write.", see:"We used plain __?__ to make bread."},
  {line:"Think about the meaning.", en:"The sentence is about making bread.", why_en:"Ask: is it something you bake with, or something that grows?", see:"We used plain __?__ to make {{bread}}."},
  {line:"Write the right spelling.", en:"You bake with flour.", why_en:"flower is a plant. flour is for baking.", see:"We used plain [[flour]] to make {{bread}}."}],
 guided:{steps:[
   {ask_en:"Leo ___ the ball to Sam. (threw or through?)", a:"threw"},
   {ask_en:"We waited in the ___ to buy tickets.", a:"queue"},
   {ask_en:"A bee landed on a ___ in the garden. (flour or flower?)", a:"flower"}]},
 examples:[
  {show:"They passed a bridge on their way to school.",
   steps:[
    {line:"Hear the word.", en:"It could be passed or past.", why_en:"Both sound the same. Look at the rest of the sentence.", see:"They __?__ a bridge on their way to school."},
    {line:"Look for a verb.", en:"A verb is a doing word. This sentence needs one.", why_en:"passed is a verb. It is pass with -ed, so it happened in the past.", see:"{{They}} __?__ a bridge on their way to school."},
    {line:"Write passed.", en:"There is no other verb, so you need passed.", why_en:"If the sentence already has a verb, like walked, use past: We walked past the bridge.", see:"{{They}} [[passed]]<verb> a bridge on their way to school."}]}],
 test:{en:"Write the missing word.",
  show:"The children walked home ___ the park. (through)",
  steps:[
   {line:"Hear the word.", en:"It could be through or threw.", why_en:"threw is the past tense of throw. through means in one side and out the other.", see:"The children walked home __?__ the park."},
   {line:"Think about the meaning.", en:"The children went in one side of the park and out the other.", why_en:"Nobody is throwing anything. So it is not threw.", see:"The children {{walked}} home __?__ the park."},
   {line:"Write the right spelling.", en:"Write through.", why_en:"through has ough in the middle: t-h-r-o-u-g-h.", see:"The children {{walked}} home [[through]] the park."}]},
 mistake:{lines:["Mei threw the ball to her dog.", "We drove passed the school.", "Kofi waited in the queue."],
  wrong:1,
  fix_en:"drove is already the verb, so you need past, not passed. The right sentence is: We drove past the school."}},

"spell:S53": {title:"Words ending -cious and -tious",
 inTest:"Write the missing word. You hear the word, then a sentence with a gap.",
 key:[
  {term:"suffix", def:"is a group of letters added to the end of a word, like -ous or -ly."},
  {term:"root word", def:"is the word you start with, before you add a prefix or a suffix."}],
 story:[
  {em:"🍲", en:"Delicious, suspicious and nutritious all end with the same sound: shuss."},
  {em:"🔍", en:"That sound can be spelt -cious or -tious. A word you already know tells you which one."}],
 show:"suspicious",
 steps:[
  {line:"Listen for the shuss ending.", en:"Say the word slowly: sus-pi-cious. The last part sounds like shuss.", why_en:"Clap each part as you say it. The last clap is the ending you need to check.", see:"sus + pi + [[cious]]<shuss>"},
  {line:"Think of a word in the same family.", en:"Suspicious comes from suspicion. Suspicion has a c in it.", why_en:"Ask yourself: is there a shorter word inside this one? Write it down first.", see:"[[suspicion]] → {{suspici}}^^ous^^"},
  {line:"Keep the same letter.", en:"The family word has a c, so you write -cious.", why_en:"A word with -ce or -cion becomes -cious: space, spacious; grace, gracious.", see:"suspi[[c]]ion → suspi[[c]]^^ious^^"},
  {line:"Write it and read it back.", en:"Check every letter: s-u-s-p-i-c-i-o-u-s.", why_en:"Cover the word, then look again. Ask: does it look right?", see:"[[suspicious]]"}],
 guided:{steps:[
   {ask_en:"Space becomes ___ (a room with lots of space). Type the word.", a:"spacious"},
   {ask_en:"Grace becomes ___ (kind and polite). Type the word.", a:"gracious"},
   {ask_en:"Caution becomes ___ (being careful). Type the word.", a:"cautious"}]},
 examples:[
  {show:"nutritious",
   steps:[
    {line:"Listen for the shuss ending.", en:"Say it slowly: nu-tri-tious. It ends with the same shuss sound.", why_en:"The sound is the same as suspicious, but the spelling is not.", see:"nu + tri + [[tious]]<shuss>"},
    {line:"Find the family word.", en:"Nutritious comes from nutrition. Nutrition ends in -tion.", why_en:"A word ending -tion becomes -tious: ambition, ambitious; infection, infectious.", see:"[[nutrition]] → {{nutriti}}^^ous^^"},
    {line:"Keep the t.", en:"The family word has a t, so you write -tious.", why_en:"Do not swap the t for a c. Keep the letter from the family word.", see:"nutri[[t]]ion → nutri[[t]]^^ious^^"}]}],
 test:{en:"Write the missing word. The meal was ___.",
  show:"The meal was __delicious__.",
  steps:[
   {line:"Hear the word in the sentence.", en:"The word is delicious. It means it tasted very good.", why_en:"Listen to the whole sentence. It tells you which word is meant.", see:"The meal was [[delicious]]."},
   {line:"Say it in parts.", en:"de-li-cious. The ending sounds like shuss.", why_en:"Write the first parts: de, li. Then think about the ending.", see:"de + li + [[cious]]"},
   {line:"No family word? Use -cious.", en:"There is no shorter word inside delicious. Most of these words use -cious.", why_en:"Think of words you know, like precious and vicious. Then read it back.", see:"deli[[c]]^^ious^^"}]},
 mistake:{lines:["The cat was suspicious of the new food.", "The cook served a nutricious meal.", "The meal was delicious."],
  wrong:1,
  fix_en:"Nutritious comes from nutrition, which has a t. Keep the t: The cook served a nutritious meal."}},

"spell:S54": {title:"Words ending -tial and -cial",
 inTest:"Write the missing word. You hear the word, then a sentence with a gap.",
 key:[
  {term:"suffix", def:"is a group of letters added to the end of a word."},
  {term:"vowel", def:"is one of the letters a, e, i, o or u. All the other letters are consonants."}],
 story:[
  {em:"📱", en:"Social, special and potential all end with the sound shul."},
  {em:"👀", en:"Look at the letter just before the ending. It tells you whether to write -cial or -tial."}],
 show:"social",
 steps:[
  {line:"Listen for the shul ending.", en:"Say it slowly: so-cial. The last part sounds like shul.", why_en:"Clap each part. The last clap is the ending you need to check.", see:"so + [[cial]]<shul>"},
  {line:"Look at the letter before it.", en:"The letter before the ending is o. O is a vowel.", why_en:"Write the start of the word. Then look at its last letter.", see:"s[[o]]<vowel> + ?ial"},
  {line:"After a vowel, write -cial.", en:"A vowel comes before the ending, so you write -cial.", why_en:"Other words like this: special, official, crucial, facial.", see:"s[[o]]^^cial^^"},
  {line:"Write it and read it back.", en:"Check every letter: s-o-c-i-a-l.", why_en:"Cover the word, then look again. Ask: does it look right?", see:"[[social]]"}],
 guided:{steps:[
   {ask_en:"spe + ___ (better than normal). Type the whole word.", a:"special"},
   {ask_en:"par + ___ (only some of it). Type the whole word.", a:"partial"},
   {ask_en:"essen + ___ (something you really need). Type the whole word.", a:"essential"}]},
 examples:[
  {show:"potential",
   steps:[
    {line:"Listen for the shul ending.", en:"Say it slowly: po-ten-tial. It ends with the same shul sound.", why_en:"The sound is the same as social, but the spelling is not.", see:"po + ten + [[tial]]<shul>"},
    {line:"Look at the letter before it.", en:"The letter before the ending is n. N is a consonant.", why_en:"A consonant is any letter that is not a, e, i, o or u.", see:"pote[[n]]<consonant> + ?ial"},
    {line:"After a consonant, write -tial.", en:"A consonant comes before the ending, so you write -tial.", why_en:"Other words like this: partial, essential, confidential. A few words break the rule, such as initial and financial. Learn those by heart.", see:"pote[[n]]^^tial^^"}]}],
 test:{en:"Write the missing word. The guide showed us the ___ dining room.",
  show:"The guide showed us the __residential__ dining room.",
  steps:[
   {line:"Hear the word in the sentence.", en:"The word is residential. It means a place where people live or stay.", why_en:"Listen to the whole sentence. It tells you which word is meant.", see:"The guide showed us the [[residential]] dining room."},
   {line:"Say it in parts.", en:"res-i-den-tial. The ending sounds like shul.", why_en:"Write the first parts: res, i, den. Then think about the ending.", see:"res + i + den + [[tial]]"},
   {line:"Check the letter before it.", en:"The letter before the ending is n, a consonant. So write -tial.", why_en:"Read it back letter by letter: r-e-s-i-d-e-n-t-i-a-l.", see:"reside[[n]]^^tial^^"}]},
 mistake:{lines:["My coach says I have a lot of potencial.", "It is important to stay safe on social media.", "Today is a special day."],
  wrong:0,
  fix_en:"The letter before the ending is n, a consonant, so it needs -tial: My coach says I have a lot of potential."}},

"spell:S55": {title:"Words ending -ant, -ance, -ent and -ence",
 inTest:"Write the missing word. You hear the word, then a sentence with a gap.",
 key:[
  {term:"suffix", def:"is a group of letters added to the end of a word."},
  {term:"word family", def:"is a group of words that share the same root word, like confident and confidence."}],
 story:[
  {em:"👂", en:"When you say elegant or confident, the ending sounds like unt. You cannot hear if it is a or e."},
  {em:"👪", en:"Words in the same family keep the same letter. If you know one, you know the other."}],
 show:"reluctance",
 steps:[
  {line:"Listen for the ending.", en:"Say it slowly: re-luc-tance. The ending could be -ance or -ence.", why_en:"Clap each part. The last clap is the ending you need to check.", see:"re + luc + [[t?nce]]"},
  {line:"Think of a family word.", en:"Reluctance is in the same family as reluctant.", why_en:"Ask yourself: do I know the -ant or -ent word that goes with this one?", see:"[[reluctant]] → reluctance"},
  {line:"Keep the same letter.", en:"Reluctant has an a, so reluctance has an a too.", why_en:"-ant goes with -ance. -ent goes with -ence.", see:"reluct[[a]]nt → reluct[[a]]^^nce^^"},
  {line:"Write it and read it back.", en:"Check every letter: r-e-l-u-c-t-a-n-c-e.", why_en:"Cover the word, then look again. Ask: does it look right?", see:"[[reluctance]]"}],
 guided:{steps:[
   {ask_en:"Elegant goes with ___ (being graceful and stylish). Type the word.", a:"elegance"},
   {ask_en:"Confident goes with ___ (feeling sure of yourself). Type the word.", a:"confidence"},
   {ask_en:"Hesitation goes with ___ (not sure, slow to act). Type the -ant word.", a:"hesitant"}]},
 examples:[
  {show:"confidence",
   steps:[
    {line:"Listen for the ending.", en:"Say it slowly: con-fi-dence. The ending could be -ance or -ence.", why_en:"This time the family word has an e, not an a.", see:"con + fi + [[d?nce]]"},
    {line:"Think of a family word.", en:"Confidence is in the same family as confident.", why_en:"Say the family word in a spelling voice: con-fi-DENT. It helps you hear the e.", see:"[[confident]] → confidence"},
    {line:"Keep the same letter.", en:"Confident has an e, so confidence has an e too.", why_en:"Also use e after a soft c or soft g sound: innocent, decent, intelligent.", see:"confid[[e]]nt → confid[[e]]^^nce^^"}]}],
 test:{en:"Write the missing word. The silver necklace was ___.",
  show:"The silver necklace was __elegant__.",
  steps:[
   {line:"Hear the word in the sentence.", en:"The word is elegant. It means graceful and stylish.", why_en:"Listen to the whole sentence. It tells you which word is meant.", see:"The silver necklace was [[elegant]]."},
   {line:"Say it in parts.", en:"el-e-gant. The ending sounds like unt.", why_en:"Write the first parts: el, e. Then think about the ending.", see:"el + e + [[g?nt]]"},
   {line:"Use a spelling voice.", en:"Say it the way it is spelt: el-e-GANT. It ends in -ant, like elegance.", why_en:"A spelling voice says every letter clearly. Then read the word back.", see:"eleg[[a]]^^nt^^"}]},
 mistake:{lines:["The silver necklace was elegant.", "After some reluctance, Dad agreed we could stay up.", "He played with great confidance."],
  wrong:2,
  fix_en:"Confidence comes from confident, which has an e. Keep the e: He played with great confidence."}},

"spell:S59": {title:"Words with ough",
 inTest:"Write the missing word. You hear the word, then a sentence with a gap.",
 key:[
  {term:"ough", def:"is a group of four letters that can make lots of different sounds."}],
 story:[
  {em:"🔤", en:"Rough, through, thought and though all have ough. Each one sounds different."},
  {em:"🗂️", en:"Sort ough words into groups by their sound. Then learn one group at a time."}],
 show:"thought",
 steps:[
  {line:"Listen to the word.", en:"Say it slowly: thought. It rhymes with sort.", why_en:"Say the word out loud. Listen for the sound in the middle.", see:"th + [[ought]]<or + t>"},
  {line:"Find its sound group.", en:"The or sound with a t is often spelt ought.", why_en:"Other words in this group: bought, brought, fought, ought.", see:"b[[ought]] · br[[ought]] · f[[ought]] · th[[ought]]"},
  {line:"Write it in parts.", en:"Write the start, th. Then add ought.", why_en:"Thought is the past tense of think. Past tense means it already happened.", see:"{{th}} + ^^ought^^"},
  {line:"Read it back.", en:"Check every letter: t-h-o-u-g-h-t.", why_en:"Cover the word, then look again. Ask: does it look right?", see:"[[thought]]"}],
 guided:{steps:[
   {ask_en:"I ___ a new pencil case yesterday. (the past tense of buy)", a:"bought"},
   {ask_en:"The path was bumpy and ___. (it rhymes with stuff)", a:"rough"},
   {ask_en:"Have you had ___ to eat? (it means as much as you need)", a:"enough"}]},
 examples:[
  {show:"rough",
   steps:[
    {line:"Listen to the word.", en:"Say it slowly: rough. It rhymes with stuff.", why_en:"This ough makes a different sound from thought.", see:"r + [[ough]]<uff>"},
    {line:"Find its sound group.", en:"The uff sound can be spelt ough.", why_en:"Other words in this group: tough and enough. Learn these three together.", see:"r[[ough]] · t[[ough]] · en[[ough]]"},
    {line:"Do not write the sound.", en:"Ruff and rough sound the same. Rough is the word that means bumpy.", why_en:"Write r, then ough. Read it back to check.", see:"~~ruff~~ → r^^ough^^"}]}],
 test:{en:"Write the missing word. We walked ___ the tunnel.",
  show:"We walked __through__ the tunnel.",
  steps:[
   {line:"Hear the word in the sentence.", en:"The word is through. It means in one side and out of the other.", why_en:"Threw sounds the same, but threw is the past tense of throw. Listen to the sentence to choose.", see:"We walked [[through]] the tunnel."},
   {line:"Find its sound.", en:"Through rhymes with zoo. Here ough makes an oo sound.", why_en:"Say it slowly: thr + oo. The oo part is spelt ough.", see:"thr + [[ough]]<oo>"},
   {line:"Write it and read it back.", en:"Check every letter: t-h-r-o-u-g-h.", why_en:"Through has no t at the end. Thought does.", see:"thr^^ough^^"}]},
 mistake:{lines:["I did a rough sketch before painting.", "I thort about it all night.", "We walked through the tunnel."],
  wrong:1,
  fix_en:"Thort is written the way it sounds. The or sound with a t is spelt ought: I thought about it all night."}},

"spell:mixed": {title:"How to tackle the spelling test",
 inTest:"Write the missing word. You hear each word, then a sentence with a gap. There are 20 words.",
 key:[
  {term:"syllable", def:"is one beat in a word. Dis-ap-point-ed has four syllables."},
  {term:"spelling pattern", def:"is a group of letters that keeps coming back, like -tion, -cious or ough."}],
 story:[
  {em:"📻", en:"In the spelling test, you hear a word and a sentence with a gap. You write the word in the gap."},
  {em:"🧩", en:"Each word follows a spelling pattern you have practised. Use the same five steps for every word."}],
 show:"disappointed",
 steps:[
  {line:"Listen to the word and sentence.", en:"Listen to the word: disappointed. Then listen to the sentence.", why_en:"The sentence tells you which word it is. Ava was disappointed to miss the trip.", see:"Ava was [[disappointed]] to miss the trip."},
  {line:"Say it in parts.", en:"Say it slowly and clap each syllable: dis-ap-point-ed.", why_en:"Write one syllable at a time. Long words become short parts.", see:"[[dis]] + {{ap}} + [[point]] + {{ed}}"},
  {line:"Find the pattern.", en:"Dis is a prefix. A prefix is letters added to the start of a word.", why_en:"Find the root word: appointed. Add dis to the front. Do not add or drop any letters.", see:"^^dis^^ + [[appointed]]"},
  {line:"Write it, then read it back.", en:"Read it letter by letter: d-i-s-a-p-p-o-i-n-t-e-d.", why_en:"Cover it, then look again. Ask: does it look right?", see:"[[disappointed]]"}],
 guided:{steps:[
   {ask_en:"Say it in parts and write it: sug-ges-tion (an idea you offer).", a:"suggestion"},
   {ask_en:"Add the suffix -ly to frequent: We ___ go to the beach in summer.", a:"frequently"},
   {ask_en:"Write the word with a silent s: The swans nested on an ___ in the lake.", a:"island"}]},
 examples:[
  {show:"nutritious",
   steps:[
    {line:"Listen to the word and sentence.", en:"The cook served a nutritious meal. Nutritious means good for your body.", why_en:"This time the pattern is at the end of the word, not the start.", see:"The cook served a [[nutritious]] meal."},
    {line:"Say it in parts.", en:"Clap each syllable: nu-tri-tious.", why_en:"The last part sounds like shuss. Check that part carefully.", see:"{{nu}} + {{tri}} + [[tious]]"},
    {line:"Find the pattern.", en:"Nutritious comes from nutrition. Keep the t, so write -tious.", why_en:"A family word often tells you the letters you cannot hear.", see:"nutri[[t]]ion → nutri[[t]]^^ious^^"},
    {line:"Write it, then read it back.", en:"Check every letter: n-u-t-r-i-t-i-o-u-s.", why_en:"If a word looks wrong, try writing it another way on scrap paper.", see:"[[nutritious]]"}]}],
 test:{en:"Write the missing word. The goalkeeper defended ___ during the match.",
  show:"The goalkeeper defended __confidently__ during the match.",
  steps:[
   {line:"Listen to the word and sentence.", en:"The word is confidently. It tells you how the goalkeeper defended.", why_en:"Listen to the whole sentence before you start writing.", see:"The goalkeeper defended [[confidently]] during the match."},
   {line:"Say it in parts.", en:"Clap each syllable: con-fi-dent-ly.", why_en:"Write one syllable at a time.", see:"{{con}} + {{fi}} + [[dent]] + ^^ly^^"},
   {line:"Find the pattern.", en:"The root word is confident. Add the suffix -ly to the end.", why_en:"Keep every letter of confident, including the t. Then add ly.", see:"[[confident]] + ^^ly^^"},
   {line:"Write it, then read it back.", en:"Check every letter: c-o-n-f-i-d-e-n-t-l-y.", why_en:"Ask: does it look right? Then move on to the next word.", see:"[[confidently]]"}]},
 mistake:{lines:["We were rewarded for our hard work.", "After a few days, the seeds developped shoots.", "Ava was disappointed to miss the trip."],
  wrong:1,
  fix_en:"Develop ends in one p. Just add -ed and do not double the p: After a few days, the seeds developed shoots."}},

"punct:comma": {title:"Commas and brackets",
 inTest:"Insert a pair of commas (or brackets) in the correct places.",
 key:[
  {term:"parenthesis", def:"is extra information added to a sentence. It goes between a pair of commas, brackets or dashes."},
  {term:"brackets ( )", def:"come in a pair. They go around extra information."}],
 story:[
  {em:"🎸", en:"Mr Khan plays the guitar. Who is Mr Khan? You can add extra words to tell the reader: our new teacher."},
  {em:"✌️", en:"The extra words need a mark at each end. That shows the reader where they start and where they stop."}],
 show:"Mr Khan, our new teacher, plays the guitar.",
 steps:[
  {line:"Find the extra information.", en:"The words 'our new teacher' tell you more about Mr Khan.", why_en:"Look for words that tell you more about the noun just before them. A noun is a person, place or thing.", see:"Mr Khan [[our new teacher]] plays the guitar."},
  {line:"Cover it and read again.", en:"Read the sentence without those words: Mr Khan plays the guitar. It still makes sense.", why_en:"If the sentence still makes sense without the words, they are a parenthesis.", see:"{{Mr Khan}} ~~our new teacher~~ {{plays the guitar.}}"},
  {line:"Put a comma at each end.", en:"Put one comma before the extra words. Put one comma after them.", why_en:"Commas around extra information always come in a pair. Count them: you need two.", see:"Mr Khan^^,^^ [[our new teacher]]^^,^^ plays the guitar."},
  {line:"Brackets do the same job.", en:"You can use a pair of brackets instead of the commas.", why_en:"Use the mark that the question asks for. Brackets also come in a pair.", see:"Mr Khan ^^(^^[[our new teacher]]^^)^^ plays the guitar."}],
 guided:{steps:[
   {ask_en:"Add a pair of commas. Type the word just before the first comma: Zara my best friend lives next door.", a:"Zara"},
   {ask_en:"Now type the word just before the second comma: Zara my best friend lives next door.", a:"friend"},
   {ask_en:"Commas in a list go between the items, not before 'and'. Type the word just before the comma: We need eggs flour and milk.", a:"eggs"}]},
 examples:[
  {show:"We packed sandwiches, crisps, apples and juice.",
   steps:[
    {line:"Find the items in the list.", en:"There are four things in the list.", why_en:"Say each item to yourself. Each one is a separate thing.", see:"We packed [[sandwiches]] [[crisps]] [[apples]] and [[juice]]."},
    {line:"Put a comma between the items.", en:"A comma goes after each item, up to the word 'and'.", why_en:"The comma takes the place of the word 'and' between items.", see:"We packed [[sandwiches]]^^,^^ [[crisps]]^^,^^ [[apples]] and [[juice]]."},
    {line:"No comma before 'and'.", en:"The word 'and' already joins the last two items.", why_en:"Before the last item, write 'and' instead of a comma.", see:"We packed sandwiches, crisps, [[apples]] {{and}} [[juice]]."}]}],
 test:{en:"Insert a pair of brackets in the correct places.",
  show:"Priya (the tallest girl in our class) reached the top shelf.",
  steps:[
   {line:"Find the extra information.", en:"The words 'the tallest girl in our class' tell you more about Priya.", why_en:"These words describe the noun Priya.", see:"Priya [[the tallest girl in our class]] reached the top shelf."},
   {line:"Cover it and read again.", en:"Priya reached the top shelf. It still makes sense.", why_en:"The sentence works without the words, so they are a parenthesis.", see:"{{Priya}} ~~the tallest girl in our class~~ {{reached the top shelf.}}"},
   {line:"Put a bracket at each end.", en:"One bracket goes before 'the'. The other goes after 'class'.", why_en:"Check you have put in two brackets, one at each end.", see:"Priya ^^(^^[[the tallest girl in our class]]^^)^^ reached the top shelf."}]},
 mistake:{lines:["Leo, my cousin, is coming to tea.", "Leo, my cousin is coming to tea.", "Leo (my cousin) is coming to tea."],
  wrong:1,
  fix_en:"The second sentence has only one comma. The extra words need a comma at each end: Leo, my cousin, is coming to tea."}},

"punct:semicolon": {title:"Semi-colons and dashes",
 inTest:"Insert a semi-colon (or a dash) in the correct place.",
 key:[
  {term:"semi-colon ( ; )", def:"joins two main clauses that are closely linked."},
  {term:"main clause", def:"makes sense on its own as a sentence."}],
 story:[
  {em:"🍽️", en:"Amina was hungry. She had missed lunch. These two sentences are about the same thing."},
  {em:"🔗", en:"You can join them with a semi-colon or a dash. This shows the reader that the two ideas belong together."}],
 show:"Amina was hungry; she had missed lunch.",
 steps:[
  {line:"Find the two parts.", en:"The sentence has two parts. Each part has its own verb: 'was' and 'had missed'.", why_en:"A verb is a doing or being word. Look for one in each part.", see:"[[Amina was hungry]] {{she had missed lunch}}"},
  {line:"Check each part makes sense alone.", en:"'Amina was hungry.' 'She had missed lunch.' Both make sense on their own.", why_en:"Cover one part. If the other part still makes sense as a sentence, it is a main clause.", see:"[[Amina was hungry.]] {{She had missed lunch.}}"},
  {line:"Put the semi-colon in the gap.", en:"The semi-colon goes between the two main clauses.", why_en:"Do not use a capital letter after a semi-colon. The sentence carries on.", see:"[[Amina was hungry]]^^;^^ {{she had missed lunch.}}"},
  {line:"A dash can do the same job.", en:"A dash ( – ) can also join two main clauses. It is a little less formal.", why_en:"Use the mark the question asks for. Leave a space on each side of the dash.", see:"[[Amina was hungry]] ^^–^^ {{she had missed lunch.}}"}],
 guided:{steps:[
   {ask_en:"Add a semi-colon. Type the word just before it: The bus was late we missed the start of the show.", a:"late"},
   {ask_en:"Add a semi-colon. Type the word just after it: Tomasz loves football he plays every Saturday.", a:"he"},
   {ask_en:"Add a dash. Type the word just before it: I need a new pencil mine has snapped.", a:"pencil"}]},
 examples:[
  {show:"Sam stayed inside because it was raining.",
   steps:[
    {line:"Find the two parts.", en:"The parts are 'Sam stayed inside' and 'because it was raining'.", why_en:"Look for where a new idea starts.", see:"[[Sam stayed inside]] {{because it was raining.}}"},
    {line:"Check each part makes sense alone.", en:"'Because it was raining.' does not make sense on its own. It is not a main clause.", why_en:"Words like 'because', 'when' and 'if' start a part that cannot stand alone.", see:"[[Sam stayed inside.]] __because__ {{it was raining.}}"},
    {line:"No semi-colon here.", en:"The word 'because' already joins the two parts. A semi-colon is only for two main clauses.", why_en:"Take out 'because' and you have two main clauses. Then a semi-colon works: Sam stayed inside; it was raining.", see:"[[Sam stayed inside]]^^;^^ ~~because~~ {{it was raining.}}"}]}],
 test:{en:"Insert a semi-colon in the correct place.",
  show:"The film was very long; Kofi fell asleep before the end.",
  steps:[
   {line:"Find the two parts.", en:"The parts are 'The film was very long' and 'Kofi fell asleep before the end'.", why_en:"Look for the second verb, 'fell'. The new part starts with the word before it.", see:"[[The film was very long]] {{Kofi fell asleep before the end}}"},
   {line:"Check each part makes sense alone.", en:"Both parts make sense as sentences, so both are main clauses.", why_en:"Read each part on its own. If both work, you can use a semi-colon.", see:"[[The film was very long.]] {{Kofi fell asleep before the end.}}"},
   {line:"Put the semi-colon in the gap.", en:"The semi-colon goes after 'long'.", why_en:"Keep 'Kofi' with a capital letter because it is a name.", see:"[[The film was very long]]^^;^^ {{Kofi fell asleep before the end.}}"}]},
 mistake:{lines:["Zara loves painting; she paints every weekend.", "Zara loves painting; every weekend.", "Zara loves painting – she paints every weekend."],
  wrong:1,
  fix_en:"'Every weekend' does not make sense on its own, so it is not a main clause. Write: Zara loves painting; she paints every weekend."}},

"punct:colon": {title:"Colons",
 inTest:"Insert a colon in the correct place.",
 key:[
  {term:"colon ( : )", def:"comes before a list or an explanation."}],
 story:[
  {em:"🎒", en:"Leo packed three things for the trip. Which three things? The reader wants to know."},
  {em:"👉", en:"A colon points to what comes next. It tells the reader: here is the list."}],
 show:"Leo packed three things for the trip: a coat, a torch and a map.",
 steps:[
  {line:"Find the list.", en:"The list is 'a coat, a torch and a map'.", why_en:"Look for the items. They often have commas between them.", see:"Leo packed three things for the trip [[a coat, a torch and a map.]]"},
  {line:"Check the first part makes sense alone.", en:"'Leo packed three things for the trip.' This makes sense on its own.", why_en:"The words before a colon must make sense on their own as a sentence.", see:"{{Leo packed three things for the trip.}} [[a coat, a torch and a map]]"},
  {line:"Put the colon before the list.", en:"The colon goes straight after 'trip', just before the first item.", why_en:"Do not use a capital letter after the colon. The list starts with a small letter.", see:"{{Leo packed three things for the trip}}^^:^^ [[a coat, a torch and a map.]]"}],
 guided:{steps:[
   {ask_en:"Add a colon. Type the word just before it: You will need three things a pencil, a ruler and a rubber.", a:"things"},
   {ask_en:"Add a colon. Type the word just before it: Aisha has two pets a hamster and a goldfish.", a:"pets"},
   {ask_en:"A colon can come before an explanation. Type the word just before it: Jack was soaking wet he had fallen in the pond.", a:"wet"}]},
 examples:[
  {show:"Priya was delighted: she had won the race.",
   steps:[
    {line:"Find the two parts.", en:"The parts are 'Priya was delighted' and 'she had won the race'.", why_en:"This time there is no list. Look for where the second idea starts.", see:"[[Priya was delighted]] {{she had won the race}}"},
    {line:"Does the second part explain the first?", en:"Why was Priya delighted? Because she had won the race.", why_en:"Ask 'why?' about the first part. If the second part answers it, a colon fits.", see:"[[Priya was delighted]] {{she had won the race}}<explains why>"},
    {line:"Put the colon in the gap.", en:"The colon goes after 'delighted'.", why_en:"The first part must still make sense on its own. 'Priya was delighted.' does.", see:"[[Priya was delighted]]^^:^^ {{she had won the race.}}"}]}],
 test:{en:"Insert a colon in the correct place.",
  show:"On holiday, we visited three countries: France, Spain and Italy.",
  steps:[
   {line:"Find the list.", en:"The list is 'France, Spain and Italy'.", why_en:"The items are the names of the three countries.", see:"On holiday, we visited three countries [[France, Spain and Italy.]]"},
   {line:"Check the first part makes sense alone.", en:"'On holiday, we visited three countries.' This makes sense on its own.", why_en:"If the words before the gap make a sentence, the colon can go there.", see:"{{On holiday, we visited three countries.}} [[France, Spain and Italy]]"},
   {line:"Put the colon before the list.", en:"The colon goes after 'countries'.", why_en:"Only one colon is needed. It goes just before the first item.", see:"{{On holiday, we visited three countries}}^^:^^ [[France, Spain and Italy.]]"}]},
 mistake:{lines:["My bag holds: a book, a pen and a drink.", "My bag holds three things: a book, a pen and a drink."],
  wrong:0,
  fix_en:"'My bag holds' does not make sense on its own, so a colon cannot go after it. Write: My bag holds three things: a book, a pen and a drink."}},

"punct:hyphen": {title:"Hyphens",
 inTest:"Insert a hyphen in the correct place.",
 key:[
  {term:"hyphen ( - )", def:"joins two words, or parts of a word, so that they work together."}],
 story:[
  {em:"🦈", en:"'A man eating shark' could mean a man who is eating a shark."},
  {em:"🔗", en:"'A man-eating shark' is a shark that eats people. The hyphen shows which words go together."}],
 show:"a man-eating shark",
 steps:[
  {line:"Read it without a hyphen.", en:"'A man eating shark' could mean two different things.", why_en:"When a phrase could mean two things, check if two words should be joined.", see:"a [[man]] {{eating shark}}"},
  {line:"Find the words that work together.", en:"'Man' and 'eating' go together. Together they describe the shark.", why_en:"Ask: which words join up to tell you about the noun? Here the noun is 'shark'.", see:"a [[man eating]] {{shark}}"},
  {line:"Join them with a hyphen.", en:"Put the hyphen between 'man' and 'eating'. Leave no spaces around it.", why_en:"A hyphen is short and has no spaces. A dash is longer and has a space on each side.", see:"a [[man]]^^-^^[[eating]] {{shark}}"}],
 guided:{steps:[
   {ask_en:"Add a hyphen. Type the word just before it: We bought a ready made cake.", a:"ready"},
   {ask_en:"Add a hyphen. Type the word just after it: There was a build up of traffic.", a:"up"},
   {ask_en:"Type the two words joined with a hyphen: Mei met a well known author.", a:"well-known"}]},
 examples:[
  {show:"Dad will re-cover the old sofa.",
   steps:[
    {line:"Read it without a hyphen.", en:"'Dad will recover the old sofa.' Recover means to get better after being ill.", why_en:"A sofa cannot get better, so this meaning is wrong.", see:"Dad will [[recover]] the old sofa."},
    {line:"Find the prefix.", en:"A prefix is a group of letters added to the start of a word. Here the prefix is 're'. It means 'again'.", why_en:"Dad will cover the sofa again with new fabric.", see:"Dad will [[re]]{{cover}} the old sofa."},
    {line:"Add a hyphen after the prefix.", en:"re-cover means to cover again. The hyphen keeps the two meanings apart.", why_en:"Use a hyphen after 're' when the joined word already means something else.", see:"Dad will [[re]]^^-^^{{cover}} the old sofa."}]}],
 test:{en:"Insert a hyphen in the correct place.",
  show:"Zara chose a sugar-free drink.",
  steps:[
   {line:"Find the noun.", en:"The noun is 'drink'. Which words tell you about it?", why_en:"Look at the words just before the noun.", see:"Zara chose a sugar free [[drink]]."},
   {line:"Find the words that work together.", en:"'Sugar' and 'free' go together. They tell you the drink has no sugar.", why_en:"The drink is not 'sugar' and it is not 'free'. It is 'sugar free'.", see:"Zara chose a {{sugar free}} [[drink]]."},
   {line:"Join them with a hyphen.", en:"The hyphen goes between 'sugar' and 'free'.", why_en:"No spaces go around a hyphen.", see:"Zara chose a {{sugar}}^^-^^{{free}} [[drink]]."}]},
 mistake:{lines:["We had a last-minute change of plan.", "Tomasz will re-cover his book with new paper.", "The dog-ran across the field."],
  wrong:2,
  fix_en:"'Dog' and 'ran' do not join up to describe anything, so they need no hyphen. Write: The dog ran across the field."}},

"apostrophe": {title:"Apostrophes",
 inTest:"Tick one sentence that uses apostrophes correctly.",
 key:[
  {term:"apostrophe ( ' )", def:"shows that something belongs to someone, or that letters are missing."},
  {term:"possession", def:"means owning something. An apostrophe can show who the owner is."}],
 story:[
  {em:"🐕", en:"The dog's bowl is empty. That is one dog with one bowl."},
  {em:"🐕🐕", en:"The dogs' bowl is empty. That is more than one dog sharing a bowl. The apostrophe tells you how many owners."}],
 show:"My sister's bike is red.",
 steps:[
  {line:"Find the owner.", en:"Ask: whose bike is it? It belongs to my sister.", why_en:"Find the owner first. The apostrophe goes straight after the owner.", see:"My {{sister}} [[bike]] is red."},
  {line:"One owner: add 's.", en:"There is one sister, so add an apostrophe and then s.", why_en:"One owner: write the owner word, then 's.", see:"My {{sister}}^^'s^^ [[bike]] is red."},
  {line:"More than one, ending in s: add '.", en:"Two sisters share a bedroom. 'Sisters' already ends in s, so add only an apostrophe.", why_en:"Say the owner word. If it means more than one and ends in s, put the apostrophe after the s.", see:"My {{sisters}}^^'^^ [[bedroom]] is big."},
  {line:"More than one, no s: add 's.", en:"'Children' means more than one child, but it does not end in s. Add 's.", why_en:"Words like children, men and women take 's: the children's coats.", see:"The {{children}}^^'s^^ [[coats]] are wet."}],
 guided:{steps:[
   {ask_en:"One girl owns a bag. Write the missing word: the ___ bag", a:"girl's"},
   {ask_en:"Three girls share a room. Write the missing word: the ___ room", a:"girls'"},
   {ask_en:"The toys belong to the children. Write the missing word: the ___ toys", a:"children's"}]},
 examples:[
  {show:"Tom's one of those boys who's always happy to help.",
   steps:[
    {line:"Is anything owned here?", en:"Nothing belongs to Tom. These apostrophes show missing letters.", why_en:"Ask: does Tom own something? If not, the apostrophe may show missing letters.", see:"[[Tom's]] one of those boys [[who's]] always happy to help."},
    {line:"Say the full words.", en:"Tom's means 'Tom is'. Who's means 'who is'.", why_en:"Read the sentence with the full words. If it makes sense, the apostrophe is right.", see:"[[Tom is]] one of those boys [[who is]] always happy to help."},
    {line:"who's or whose?", en:"Whose asks who owns something: Whose coat is this? Here you need 'who is', so write who's.", why_en:"Swap in 'who is'. If it makes sense, write who's. If not, write whose.", see:"Tom^^'^^s one of those boys who^^'^^s always happy to help."}]}],
 test:{en:"Tick one sentence that uses an apostrophe correctly. (More than one teacher shares the room.)",
  show:"The teachers' staffroom was full of books.",
  steps:[
   {line:"Find the owner.", en:"The staffroom belongs to the teachers.", why_en:"Read the clue in brackets. It tells you there is more than one teacher.", see:"The {{teachers}} [[staffroom]] was full of books."},
   {line:"Does the owner word end in s?", en:"'Teachers' means more than one, and it ends in s.", why_en:"More than one owner, ending in s, means the apostrophe goes after the s.", see:"The {{teachers}}<ends in s> [[staffroom]] was full of books."},
   {line:"Put the apostrophe after the s.", en:"Tick the sentence with teachers'.", why_en:"teacher's would mean one teacher. teachers with no apostrophe shows no owner at all.", see:"The {{teachers}}^^'^^ [[staffroom]] was full of books."}]},
 mistake:{lines:["James's dog barked at the postman.", "The childrens' coats are wet.", "The car's horn beeps loudly."],
  wrong:1,
  fix_en:"'Children' already means more than one, and it does not end in s. Add 's: The children's coats are wet."}},

"contract": {title:"Contractions",
 inTest:"Write the contracted form of the words in bold.",
 key:[
  {term:"contraction", def:"is a short form of two words, such as don't for do not."},
  {term:"apostrophe ( ' )", def:"shows where the missing letters were."}],
 story:[
  {em:"💬", en:"When we talk, we often join two words. We say 'I'm' instead of 'I am'."},
  {em:"✂️", en:"When you write the short form, some letters are left out. An apostrophe goes in their place."}],
 show:"do not → don't",
 steps:[
  {line:"Write the two words.", en:"Start with the full words: do not.", why_en:"Always start from the full words. Then you can see what changes.", see:"[[do]] {{not}}"},
  {line:"Take out the missing letter.", en:"Push the two words together. The o in 'not' is left out.", why_en:"Say the short form aloud. The sound you no longer hear is the missing letter.", see:"[[do]]n~~o~~t"},
  {line:"Put the apostrophe in the gap.", en:"The apostrophe goes where the o was: don't.", why_en:"Put the apostrophe where the letters are missing, not where the two words meet.", see:"[[do]]n^^'^^t"}],
 guided:{steps:[
   {ask_en:"Write the contracted form of 'I am'.", a:"I'm"},
   {ask_en:"Write the contracted form of 'she will'.", a:"she'll"},
   {ask_en:"Write the contracted form of 'cannot'.", a:"can't"}]},
 examples:[
  {show:"will not → won't",
   steps:[
    {line:"Write the two words.", en:"Start with the full words: will not.", why_en:"This one is different. Some letters change, not just go missing.", see:"[[will]] {{not}}"},
    {line:"The first word changes.", en:"'will' changes to 'wo'. The o in 'not' is left out.", why_en:"Learn this one by heart. You cannot work it out from the letters.", see:"~~will~~ ^^wo^^n~~o~~t"},
    {line:"Put the apostrophe in the gap.", en:"The apostrophe goes where the o was: won't.", why_en:"Check it: won't means will not. 'I won't be late' means 'I will not be late'.", see:"[[wo]]n^^'^^t"}]}],
 test:{en:"Write the contracted form of the words in bold: They have finished their lunch.",
  show:"they have → they've",
  steps:[
   {line:"Write the two words.", en:"Start with the full words: they have.", why_en:"Find the two words you need to join.", see:"[[they]] {{have}}"},
   {line:"Take out the missing letters.", en:"Push the words together. The h and the a in 'have' are left out.", why_en:"Say 'they've' aloud. You hear 've' but not 'ha'.", see:"[[they]]~~ha~~ve"},
   {line:"Put the apostrophe in the gap.", en:"The apostrophe goes where 'ha' was: they've.", why_en:"One apostrophe is enough, even when two letters are missing.", see:"[[they]]^^'^^ve"}]},
 mistake:{lines:["We should've left earlier.", "We should of left earlier.", "We shouldn't have left so late."],
  wrong:1,
  fix_en:"'Should of' is wrong. The full words are 'should have', so the contraction is should've: We should've left earlier."}},

"wordClass:noun": {title:"Nouns",
 inTest:"Circle all the nouns in the sentence below.",
 key:[
  {term:"noun", def:"names a person, place, animal, thing or idea."},
  {term:"abstract noun", def:"names something you cannot see or touch, like courage or fun."}],
 story:[
  {em:"🎒", en:"Zara packs her bag, her lunch and her book. Each of those words names a thing."},
  {em:"🏷️", en:"Words that name things are called nouns. Some nouns name feelings or ideas, like fun or courage."}],
 show:"My brother lost his shoes at the park.",
 steps:[
  {line:"Look for people first.", en:"Ask: who is in this sentence?", why_en:"brother names a person. So brother is a noun.", see:"My [[brother]]<noun> lost his shoes at the park."},
  {line:"Then look for things and places.", en:"Ask: what things are there? Where does it happen?", why_en:"shoes are things. park is a place. Both are nouns.", see:"My [[brother]]<noun> lost his [[shoes]]<noun> at the [[park]]<noun>."},
  {line:"Check with 'a' or 'the'.", en:"Put 'a' or 'the' in front of the word.", why_en:"If it makes sense, the word is probably a noun. 'the lost' does not make sense, so lost is not a noun.", see:"^^a^^ [[brother]] · ^^the^^ [[shoes]] · ^^the^^ [[park]] · ~~the lost~~"}],
 guided:{steps:[
   {ask_en:"Type the noun: The kitten slept soundly.", a:"kitten"},
   {ask_en:"Type the noun that names a place: Kofi swam in the pool.", a:"pool"},
   {ask_en:"Type the abstract noun: Mei felt great joy.", a:"joy"}]},
 examples:[
  {show:"Leo had a long swim after school.",
   steps:[
    {line:"Find the names and places.", en:"Leo is a name. school is a place.", why_en:"Leo is a proper noun. A proper noun is the name of one person or place. It starts with a capital letter.", see:"[[Leo]]<noun> had a long swim after [[school]]<noun>."},
    {line:"Check words that look like actions.", en:"swim is often a verb. Here it has 'a long' in front of it.", why_en:"When 'a' or 'the' comes in front, the word is naming a thing. So swim is a noun here.", see:"[[Leo]]<noun> had {{a long}} [[swim]]<noun> after [[school]]<noun>."},
    {line:"Compare it with a verb.", en:"In 'Leo swims every day', swims is the action.", why_en:"Always ask what the word does in THIS sentence. Then decide.", see:"Leo [[swims]]<verb> every day."}]}],
 test:{en:"Circle all the nouns in the sentence below.",
  show:"Aisha carried the heavy box into the kitchen.",
  steps:[
   {line:"Find the person.", en:"Aisha is a name, so it is a noun.", why_en:"Names of people always count as nouns.", see:"[[Aisha]]<noun> carried the heavy box into the kitchen."},
   {line:"Find the things and places.", en:"box is a thing. kitchen is a place.", why_en:"Try 'the' in front: the box, the kitchen. Both make sense.", see:"[[Aisha]]<noun> carried the heavy [[box]]<noun> into the [[kitchen]]<noun>."},
   {line:"Check the other words.", en:"heavy describes the box. carried is the action.", why_en:"heavy is an adjective and carried is a verb. Circle only Aisha, box and kitchen.", see:"[[Aisha]] {{carried}}<verb> the {{heavy}}<adjective> [[box]] into the [[kitchen]]."}]},
 mistake:{lines:["The [[dog]] chased the [[ball]].", "Her [[courage]] surprised the [[village]].", "Sam [[ran]] to the [[shop]]."],
  wrong:2,
  fix_en:"ran is not a noun. It is the action, so it is a verb. The nouns are Sam and shop."}},

"wordClass:verb": {title:"Verbs",
 inTest:"Circle the two verbs in the sentence below.",
 key:[
  {term:"verb", def:"tells you what someone or something does or is."},
  {term:"tense", def:"shows when something happens, in the past or the present."}],
 story:[
  {em:"⚽", en:"Kofi kicks the ball. It flies into the net."},
  {em:"💬", en:"kicks and flies tell you what happens. They are verbs. Every sentence needs a verb."}],
 show:"Jamila walked home and opened the door.",
 steps:[
  {line:"Ask: what happens?", en:"Find the action. What did Jamila do?", why_en:"She walked. walked is the action, so it is a verb.", see:"Jamila [[walked]]<verb> home and opened the door."},
  {line:"Look for every action.", en:"A sentence can have more than one verb.", why_en:"After a joining word like 'and', look again. Another verb often comes next.", see:"Jamila [[walked]]<verb> home and [[opened]]<verb> the door."},
  {line:"Check: change the tense.", en:"Change the sentence from the past to the present.", why_en:"Verbs change their form. home and door stay the same, so they are not verbs.", see:"Jamila ~~walked~~ ^^walks^^ home and ~~opened~~ ^^opens^^ the door."}],
 guided:{steps:[
   {ask_en:"Type the verb: The baby laughed.", a:"laughed"},
   {ask_en:"Type the verb: Priya is my friend.", a:"is"},
   {ask_en:"This sentence has two verbs: We sang while Dad cooked. Type the second verb.", a:"cooked"}]},
 examples:[
  {show:"Tomasz was tired, so he went to bed.",
   steps:[
    {line:"Find the action.", en:"What did Tomasz do? He went to bed.", why_en:"went is the action, so it is a verb.", see:"Tomasz was tired, so he [[went]]<verb> to bed."},
    {line:"Look for a 'being' verb.", en:"was does not show an action. It tells you how Tomasz was.", why_en:"is, am, are, was and were are verbs too. They tell you what someone is or was.", see:"Tomasz [[was]]<verb> tired, so he [[went]]<verb> to bed."},
    {line:"Check: change the tense.", en:"Put the sentence in the present tense.", why_en:"Both words change. That shows they are both verbs.", see:"Tomasz ~~was~~ ^^is^^ tired, so he ~~went~~ ^^goes^^ to bed."}]}],
 test:{en:"Circle the two verbs in the sentence below.",
  show:"The crowd cheered when the runner finished.",
  steps:[
   {line:"Ask: what happened?", en:"What did the crowd do? They cheered.", why_en:"cheered is the first action.", see:"The crowd [[cheered]]<verb> when the runner finished."},
   {line:"Look after the joining word.", en:"After 'when', ask: what did the runner do?", why_en:"The runner finished. finished is the second verb.", see:"The crowd [[cheered]]<verb> when the runner [[finished]]<verb>."},
   {line:"Check the other words.", en:"crowd and runner name people. They are nouns.", why_en:"Circle cheered and finished only.", see:"The {{crowd}}<noun> [[cheered]] when the {{runner}}<noun> [[finished]]."}]},
 mistake:{lines:["The dog [[barked]] loudly.", "We [[sang]] together.", "She gave me a big [[smile]]."],
  wrong:2,
  fix_en:"Here smile has 'a big' in front of it, so it names a thing. It is a noun. The verb in that sentence is gave."}},

"wordClass:adjective": {title:"Adjectives",
 inTest:"Circle the two adjectives in the sentence below.",
 key:[
  {term:"adjective", def:"describes a noun. It tells you what kind, what colour or what size."},
  {term:"noun", def:"names a person, place, animal or thing."}],
 story:[
  {em:"🐶", en:"Sam says, 'I have a dog.' You do not know much about it."},
  {em:"🐕", en:"Sam says, 'I have a small, fluffy dog.' Now you can picture it. small and fluffy are adjectives."}],
 show:"The old man carried a heavy bag.",
 steps:[
  {line:"Find the nouns first.", en:"Adjectives describe nouns, so find the nouns.", why_en:"man and bag are things you can point to. They are nouns.", see:"The old {{man}}<noun> carried a heavy {{bag}}<noun>."},
  {line:"Look just before each noun.", en:"Which word tells you more about it?", why_en:"Ask: what kind of man? An old man. What kind of bag? A heavy bag.", see:"The [[old]]<adjective> {{man}} carried a [[heavy]]<adjective> {{bag}}."},
  {line:"Check with 'very'.", en:"Most adjectives make sense with 'very' in front.", why_en:"very old and very heavy both work. 'very the' does not. The and a are determiners: words that come before a noun.", see:"^^very^^ [[old]] · ^^very^^ [[heavy]] · ~~very the~~"}],
 guided:{steps:[
   {ask_en:"Type the adjective: Mei wore a red coat.", a:"red"},
   {ask_en:"Type the adjective that describes the bird: The tiny bird sat on a broken branch.", a:"tiny"},
   {ask_en:"Type the adjective: The soup was hot.", a:"hot"}]},
 examples:[
  {show:"The pizza was hot, so Leo ate it slowly.",
   steps:[
    {line:"Find the noun.", en:"pizza is the thing in this sentence.", why_en:"Now look for a word that tells you about the pizza.", see:"The {{pizza}}<noun> was hot, so Leo ate it slowly."},
    {line:"An adjective can come after the noun.", en:"Ask: what was the pizza like? It was hot.", why_en:"An adjective can come after is or was. hot describes the pizza, so it is an adjective.", see:"The {{pizza}} was [[hot]]<adjective>, so Leo ate it slowly."},
    {line:"Check words that end in -ly.", en:"slowly tells you how Leo ate. It describes an action.", why_en:"A word that describes a verb is an adverb, not an adjective. Ask what the word describes: a thing or an action.", see:"The {{pizza}} was [[hot]]<adjective>, so Leo {{ate}} it {{slowly}}<adverb>."}]}],
 test:{en:"Circle the two adjectives in the sentence below.",
  show:"A bright light filled the empty room.",
  steps:[
   {line:"Find the nouns.", en:"light and room are things.", why_en:"Try 'the' in front: the light, the room. Both are nouns.", see:"A bright {{light}}<noun> filled the empty {{room}}<noun>."},
   {line:"Find the describing words.", en:"What kind of light? A bright one. What kind of room? An empty one.", why_en:"bright and empty describe the nouns. They are adjectives.", see:"A [[bright]]<adjective> {{light}} filled the [[empty]]<adjective> {{room}}."},
   {line:"Check the other words.", en:"filled is the action. A and the are determiners.", why_en:"Circle bright and empty only.", see:"A [[bright]] {{light}} __filled__<verb> the [[empty]] {{room}}."}]},
 mistake:{lines:["Zara has a [[noisy]] puppy.", "The puppy barked [[noisily]].", "The garden was [[quiet]]."],
  wrong:1,
  fix_en:"noisily describes how the puppy barked. It describes a verb, so it is an adverb. noisy, in the first line, is the adjective."}},

"wordClass:adverb": {title:"Adverbs",
 inTest:"Circle all the adverbs in the sentence below.",
 key:[
  {term:"adverb", def:"describes a verb. It tells you how, when, where or how often something happens."},
  {term:"verb", def:"is a doing or being word, like run, ate or is."}],
 story:[
  {em:"🚶", en:"Jack walked to school. That tells you what he did."},
  {em:"🏃", en:"Jack walked quickly to school. Now you know how he walked. quickly is an adverb."}],
 show:"She spoke quietly and left quickly.",
 steps:[
  {line:"Find the verbs first.", en:"Adverbs tell you about verbs, so find the actions.", why_en:"spoke and left are the actions. They are verbs.", see:"She {{spoke}}<verb> quietly and {{left}}<verb> quickly."},
  {line:"Ask how, when, where or how often.", en:"How did she speak? How did she leave?", why_en:"The word that answers the question is the adverb.", see:"She {{spoke}} [[quietly]]<adverb> and {{left}} [[quickly]]<adverb>."},
  {line:"Remember: not every adverb ends in -ly.", en:"often, soon, here, outside and together are adverbs too.", why_en:"Ask the question about the verb, even when there is no -ly. How often do we walk? Often.", see:"We [[often]]<adverb> {{walk}} to school [[together]]<adverb>."}],

 examples:[

    {line:"Compare with an adjective.", en:"In 'Kofi is a fast runner', fast describes runner.", why_en:"runner is a noun. A word that describes a noun is an adjective. Look at what the word describes each time.", see:"Kofi is a [[fast]]<adjective> {{runner}}<noun>."}]}],

"wordClass:pronoun": {title:"Pronouns",
 inTest:"Circle all the pronouns in the sentence below.",
