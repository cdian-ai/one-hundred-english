 story:[
  {em:"🔁", en:"Priya saw Leo at the park. Priya waved at Leo. That sounds odd."},

 show:"He passed her the ball.",

  {line:"Find words that stand for people.", en:"He and her stand for people we already know about.", why_en:"passed is a verb. ball is a noun. He and her are the pronouns.", see:"[[He]]<pronoun> passed [[her]]<pronoun> the ball."},
  {line:"Swap in a name to check.", en:"Put a name where the word is.", why_en:"Jack passed Mei the ball. It makes sense, so He and her are pronouns.", see:"~~He~~ ^^Jack^^ passed ~~her~~ ^^Mei^^ the ball."},
  {line:"Learn the common pronouns.", en:"I, you, he, she, it, we, they, me, him, her, us, them.", why_en:"mine, yours, his, hers, ours and theirs are pronouns too.", see:"[[He]]<pronoun> passed [[her]]<pronoun> the ball. [[She]]<pronoun> kicked [[it]]<pronoun>."}],
 guided:{steps:[
   {ask_en:"Type the pronoun: Tomasz dropped it.", a:"it"},
   {ask_en:"Type the pronoun: The teacher thanked us.", a:"us"},
   {ask_en:"Type a pronoun to replace 'Zara': ___ is my cousin.", a:"she"}]},
 examples:[

    {line:"Look at the word after 'her'.", en:"A noun comes straight after her: pencil.", why_en:"Here her tells you whose pencil it is. It does not stand on its own.", see:"Kofi lent [[me]]<pronoun> {{her}} __pencil__<noun>."},
    {line:"Swap in a name with 's.", en:"Kofi lent me Aisha's pencil. That works.", why_en:"If a name fits, the word is a pronoun. If a name with 's fits, it is a determiner. So her is a determiner here.", see:"Kofi lent [[me]]<pronoun> ~~her~~ ^^Aisha's^^ pencil."}]}],
 test:{en:"Circle all the pronouns in the sentence below.",
  show:"We told him about her dog.",
  steps:[
   {line:"Find words that stand for people.", en:"We and him stand for people.", why_en:"Swap in names: Sam and Ola told Leo. It works.", see:"[[We]]<pronoun> told [[him]]<pronoun> about her dog."},
   {line:"Check the word 'her'.", en:"A noun comes straight after her: dog.", why_en:"Swap in Aisha's: about Aisha's dog. A name with 's fits, so her is a determiner here.", see:"[[We]] told [[him]] about {{her}}<determiner> dog."},
   {line:"Circle only the pronouns.", en:"Circle We and him.", why_en:"her is not circled, because it is doing a determiner's job here.", see:"[[We]]<pronoun> told [[him]]<pronoun> about her dog."}]},

"wordClass:determiner": {title:"Determiners",
 inTest:"Circle all the determiners in the sentence below.",
 key:[
  {term:"determiner", def:"comes before a noun and tells you which one, whose, or how many."}],
 story:[
  {em:"🍎", en:"Aisha asks for an apple. Any apple will do."},
  {em:"🍏", en:"Then she asks for that apple. Now she means one apple only. an and that are determiners."}],
 show:"Those children found three coins.",
 steps:[
  {line:"Find the nouns first.", en:"A determiner always goes with a noun.", why_en:"children and coins are the nouns. A noun names a person, place or thing.", see:"Those {{children}}<noun> found three {{coins}}<noun>."},
  {line:"Look in front of each noun.", en:"Which word tells you which ones or how many?", why_en:"Those tells you which children. three tells you how many coins.", see:"[[Those]]<determiner> {{children}} found [[three]]<determiner> {{coins}}."},
  {line:"Know the main determiners.", en:"a, an, the · this, that, these, those · my, your, our, their · some, every · numbers.", why_en:"Put a noun after the word. If it fits, it can be a determiner.", see:"[[a]] dog · [[the]] dog · [[this]] dog · [[my]] dog · [[some]] dogs"}],
 guided:{steps:[
   {ask_en:"Type the determiner: Leo ate an orange.", a:"an"},
   {ask_en:"Type the determiner: Our cat is asleep.", a:"our"},
   {ask_en:"Type the determiner: Kofi rode a big red bike.", a:"a"}]},
 examples:[
  {show:"This is my favourite book.",
   steps:[
    {line:"Find the noun.", en:"book is the only noun.", why_en:"Now look at the words in front of it.", see:"This is my favourite {{book}}<noun>."},
    {line:"Look in front of the noun.", en:"favourite describes the book. my tells you whose book.", why_en:"favourite is an adjective. my is the determiner. The determiner comes first.", see:"This is [[my]]<determiner> favourite {{book}}."},
    {line:"Check the word 'This'.", en:"The word after This is 'is', a verb. No noun comes after it.", why_en:"This stands on its own here, so it is a pronoun. In 'This book is my favourite', This is a determiner.", see:"{{This}}<pronoun> is [[my]]<determiner> favourite book."}]}],
 test:{en:"Circle all the determiners in the sentence below.",
  show:"My little brother ate some grapes.",
  steps:[
   {line:"Find the nouns.", en:"brother and grapes are the nouns.", why_en:"Determiners come in front of nouns, so look there.", see:"My little {{brother}}<noun> ate some {{grapes}}<noun>."},
   {line:"Look in front of each noun.", en:"little describes brother. It is an adjective.", why_en:"My comes before little. It tells you whose brother. some tells you how many grapes.", see:"[[My]]<determiner> little {{brother}} ate [[some]]<determiner> {{grapes}}."},
   {line:"Circle the determiners.", en:"Circle My and some.", why_en:"Do not circle little. It describes the noun, so it is an adjective.", see:"[[My]]<determiner> __little__<adjective> {{brother}} ate [[some]]<determiner> {{grapes}}."}]},
 mistake:{lines:["[[The]] cat slept on the mat.", "[[Those]] are my shoes.", "[[Every]] child got a medal."],
  wrong:1,
  fix_en:"No noun comes after Those. It stands on its own, so it is a pronoun. In 'Those shoes are mine', Those is a determiner."}},

"wordClass:preposition": {title:"Prepositions",
 inTest:"Circle all the prepositions in the sentence below.",
 key:[
  {term:"preposition", def:"links a noun or pronoun to the rest of the sentence. It often tells you where or when."},
  {term:"noun phrase", def:"is a group of words built around a noun, like 'the table'."}],
 story:[
  {em:"🐱", en:"Where is the cat? It is under the table. Now it is on the sofa."},
  {em:"📍", en:"under and on tell you where the cat is. They are prepositions."}],
 show:"The cat sat under the table beside the door.",
 steps:[
  {line:"Ask: where or when?", en:"Where did the cat sit? Under the table.", why_en:"under tells you where. It comes just before 'the table'.", see:"The cat sat [[under]]<preposition> the table beside the door."},
  {line:"Look at what comes next.", en:"A preposition is followed by a noun phrase.", why_en:"'the table' and 'the door' are noun phrases. beside comes before 'the door', so it is a preposition too.", see:"The cat sat [[under]]<preposition> {{the table}} [[beside]]<preposition> {{the door}}."},
  {line:"Try the box sentence.", en:"Many prepositions fit here: The cat went ___ the box.", why_en:"Some prepositions tell you when instead: before lunch, after school, during the film.", see:"The cat went ^^into^^ / ^^under^^ / ^^behind^^ the box."}],
 guided:{steps:[
   {ask_en:"Type the preposition: The ball rolled behind the shed.", a:"behind"},
   {ask_en:"Type the preposition: Sam put the letter in the drawer.", a:"in"},
   {ask_en:"Type the preposition that tells you when: We played after lunch.", a:"after"}]},
 examples:[
  {show:"We played football after we ate lunch.",
   steps:[
    {line:"Look at what comes after 'after'.", en:"After it comes 'we ate lunch'.", why_en:"That group has a verb: ate. A group of words with a verb is a clause.", see:"We played football after {{we ate lunch}}<clause>."},
    {line:"A clause follows, so it is a conjunction.", en:"after joins two clauses here.", why_en:"A word that starts a clause like this is a subordinating conjunction, not a preposition.", see:"We played football [[after]]<conjunction> {{we ate lunch}}."},
    {line:"Compare it with a preposition.", en:"In 'We played football after lunch', only a noun follows.", why_en:"No verb comes after it, so after is a preposition here. Always check what comes next.", see:"We played football [[after]]<preposition> {{lunch}}<noun>."}]}],
 test:{en:"Circle all the prepositions in the sentence below.",
  show:"Mei hid the present behind the sofa before her party.",
  steps:[
   {line:"Ask: where?", en:"Where did Mei hide the present? Behind the sofa.", why_en:"behind tells you where, and a noun phrase follows it.", see:"Mei hid the present [[behind]]<preposition> {{the sofa}} before her party."},
   {line:"Ask: when?", en:"When did she hide it? Before her party.", why_en:"before is followed by 'her party', a noun phrase with no verb. So before is a preposition.", see:"Mei hid the present [[behind]]<preposition> {{the sofa}} [[before]]<preposition> {{her party}}."},
   {line:"Circle the prepositions.", en:"Circle behind and before.", why_en:"hid is a verb. present, sofa and party are nouns.", see:"Mei hid the present [[behind]] the sofa [[before]] her party."}]},
 mistake:{lines:["The dog slept [[under]] the bed.", "We left [[before]] the film ended.", "Leo waited [[outside]] the shop."],
  wrong:1,
  fix_en:"In line 2, 'the film ended' has a verb, ended. So before is a subordinating conjunction there. As a preposition: We left before the end of the film."}},

"wordClass:conjunction": {title:"Conjunctions",
 inTest:"Circle the conjunction in the sentence below.",
 key:[
  {term:"conjunction", def:"joins words or clauses. A clause is a group of words with a verb in it."},
  {term:"subordinating conjunction", def:"starts a clause that adds extra information, like because, when, if, although or until."}],
 story:[
  {em:"☔", en:"Amina stayed inside. It was raining."},
  {em:"🔗", en:"Amina stayed inside because it was raining. because joins the two ideas and tells you why."}],
 show:"I stayed inside because it was raining.",
 steps:[
  {line:"Find the two parts.", en:"Each part has its own verb: stayed and was raining.", why_en:"A group of words with a verb is called a clause. This sentence has two clauses.", see:"{{I stayed inside}} because {{it was raining}}."},
  {line:"Find the joining word.", en:"because links the two clauses.", why_en:"Take it out. You are left with two separate sentences: I stayed inside. It was raining.", see:"{{I stayed inside}} [[because]]<conjunction> {{it was raining}}."},
  {line:"Know the two kinds.", en:"and, but and or are co-ordinating conjunctions. They join two equal parts.", why_en:"because, when, if, although and until are subordinating conjunctions. They add extra information.", see:"He ran fast [[but]]<co-ordinating> he did not win. · Call me [[when]]<subordinating> you get home."}],
 guided:{steps:[
   {ask_en:"Type the conjunction: You can have juice or milk.", a:"or"},
   {ask_en:"Type the conjunction: We waited until the bus arrived.", a:"until"},
   {ask_en:"Type the conjunction: Although she was tired, Zara carried on.", a:"although"}]},
 examples:[
  {show:"Although she was tired, she carried on.",
   steps:[
    {line:"Find the two clauses.", en:"'she was tired' and 'she carried on' each have a verb.", why_en:"So this sentence has two clauses.", see:"Although {{she was tired}}, {{she carried on}}."},
    {line:"Look at the start of the sentence.", en:"Although joins the two clauses. It just comes first.", why_en:"A subordinating conjunction can start a sentence. A comma goes after its clause.", see:"[[Although]]<conjunction> {{she was tired}}^^,^^ {{she carried on}}."},
    {line:"Check: move the clause.", en:"Put the Although part at the end.", why_en:"It still makes sense, and although still joins the clauses. So it is a conjunction.", see:"{{She carried on}} [[although]]<conjunction> {{she was tired}}."}]}],
 test:{en:"Circle the conjunction in the sentence below.",
  show:"We waited until the bus arrived.",
  steps:[
   {line:"Find the two clauses.", en:"'We waited' and 'the bus arrived' each have a verb.", why_en:"Now find the word that joins them.", see:"{{We waited}} until {{the bus arrived}}."},
   {line:"Find the joining word.", en:"until joins the two clauses.", why_en:"A clause with a verb, arrived, comes after until. So until is a conjunction here.", see:"{{We waited}} [[until]]<conjunction> {{the bus arrived}}."},
   {line:"Compare it with a preposition.", en:"In 'We waited until lunch', only a noun follows until.", why_en:"There, until is a preposition. Here, circle until as the conjunction.", see:"We waited [[until]]<preposition> {{lunch}}<noun>."}]},
 mistake:{lines:["I like apples [[and]] pears.", "Kofi smiled [[when]] he saw the cake.", "Priya ran [[across]] the road."],
  wrong:2,
  fix_en:"across is followed by 'the road', a noun phrase with no verb. So across is a preposition, not a conjunction."}},

"wcName": {title:"Name that word",
 inTest:"Tick one box to show the word class of the underlined word.",
 key:[
  {term:"word class", def:"is the name for the job a word does in a sentence, such as noun, verb or adjective."}],
 story:[
  {em:"💡", en:"'Turn on the light.' Here light names a thing. It is a noun."},
  {em:"🪶", en:"'This bag is light.' Here light describes the bag. It is an adjective. So always look at the sentence."}],

  {line:"Look at what comes straight after.", en:"'the park' comes next. It is a noun phrase, a group of words built around a noun.", why_en:"A noun or noun phrase next: it may be a determiner, an adjective or a preposition. A clause with a verb next: it may be a conjunction.", see:"We walked __through__ {{the park}}<noun phrase>."},
  {line:"Ask what job it does.", en:"through tells you where we walked. It links 'walked' to 'the park'.", why_en:"A word that links a noun phrase and tells you where or when is a preposition.", see:"We walked [[through]]<preposition> {{the park}}."},
  {line:"Check with a swap.", en:"Swap in another word from the same class.", why_en:"across is a preposition, and it fits. So through is a preposition.", see:"We walked ~~through~~ ^^across^^ the park."}],
 guided:{steps:[

   {ask_en:"Type the word class of 'Those': Those children found three coins.", a:"determiner"},
   {ask_en:"Type the word class of 'them': She gave them the letter.", a:"pronoun"}]},
 examples:[

    {line:"Look at what comes straight after.", en:"'he gets home' comes next. It has a verb: gets.", why_en:"A group of words with a verb is a clause.", see:"Kofi will ring __when__ {{he gets home}}<clause>."},
    {line:"Ask what job it does.", en:"when joins 'Kofi will ring' to 'he gets home'.", why_en:"Take it out and you have two sentences. So when is a conjunction.", see:"{{Kofi will ring}} [[when]]<conjunction> {{he gets home}}."}]}],
 test:{en:"Tick one box to show the word class of the underlined word.",
  show:"__Although__ she was tired, she carried on.",
  steps:[
   {line:"Look at what comes straight after.", en:"'she was tired' comes next. It has a verb: was.", why_en:"A clause follows, so the word may be a conjunction.", see:"__Although__ {{she was tired}}<clause>, she carried on."},
   {line:"Ask what job it does.", en:"Although joins 'she was tired' to 'she carried on'.", why_en:"It joins two clauses, so it is a conjunction. It does not have to be in the middle.", see:"[[Although]]<conjunction> {{she was tired}}, {{she carried on}}."},
   {line:"Tick the answer.", en:"Tick conjunction.", why_en:"Check: take Although out. You are left with two sentences: She was tired. She carried on.", see:"~~Although~~ She was tired^^.^^ She carried on."}]},

"tense": {title:"Getting the tense right",
 inTest:"Complete the sentence with the verb in the past progressive.",
 key:[
  {term:"tense", def:"shows when something happens: in the past or in the present."},
  {term:"progressive", def:"shows an action that is or was still going on. It uses a form of be and a verb ending in -ing: was walking."}],
 story:[
  {em:"⚽", en:"Kofi scored a goal yesterday. He tells his mum about it."},
  {em:"🕰️", en:"He says \"I scored\", not \"I score\". The verb tells her it is over."}],
 show:"Yesterday Amina walked home and opened the door.",
 steps:[
  {line:"Find the time clue.", en:"Yesterday tells you this happened in the past.", why_en:"Look for words like yesterday, last week, now or every day. Find the clue before you write the verb.", see:"[[Yesterday]]<time clue> Amina walked home and opened the door."},
  {line:"Find every verb.", en:"A verb is a doing or being word. Here there are two: walked and opened.", why_en:"Underline each verb in the sentence. Each one needs to be in the right tense.", see:"[[Yesterday]] Amina {{walked}}<verb> home and {{opened}}<verb> the door."},
  {line:"Make them all match.", en:"Both verbs are in the simple past. Most simple past verbs end in -ed.", why_en:"Some verbs change instead: bring becomes brought, fly becomes flew. Say the sentence aloud to check.", see:"[[Yesterday]] Amina {{walk}}^^ed^^ home and {{open}}^^ed^^ the door."}],
 guided:{steps:[
   {ask_en:"Write the verb in the simple past: Last week I ___ (bring) my violin to school.", a:"brought"},
   {ask_en:"Write the verb in the present tense: The plane ___ (fly) high above the clouds.", a:"flies"},
   {ask_en:"Write the verb in the past progressive: While we ___ (talk), the bell rang.", a:"were talking"}]},
 examples:[
  {show:"While Leo and Zara were talking, his phone started ringing.",
   steps:[
    {line:"Read the tense name.", en:"The question asks for the past progressive. This needs two words.", why_en:"Progressive always means a form of be plus a verb ending in -ing.", see:"While Leo and Zara __talk__, his phone started ringing."},
    {line:"Choose was or were.", en:"Use was for one person. Use were for more than one, or for you.", why_en:"Look at who is doing it. Leo and Zara are two people, so use were.", see:"While {{Leo and Zara}}<two people> [[were]] __talk__, his phone started ringing."},
    {line:"Add -ing to the verb.", en:"talk becomes talking. Now the verb is were talking.", why_en:"Read it back. It shows the talking was still going on when the phone rang.", see:"While {{Leo and Zara}} [[were talk]]^^ing^^, his phone started ringing."}]}],
 test:{en:"Write the verb in the past perfect: I ___ (eat) breakfast before I left.",
  show:"I had eaten breakfast before I left.",
  steps:[
   {line:"Past perfect uses had.", en:"The past perfect shows something that happened before another past event.", why_en:"Write had first. It never changes, for any person.", see:"I [[had]] ___ breakfast before I left."},
   {line:"Choose the right verb form.", en:"After had, eat becomes eaten, not ate.", why_en:"Say \"I have eaten\" in your head. The word after have is the one you need after had.", see:"I [[had]] ^^eaten^^ breakfast before I ~~ate~~ left."},
   {line:"Check the order of events.", en:"First the eating happened. Then the leaving happened.", why_en:"The past perfect goes with the event that happened first.", see:"I [[had eaten]]<first> breakfast before I {{left}}<second>."}]},
 mistake:{lines:["Yesterday Mei walked to the park.", "She __sees__ a dog and __stroked__ it.", "Zara has finished her homework now."],
  wrong:1,

"voice": {title:"Active and passive",
 inTest:"Is this sentence written in the active or the passive? Tick one.",
 key:[
  {term:"active sentence", def:"puts the doer first. The subject does the action: Rabia broke the mug."},
  {term:"passive sentence", def:"puts the thing the action is done to first: The mug was broken by Rabia."}],
 story:[
  {em:"☕", en:"Rabia broke the mug. Rabia did it, so she comes first."},
  {em:"🔄", en:"The mug was broken by Rabia. Now the mug comes first. It is the same event."}],
 show:"The mug was broken by Rabia.",
 steps:[
  {line:"Find the verb.", en:"The verb is the action. Here it is \"was broken\".", why_en:"Include any small word just before it, like was, is or are.", see:"The mug [[was broken]]<verb> by Rabia."},
  {line:"Ask who did the action.", en:"Rabia did the breaking. Rabia is the doer.", why_en:"Ask yourself: who broke it? The answer is the doer.", see:"The mug [[was broken]] by {{Rabia}}<doer>."},
  {line:"Is the doer at the start?", en:"No. The mug is at the start, and the mug did nothing. So this sentence is passive.", why_en:"The subject is who or what the sentence is about. If the subject did the action, it is active. If not, it is passive.", see:"__The mug__<subject> [[was broken]] by {{Rabia}}<doer>. → passive"}],
 guided:{steps:[
   {ask_en:"Type the doer: The window was cleaned by Sam.", a:"Sam"},
   {ask_en:"Type active or passive: Everyone enjoyed the meal.", a:"active"},
   {ask_en:"Type active or passive: The trees are being harmed by pollution.", a:"passive"}]},
 examples:[
  {show:"The treasure was stolen.",
   steps:[
    {line:"Find the verb.", en:"The verb is \"was stolen\".", why_en:"Look for was, were, is or are just before the verb. This often means passive.", see:"The treasure [[was stolen]]<verb>."},
    {line:"Ask who did the action.", en:"The sentence does not say who stole it. There is no doer.", why_en:"A passive sentence can leave the doer out. There is no by part here.", see:"The treasure [[was stolen]] ^^by ...?^^"},
    {line:"Check the subject.", en:"The treasure is the subject. It did not steal anything. So it is passive.", why_en:"To make it active, a doer must come first: Someone stole the treasure.", see:"__The treasure__<subject> [[was stolen]]. → passive"}]}],
 test:{en:"Is this sentence active or passive? Tick one. Pollution is harming the trees.",
  show:"Pollution is harming the trees.",
  steps:[
   {line:"Find the verb.", en:"The verb is \"is harming\".", why_en:"It has the word is in it. That alone does not make it passive.", see:"Pollution [[is harming]]<verb> the trees."},
   {line:"Ask who did the action.", en:"Pollution is doing the harming. Pollution is the doer.", why_en:"Ask: what is harming the trees? The answer is pollution.", see:"{{Pollution}}<doer> [[is harming]] the trees."},
   {line:"Is the doer at the start?", en:"Yes. The doer is the subject, so this sentence is active.", why_en:"Tick active. The passive would be: The trees are being harmed by pollution.", see:"{{Pollution}}<subject and doer> [[is harming]] __the trees__. → active"}]},
 mistake:{lines:["Leo kicked the ball. — active", "The ball was kicked by Leo. — passive", "The cake was eaten. — active"],

  fix_en:"The cake was eaten is passive. The cake did not eat anything; it had the eating done to it. It does not say who ate it, but it is still passive."}},

"modal": {title:"Modal verbs",
 inTest:"What does the modal verb show? Tick one: certain, possible or expected.",
 key:[
  {term:"modal verb", def:"shows how sure we are that something will happen. It comes just before the main verb: might walk."}],
 story:[
  {em:"🌧️", en:"Priya looks out of the window. Grey clouds are coming."},
  {em:"☂️", en:"\"It might rain,\" she says. She is not sure. \"It will rain\" means she is sure."}],
 show:"They might walk home from the station.",
 steps:[
  {line:"Find the modal verb.", en:"It sits just before the main verb. The main verb is walk, so the modal verb is might.", why_en:"Look for one of these: will, must, might, may, could, should.", see:"They [[might]]<modal verb> {{walk}}<main verb> home from the station."},
  {line:"Put it in its group.", en:"will and must show it is certain. might, may and could show it is possible. should shows it is expected.", why_en:"Learn the three groups. Then you only need to find the word.", see:"They [[might]]<possible> {{walk}} home from the station."},
  {line:"Check the meaning.", en:"Say it with maybe: Maybe they will walk home. That fits, so might shows it is possible.", why_en:"If maybe fits, it is possible. If it is sure to happen, it is certain.", see:"They ~~might~~ ^^maybe will^^ walk home from the station. → possible"}],
 guided:{steps:[
   {ask_en:"Type the modal verb: We could go to the beach if it stays dry.", a:"could"},
   {ask_en:"Type certain, possible or expected: I must be at school early tomorrow.", a:"certain"},
   {ask_en:"Type certain, possible or expected: You should wear a helmet on your bike.", a:"expected"}]},
 examples:[
  {show:"He should apologise for what he said.",
   steps:[
    {line:"Find the modal verb.", en:"The main verb is apologise. Just before it is should.", why_en:"should is a modal verb, so it tells you how sure the sentence is.", see:"He [[should]]<modal verb> {{apologise}}<main verb> for what he said."},
    {line:"Ask: is it sure to happen?", en:"No. We do not know if he will say sorry.", why_en:"should does not mean it will happen. So it is not certain.", see:"He [[should]] {{apologise}} for what he said. → not certain"},
    {line:"Ask: is it the right thing to do?", en:"Yes. Saying sorry is what he ought to do. So should shows it is expected.", why_en:"If you can swap in ought to, choose expected.", see:"He ~~should~~ ^^ought to^^ {{apologise}} for what he said."}]}],
 test:{en:"Tick one sentence where the modal verb shows that something is certain.",
  show:"We could go to the beach. / She will finish the book tonight. / They might walk home.",
  steps:[
   {line:"Find each modal verb.", en:"The three modal verbs are could, will and might.", why_en:"Underline the word just before each main verb.", see:"We [[could]] go to the beach. / She [[will]] finish the book tonight. / They [[might]] walk home."},
   {line:"Cross out the possible ones.", en:"could and might show something is possible. They are not certain.", why_en:"Cross out the ones you know are wrong first.", see:"~~We could go to the beach.~~ / She [[will]] finish the book tonight. / ~~They might walk home.~~"},
   {line:"Tick the certain one.", en:"will shows it is certain. Tick: She will finish the book tonight.", why_en:"Read it back. It sounds sure, so it is certain.", see:"She [[will]]<certain> finish the book tonight. ^^✓^^"}]},
 mistake:{lines:["I [[will]] come to your party. — certain", "I [[might]] come to your party. — certain", "I [[should]] come to your party. — expected"],
  wrong:1,
  fix_en:"might does not mean sure. It means maybe. So I might come to your party shows it is possible, not certain."}},

"clause": {title:"Main, subordinate and relative clauses",
 inTest:"What is the underlined part of the sentence? Tick one: main clause, subordinate clause, relative clause or noun phrase.",
 key:[
  {term:"clause", def:"is a group of words that has a verb in it."},
  {term:"noun phrase", def:"is a group of words built around a noun, with no verb: the beautiful grey elephants."}],
 story:[
  {em:"✏️", en:"Kofi wrote: \"Because it was raining.\" His teacher said it did not make sense."},
  {em:"🏠", en:"Kofi added more: \"Because it was raining, we stayed in.\" Now it makes sense."}],
 show:"I walked to school as we live on the same road.",
 steps:[
  {line:"Look for a verb.", en:"The underlined part has a verb: live. A verb is a doing or being word.", why_en:"If there is a verb, it is a clause. If there is no verb, it is a noun phrase.", see:"I walked to school __as we [[live]]<verb> on the same road__."},
  {line:"Check the first word.", en:"It starts with as. As is a subordinating conjunction. This is a joining word like because, when or although.", why_en:"It does not start with who, which or that. So it is not a relative clause.", see:"I walked to school __[[as]]<subordinating conjunction> we live on the same road__."},
  {line:"Does it make sense on its own?", en:"\"As we live on the same road.\" This does not make sense alone. So it is a subordinate clause.", why_en:"Cover the rest of the sentence and read the underlined part. A main clause makes sense on its own.", see:"{{I walked to school}}<main clause> [[as we live on the same road]]<subordinate clause>."}],
 guided:{steps:[
   {ask_en:"Type the subordinating conjunction: Before we entered the classroom, we greeted our friends.", a:"before"},
   {ask_en:"Type the relative pronoun: The wheel, which first appeared 5000 years ago, changed everything.", a:"which"},
   {ask_en:"Hazel uses a wheelchair so we went up the ramp. Is \"Hazel uses a wheelchair\" a main clause or a subordinate clause?", a:"main clause"}]},
 examples:[
  {show:"My uncle, who lives on a farm, is going to plant potatoes.",
   steps:[
    {line:"Look for a verb.", en:"The underlined part has a verb: lives. So it is a clause.", why_en:"Find the verb inside the underlined words only.", see:"My uncle, __who [[lives]]<verb> on a farm__, is going to plant potatoes."},
    {line:"Check the first word.", en:"It starts with who. Who is a relative pronoun. Who, which and that are relative pronouns.", why_en:"When the part starts with who, which or that, check what it tells you about.", see:"My uncle, __[[who]]<relative pronoun> lives on a farm__, is going to plant potatoes."},
    {line:"Find the noun it describes.", en:"It tells you more about my uncle. So it is a relative clause.", why_en:"A relative clause sits just after the noun it describes. It often has commas round it.", see:"{{My uncle}}<noun>, [[who lives on a farm]]<relative clause>, is going to plant potatoes."}]}],
 test:{en:"What is the underlined part of the sentence? Tick one. The beautiful grey elephants walked slowly through the forest.",
  show:"The beautiful grey elephants walked slowly through the forest.",
  steps:[
   {line:"Look for a verb.", en:"The underlined part is The beautiful grey elephants. There is no verb in it.", why_en:"walked is a verb, but it is not underlined. Only look inside the underline.", see:"__The beautiful grey elephants__ {{walked}}<not underlined> slowly through the forest."},
   {line:"Find the main noun.", en:"The words are built around one noun: elephants. A noun names a person, place or thing.", why_en:"beautiful and grey are adjectives. They describe the elephants.", see:"__The beautiful grey [[elephants]]<noun>__ walked slowly through the forest."},
   {line:"Tick noun phrase.", en:"No verb, and built around a noun. So it is a noun phrase.", why_en:"Because it has adjectives added, it is also called an expanded noun phrase.", see:"[[The beautiful grey elephants]]<noun phrase> walked slowly through the forest."}]},
 mistake:{lines:["__The tall green bike__ was in the shed. — noun phrase", "We went inside __when the bell rang__. — main clause", "The girl __who sits next to me__ is called Aisha. — relative clause"],
  wrong:1,
  fix_en:"\"When the bell rang\" does not make sense on its own. It starts with when, a subordinating conjunction. So it is a subordinate clause, not a main clause."}},

"syn": {title:"Synonyms",
 inTest:"Tick the word that is closest in meaning to rapid.",
 key:[
  {term:"synonym", def:"is a word that means the same, or nearly the same, as another word."}],
 story:[
  {em:"🐘", en:"Zara saw a huge elephant at the zoo. She could also write “an enormous elephant”."},
  {em:"✏️", en:"Huge and enormous are synonyms. Using synonyms stops you repeating the same word."}],
 show:"The field behind the school is vast.",
 steps:[
  {line:"Find the word to match.", en:"The word is vast. It means very big.", why_en:"If you are not sure, read the sentence. The other words help you guess the meaning.", see:"The field behind the school is [[vast]]."},
  {line:"Try each choice in its place.", en:"Put each word into the sentence. Read it again.", why_en:"Cross out any word that changes the meaning. Tiny, gentle and narrow all change it.", see:"The field behind the school is ~~tiny~~ ~~gentle~~ ~~narrow~~."},
  {line:"Pick the word that keeps the meaning.", en:"Enormous means very big. So does vast.", why_en:"Read the sentence with your answer. It should mean the same as before.", see:"The field behind the school is ~~vast~~ ^^enormous^^."}],
 guided:{steps:[
   {ask_en:"Which word means the same as rapid: slow, quick or quiet? Type it.", a:"quick"},
   {ask_en:"Which word means the same as courageous: tired, polite or brave? Type it.", a:"brave"},
   {ask_en:"Which words mean the same as furious: pleased, very angry or curious? Type them.", a:"very angry"}]},
 examples:[
  {show:"Leo visited an ancient castle.",
   steps:[
    {line:"Find the word to match.", en:"The word is ancient. It means very old.", why_en:"Think of other ancient things you know, like the pyramids.", see:"Leo visited an [[ancient]] castle."},
    {line:"Cross out the opposite.", en:"One choice is modern. That means new, the opposite of ancient.", why_en:"An opposite is often in the list. Cross it out first.", see:"[[ancient]]: ~~modern~~ clean brave very old"},
    {line:"The answer can be two words.", en:"The synonym here is very old. It is two words, and that is fine.", why_en:"Choose the meaning that matches, even if it is a short phrase.", see:"Leo visited a ^^very old^^ castle."}]}],
 test:{en:"Tick the word that is closest in meaning to miserable.",
  show:"Kofi felt miserable when his team lost. (cheerful / noisy / very unhappy / eager)",
  steps:[
   {line:"Find the word to match.", en:"Kofi's team lost. So miserable must be a sad feeling.", why_en:"Use the sentence to work out the meaning.", see:"Kofi felt [[miserable]] when {{his team lost}}."},
   {line:"Cross out words that do not fit.", en:"Cheerful is the opposite. Noisy and eager do not mean sad.", why_en:"Try each one in the sentence. Ask: does it still mean the same?", see:"Kofi felt ~~cheerful~~ ~~noisy~~ ~~eager~~ when his team lost."},
   {line:"Tick the one that is left.", en:"Very unhappy means the same as miserable.", why_en:"Read the sentence once more with your answer in it.", see:"Kofi felt ^^very unhappy^^ when his team lost."}]},
 mistake:{lines:["Rapid means the same as quick.", "Courageous means the same as brave.", "Furious means the same as pleased."],
  wrong:2,
  fix_en:"Furious means very angry. Pleased is nearly the opposite. Write: Furious means the same as very angry."}},

"ant": {title:"Antonyms",
 inTest:"Tick the word that is opposite in meaning to rough.",
 key:[
  {term:"antonym", def:"is a word that means the opposite of another word."}],
 story:[
  {em:"🐱", en:"Aisha strokes her cat. Its fur feels smooth. The doormat feels rough."},
  {em:"↔️", en:"Smooth and rough are opposites. They are antonyms."}],
 show:"The path up the hill was rough.",
 steps:[
  {line:"Read the question word.", en:"The question says opposite. You need an antonym, not a synonym.", why_en:"Underline the word opposite in the question before you choose.", see:"Which word means the __opposite__ of [[rough]]?"},
  {line:"Cross out words that mean the same.", en:"Bumpy, coarse and uneven are close to rough. They are synonyms.", why_en:"Cross out every word that means nearly the same. The antonym is what is left.", see:"[[rough]]: ~~bumpy~~ ~~coarse~~ ~~uneven~~ smooth"},
  {line:"Test it in the sentence.", en:"The path was smooth. The meaning has flipped.", why_en:"If the sentence now means the opposite, you have the antonym.", see:"The path up the hill was ~~rough~~ ^^smooth^^."}],
 guided:{steps:[
   {ask_en:"Which word means the opposite of vivid: dull, bright or colourful? Type it.", a:"dull"},
   {ask_en:"Which word means the opposite of generous: kind, selfish or giving? Type it.", a:"selfish"},
   {ask_en:"Which word means the opposite of temporary: brief, short or permanent? Type it.", a:"permanent"}]},
 examples:[
  {show:"The pond in the garden is shallow.",
   steps:[
    {line:"Read the question word.", en:"You need the opposite of shallow. Shallow means not far to the bottom.", why_en:"Picture it. A shallow pond only comes up to your ankles.", see:"The pond in the garden is [[shallow]]."},
    {line:"Different is not the same as opposite.", en:"Flat, wide and thin are different words. They are not the opposite.", why_en:"An opposite is at the other end of the same idea. Here the idea is how far down.", see:"[[shallow]]: ~~flat~~ ~~wide~~ ~~thin~~ deep"},
    {line:"Test it in the sentence.", en:"A deep pond is far to the bottom. That is the opposite of shallow.", why_en:"Read the new sentence. Check that the meaning has flipped.", see:"The pond in the garden is ~~shallow~~ ^^deep^^."}]}],
 test:{en:"Tick the word that is opposite in meaning to ancient.",
  show:"Mei's grandad rides an ancient bike. (modern / old / aged / historic)",
  steps:[
   {line:"Read the question word.", en:"The question says opposite. Ancient means very old.", why_en:"Underline opposite in the question so you remember.", see:"Mei's grandad rides an [[ancient]] bike."},
   {line:"Cross out words that mean the same.", en:"Old, aged and historic all mean nearly the same as ancient.", why_en:"These are synonyms. Cross them out.", see:"[[ancient]]: ~~old~~ ~~aged~~ ~~historic~~ modern"},
   {line:"Tick the antonym.", en:"Modern means new. That is the opposite of very old.", why_en:"Read it in the sentence. The bike is now new, not old.", see:"Mei's grandad rides a ^^modern^^ bike."}]},
 mistake:{lines:["The opposite of generous is selfish.", "The opposite of shallow is deep.", "The opposite of vivid is bright."],
  wrong:2,
  fix_en:"Vivid and bright mean nearly the same, so they are synonyms. Write: The opposite of vivid is dull."}},

"prefix": {title:"Prefixes",
 inTest:"Add a prefix to the word possible to make it mean the opposite. Write the whole word.",
 key:[
  {term:"prefix", def:"is a group of letters added to the start of a word. It changes the word's meaning."},
  {term:"root word", def:"is the word you start with, before you add anything to it."}],
 story:[
  {em:"🧩", en:"Priya could not finish the puzzle. It was impossible! Im- means not."},
  {em:"🏰", en:"Jack's sandcastle fell down. He had to rebuild it. Re- means again."}],
 show:"possible → impossible",
 steps:[
  {line:"Find the root word.", en:"The root word is possible. You need it to mean not possible.", why_en:"Read the question carefully. Does it want not, again, or undo?", see:"[[possible]]<root word>"},
  {line:"Choose the prefix.", en:"Un-, in-, im- and dis- can all mean not. Say each one aloud.", why_en:"Pick the one that makes a real word. Im- often goes before words starting with m or p. Other prefixes: re- means again, mis- means wrongly, de- means undo, over- means too much, sub- means under.", see:"~~unpossible~~ ~~inpossible~~ ^^im^^possible"},
  {line:"Write the whole word.", en:"Put the prefix on the front. Keep every letter of the root word.", why_en:"Check it: im + possible = impossible.", see:"^^im^^[[possible]] = impossible"}],
 guided:{steps:[
   {ask_en:"Add a prefix to correct to make it mean not correct. Write the whole word.", a:"incorrect"},
   {ask_en:"Add a prefix to build to make it mean build again. Write the whole word.", a:"rebuild"},
   {ask_en:"Add a prefix to spell to make it mean spell wrongly. Write the whole word.", a:"misspell"}]},
 examples:[
  {show:"mature → immature",
   steps:[
    {line:"Find the root word.", en:"The root word is mature. It means grown-up and sensible.", why_en:"You need it to mean not mature.", see:"[[mature]]<root word>"},
    {line:"Choose the prefix.", en:"Mature starts with m. So the prefix is im-.", why_en:"Say it aloud: immature. It sounds right.", see:"^^im^^[[mature]]"},
    {line:"Keep both m's.", en:"The prefix ends in m. The root word starts with m. Write both.", why_en:"Never drop a letter when you add a prefix. im + mature = immature.", see:"i[[m]]{{m}}ature = immature"}]}],
 test:{en:"Add a prefix to the word appear to make it mean the opposite. Write the whole word.",
  show:"Sam watched the rabbit appear. Then he watched it ______.",
  steps:[
   {line:"Find the root word.", en:"The root word is appear. The opposite is to go out of sight.", why_en:"Think about what the rabbit does next in a magic trick.", see:"[[appear]]<root word>"},
   {line:"Choose the prefix.", en:"Say each one: unappear, inappear, disappear. Only disappear is a real word.", why_en:"Dis- can mean not or the opposite.", see:"~~unappear~~ ~~inappear~~ ^^dis^^appear"},
   {line:"Write the whole word.", en:"Write the prefix, then every letter of appear.", why_en:"Check it: dis + appear = disappear. One s, two p's.", see:"Then he watched it ^^dis^^[[appear]]."}]},
 mistake:{lines:["un + happy = unhappy", "mis + spell = mispell", "re + build = rebuild"],
  wrong:1,
  fix_en:"Keep every letter of the root word spell. Write: mis + spell = misspell, with a double s."}},

"suffix": {title:"Suffixes",
 inTest:"Add the suffix ment to the word develop. Write the new word.",
 key:[
  {term:"suffix", def:"is a group of letters added to the end of a word. It can change the word class."}],
 story:[
  {em:"😊", en:"Amina is kind. Her kindness helps everyone. Kind is an adjective. Kindness is a noun."},
  {em:"🔤", en:"-ment, -ness and -ion make nouns. -ous, -ful and -less make adjectives. -ise and -ify make verbs. -ly makes adverbs."}],
 show:"motivate + ion → motivation",
 steps:[
  {line:"Find the root word and the suffix.", en:"The root word is motivate. The suffix is -ion.", why_en:"The root word is the word you start with.", see:"[[motivate]] + {{ion}}"},
  {line:"Check the end of the root word.", en:"Motivate ends in e. The suffix starts with a vowel, i. So drop the e.", why_en:"Look at the last letter every time. An e or a y often changes.", see:"motivat~~e~~ + {{ion}}"},
  {line:"Join them and check the word.", en:"Motivation is a noun. It is the name of a feeling.", why_en:"Say it in a sentence: “Ola has lots of motivation.” If it sounds right, it is right.", see:"[[motivat]]^^ion^^ = motivation<noun>"}],
 guided:{steps:[
   {ask_en:"Add the suffix ness to weak. Write the new word.", a:"weakness"},
   {ask_en:"Add the suffix less to power. Write the new word.", a:"powerless"},
   {ask_en:"Add the suffix ful to care. The suffix ful has one l. Write the new word.", a:"careful"}]},
 examples:[
  {show:"outrage + ous → outrageous",
   steps:[
    {line:"Find the root word and the suffix.", en:"The root word is outrage. The suffix is -ous.", why_en:"Outrageous means very shocking. It is an adjective.", see:"[[outrage]] + {{ous}}"},
    {line:"Check the end of the root word.", en:"Outrage ends in ge. Here you keep the e.", why_en:"The e keeps the g soft, so it sounds like j. Without it you would say outra-gus.", see:"outra[[ge]] + {{ous}}"},
    {line:"Join them and check the word.", en:"Write every letter: outrage + ous.", why_en:"Say it aloud: out-ray-jus. The e is still there.", see:"outrag[[e]]^^ous^^ = outrageous<adjective>"}]}],
 test:{en:"Add a suffix to the word develop to make a noun. Write the new word.",
  show:"The ______ of the new park took two years.",
  steps:[
   {line:"Find what job the word needs.", en:"The gap comes after the. It needs a noun.", why_en:"A noun names a thing. Noun suffixes are -ment, -ness and -ion.", see:"[[The]] ______ of the new park took two years."},
   {line:"Try each noun suffix.", en:"Say each one: developness, developion, development.", why_en:"Only development is a real word.", see:"~~developness~~ ~~developion~~ develop^^ment^^"},
   {line:"Write the new word.", en:"Develop ends in p. Nothing changes. Just add -ment.", why_en:"Read the sentence with your word in it.", see:"The [[development]]<noun> of the new park took two years."}]},
 mistake:{lines:["care + ful = carefull", "quick + ly = quickly", "weak + ness = weakness"],
  wrong:0,
  fix_en:"The suffix -ful has only one l. Write: care + ful = careful."}},

"standard": {title:"Standard English",
 inTest:"Circle the verb that completes the sentence in Standard English.",
 key:[
  {term:"Standard English", def:"is the form of English we use in writing and when we speak formally."}],
 story:[
  {em:"⚽", en:"At the park, Jack says, “We was playing football.” Lots of people talk like this."},
  {em:"✍️", en:"In his school diary, Jack writes, “We were playing football.” That is Standard English."}],
 show:"We were going on a school trip.",
 steps:[
  {line:"Find the subject.", en:"The subject is who or what does the verb. Here it is we.", why_en:"Ask: who was going? We were.", see:"[[We]]<subject> ______ going on a school trip."},
  {line:"Match the verb to the subject.", en:"I, he, she and it go with was. We, you and they go with were.", why_en:"Say both: we was, we were. Pick were for we.", see:"[[We]] ~~was~~ ^^were^^ going on a school trip."},
  {line:"Read the whole sentence.", en:"We were going on a school trip. This is Standard English.", why_en:"Other pairs to know: she doesn't, not she don't. Those tricks, not them tricks. Could have, not could of.", see:"[[We]] {{were}} going on a school trip."}],
 guided:{steps:[
   {ask_en:"We ___ the film last week. Type saw or seen.", a:"saw"},
   {ask_en:"She ___ like mushrooms. Type doesn't or don't.", a:"doesn't"},
   {ask_en:"I like ___ trainers in the window. Type them or those.", a:"those"}]},
 examples:[
  {show:"The musicians did a sound check.",
   steps:[
    {line:"Look for a helper verb.", en:"Done and seen need a helper verb: have, has or had.", why_en:"Look just before the gap. Is there a have, has or had?", see:"The musicians ______ a sound check."},
    {line:"No helper, so use did.", en:"There is no helper here. So the answer is did.", why_en:"The same works for saw and seen. No helper: saw.", see:"The musicians ~~done~~ ^^did^^ a sound check."},
    {line:"With a helper, use done.", en:"Add have and the verb changes to done.", why_en:"Both of these are Standard English.", see:"The musicians {{have}} [[done]] a sound check."}]}],
 test:{en:"Circle the words that complete the sentence in Standard English.",
  show:"Tomasz could have / could of helped us.",
  steps:[
   {line:"Say it aloud.", en:"When we talk fast, could have sounds like could've.", why_en:"Could've sounds like could of. That is why people write it.", see:"Tomasz [[could've]] helped us."},
   {line:"Remember what 've means.", en:"The 've is short for have. It is never of.", why_en:"After could, should, would, might and must, always write have.", see:"could[['ve]] = could {{have}}"},
   {line:"Circle the answer.", en:"Circle could have.", why_en:"Read the sentence with your answer in it.", see:"Tomasz ~~could of~~ ^^could have^^ helped us."}]},
 mistake:{lines:["Kofi doesn't like rain.", "We saw a fox last night.", "I like them shoes in the window."],
  wrong:2,
  fix_en:"Use those before a noun, not them. Write: I like those shoes in the window."}},

"formal": {title:"Formal and informal words",
 inTest:"Which is the more formal word for buy? Tick one.",
 key:[
  {term:"formal", def:"language is used for serious writing, such as a letter to a head teacher."},
  {term:"informal", def:"language is used when you talk or write to friends and family."}],
 story:[
  {em:"💬", en:"Ola texts her friend: “Can I ask you something?”"},
  {em:"✉️", en:"Ola writes to the head teacher: “I would like to request a meeting.” Request is more formal than ask."}],
 show:"The school will purchase a new bench.",
 steps:[
  {line:"Find the informal word.", en:"Buy is an everyday word. You use it with friends.", why_en:"Ask: would I say this to my friend at break time? If yes, it is informal.", see:"The school will [[buy]] a new bench."},
  {line:"Find the formal word.", en:"Formal words are often longer. Purchase means the same as buy.", why_en:"Check that the meaning is the same. A formal word must not change the meaning.", see:"[[buy]] = {{purchase}}"},
  {line:"Put it in the sentence.", en:"The school will purchase a new bench. This sounds like a letter.", why_en:"Read it aloud. It should sound serious but still make sense.", see:"The school will ~~buy~~ ^^purchase^^ a new bench."}],
 guided:{steps:[
   {ask_en:"Which is the more formal word for tell: inform, permit or obtain? Type it.", a:"inform"},
   {ask_en:"Which is the more formal word for get: consider, obtain or funds? Type it.", a:"obtain"},
   {ask_en:"Which is the more formal word for let: permit, request or discover? Type it.", a:"permit"}]},
 examples:[
  {show:"We had to postpone the match.",
   steps:[
    {line:"Find the informal words.", en:"Put off is two words. Together they mean move to a later time.", why_en:"Informal verbs are often two words, like put off, find out and set up.", see:"We had to [[put off]] the match."},
    {line:"Find one formal word.", en:"Postpone means the same as put off.", why_en:"One formal word often replaces two informal words.", see:"[[put off]] = {{postpone}}"},
    {line:"Swap both words.", en:"Take out put and off. Write postpone in their place.", why_en:"Do not leave off behind. “Postpone off” is wrong.", see:"We had to ~~put off~~ ^^postpone^^ the match."}]}],
 test:{en:"Which is the more formal word for think about? Tick one.",
  show:"Please think about our idea. (consider / establish / permit / funds)",
  steps:[
   {line:"Find the informal words.", en:"Think about is two everyday words.", why_en:"You need one formal word with the same meaning.", see:"Please [[think about]] our idea."},
   {line:"Try each choice.", en:"Establish means set up. Permit means let. Funds means money.", why_en:"Cross out any word that changes the meaning.", see:"Please ~~establish~~ ~~permit~~ ~~funds~~ our idea."},
   {line:"Tick the formal word.", en:"Consider means think about. Tick consider.", why_en:"Read it in the sentence. It sounds like a polite letter.", see:"Please ~~think about~~ ^^consider^^ our idea."}]},
 mistake:{lines:["We need to purchase new books.", "Please inform us if you are ill.", "The club will establish up a new team."],
  wrong:2,
  fix_en:"Establish replaces both words in set up. Do not keep up. Write: The club will establish a new team."}},

"func": {title:"Kinds of sentence",
 inTest:"What kind of sentence is this? Tick one: statement, question, command or exclamation.",
 key:[
  {term:"command", def:"tells someone to do something. It often starts with a verb: Pass the plates."},
  {term:"exclamation", def:"starts with What or How and is a full sentence with a verb: What a lovely smell that is!"}],
 story:[
  {em:"🍕", en:"At tea time, Ola's family say four kinds of sentence."},
  {em:"💬", en:"\"The pizza is ready.\" \"Is it hot?\" \"Pass the plates.\" \"What a lovely smell that is!\""}],

/* ---------- hearing the word ----------
   Spelling is dictated in the real test: the child hears a word, sees the
   sentence with a gap, and writes it. Until the recordings exist the phone
   reads it, which is enough to check the course and enough for a child to
   practise with. AUDIO[word] takes a real file the moment there is one, and
   the recorded voice is preferred over the synthetic one automatically. */
const AUDIO={};   /* e.g. "rough":"audio/rough.mp3" */
function say(word){
 const w=String(word).trim();
 if(AUDIO[w]){ try{ new Audio(AUDIO[w]).play(); return }catch(e){} }
 try{
  const ss=window.speechSynthesis;
  if(!ss||typeof SpeechSynthesisUtterance==="undefined") return;
  ss.cancel();
  const u=new SpeechSynthesisUtterance(w);
  u.lang="en-GB"; u.rate=0.85;
  ss.speak(u);
 }catch(e){}
}
function sayTwice(word,sentence){
 say(word);
 if(sentence){ setTimeout(()=>say(sentence.replace(/_+/g,word)), 1200); }
}

const COURSE="english";
/* ================= One Hundred \u2014 the house brand =================
   Shared by both courses. Notice Me is deliberately untouched: if this earns
   its place here, it can move up later.

   The rule is that ONE layer changes between courses \u2014 a hue, a hat, a motif.
   Everything else (type, spacing, radius, card, shadow, the character himself)
   is identical, so the two read as siblings at a glance and are never confused
   for each other. */
const BRAND = {
  maths:  { hue:"#2F7D62", hue2:"#E7F2EC", ink:"#16302A", hat:"cap",
            warm:"#E8A33C", warmBg:"#FCF2E0", name:"Maths" },

/* ---------- the character ----------
   One hare across both courses, wearing what he is teaching. Drawn rather than
   borrowed: an emoji is somebody else's artwork and renders differently on
   every phone, which is why the shelf looked unfinished.
   Poses: hello, think, cheer, point. Same construction every time \u2014 only the
   ears, the arm and the mouth move, so he is recognisably one animal. */
function MASCOT(pose, course, size){
  const B=BRAND[course]||BRAND.maths;
  const s=size||120;
  /* A crow. Counts, uses tools, solves puzzles, and has a hard enough
     silhouette not to read as soft \u2014 which matters for ten and eleven year
     olds, who resent being talked down to more than any other age.
     Two tones and one dark eye, same construction in every pose, so he is
     recognisably one bird whichever hat he is wearing. */
  const dk="#2B303B", md="#3C4352", lt="#4E5666", beak=B.warm, D="#1A1D24";
  /* Wings grow out of the body rather than floating beside it, and there is a
     tail, so the silhouette is a bird rather than two stacked circles. */
  const wing = pose==="cheer"
    ? `<path d="M70 126 C50 118 38 100 48 92 C58 84 68 106 78 124 Z" fill="${md}"/>
       <path d="M130 126 C150 118 162 100 152 92 C142 84 132 106 122 124 Z" fill="${md}"/>`
    : pose==="point"
    ? `<path d="M64 126 C52 122 48 136 60 142 C70 147 76 136 74 126 Z" fill="${md}"/>
       <path d="M136 124 C158 116 176 96 168 86 C160 76 142 92 132 116 Z" fill="${md}"/>
       <circle cx="172" cy="83" r="5.5" fill="${beak}"/>`
    : `<path d="M64 126 C52 122 48 136 60 142 C70 147 76 136 74 126 Z" fill="${md}"/>
       <path d="M136 126 C148 122 152 136 140 142 C130 147 124 136 126 126 Z" fill="${md}"/>`;
  /* The tail sat low and to the right, where it read as a single leg. It is
     up and back now, and he has two actual feet. */
  const tail = `<path d="M144 128 C166 122 186 124 190 132 L150 148 Z" fill="${dk}"/>`;
  const feet = `<path d="M84 166 L84 174 M76 176 L84 174 L92 176" stroke="${beak}" stroke-width="4.5"
      fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 166 L116 174 M108 176 L116 174 L124 176" stroke="${beak}" stroke-width="4.5"
      fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  /* The head is front-on, so the beak must come FORWARD from between the eyes,
     not sideways off the cheek. Drawing a profile beak on a face looking at you
     is why he looked wrong: two viewpoints in one head.
     The head spans y 41 to 107. Every hat is therefore built to sit across
     y 26 to 58 so it overlaps the crown and rests on it, rather than hovering
     above it or being pasted flat across it. */
  const head = pose==="think" ? `rotate(-8 100 74)` : `rotate(0 100 74)`;
  const beakShape = `<path d="M88 82 L100 106 L112 82 Z" fill="${beak}"/>
    <path d="M92 94 L100 106 L108 94 Z" fill="#C07C1F"/>`;
  const eyes = pose==="think"
    ? `<circle cx="85" cy="70" r="8" fill="#fff"/><circle cx="87" cy="71" r="4.4" fill="${D}"/>
       <circle cx="115" cy="70" r="8" fill="#fff"/><circle cx="117" cy="71" r="4.4" fill="${D}"/>
       <path d="M74 56 C79 51 90 51 95 55" stroke="${D}" stroke-width="3" fill="none" stroke-linecap="round"/>`
    : pose==="cheer"
    ? `<path d="M77 70 C81 62 91 62 95 70" stroke="${D}" stroke-width="3.8" fill="none" stroke-linecap="round"/>
       <path d="M105 70 C109 62 119 62 123 70" stroke="${D}" stroke-width="3.8" fill="none" stroke-linecap="round"/>`
    : `<circle cx="85" cy="70" r="8.5" fill="#fff"/><circle cx="86" cy="71" r="4.6" fill="${D}"/>
       <circle cx="115" cy="70" r="8.5" fill="#fff"/><circle cx="116" cy="71" r="4.6" fill="${D}"/>`;
  /* Both hats are cut to the crown: the base line dips to y=58, well inside the
     head, so the head shows through beneath them and they look worn. */
  const hat = B.hat==="cap"
    ? `<g transform="rotate(-7 100 44)">
        <path d="M66 56 C66 33 82 24 100 24 C118 24 134 33 134 56 C120 51 80 51 66 56 Z" fill="${B.hue}"/>
        <path d="M124 52 C142 50 156 52 158 57 C150 61 134 61 124 58 Z" fill="${B.hue}"/>
        <circle cx="100" cy="26" r="4.5" fill="${B.warm}"/></g>`
    : `<g transform="rotate(-6 100 42)">
        <path d="M70 50 C70 34 84 28 100 28 C116 28 130 34 130 50 C116 46 84 46 70 50 Z" fill="${B.hue}" opacity=".95"/>
        <path d="M58 44 L100 29 L142 44 L100 59 Z" fill="${B.hue}"/>
        <path d="M139 45 L139 64" stroke="${B.warm}" stroke-width="3" stroke-linecap="round"/>
        <circle cx="139" cy="66" r="4.2" fill="${B.warm}"/></g>`;
  return `<svg class="mascot" viewBox="0 0 200 175" width="${s}" height="${s*0.875}"
    xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
   ${tail}
   ${feet}
   <path d="M100 94 C134 94 154 116 154 140 C154 159 128 169 100 169 C72 169 46 159 46 140 C46 116 66 94 100 94 Z" fill="${dk}"/>
   <path d="M100 116 C116 116 126 130 126 144 C126 157 114 163 100 163 C86 163 74 157 74 144 C74 130 84 116 100 116 Z" fill="${lt}" opacity=".5"/>
   ${wing}
   <g transform="${head}">
    <ellipse cx="100" cy="74" rx="36" ry="33" fill="${dk}"/>
    ${beakShape}
    ${eyes}
    ${hat}
   </g>
  </svg>`;
}

/* ================= telling Notice Me what was done =================
   The same arrangement the Fulfulde course uses: when this app is opened in a
   frame it posts the whole list of finished subtopics to the parent, which
   marks the ones it does not yet have. The whole list rather than the newest,
   so a child who worked through three offline is not missing two when they
   next connect. It posts only to its own origin and only when framed; opened
   on its own this does nothing. */
function tellHost(){
 try{
  if(window.parent===window) return;
  window.parent.postMessage({app:"one-hundred",course:COURSE,type:"progress",
   done:Object.keys(S.d||{})}, location.origin);
 }catch(e){}
}

 if(!ev||!ev.data||ev.data.app!=="one-hundred") return;

  S.name=String(ev.data.name).slice(0,18); S.noname=1; save(); render();
 }
}

/* ================= today =================
   The courses were a library: forty-odd subtopics, hundreds of questions, no
   unit of work and no stopping point, so a child never knew how much was
   enough. Attainment at this age comes from short regular practice rather
   than from access to material, so there is now a session: ten questions,
   about five minutes, drawn from what they have not finished. Finish it and
   the streak goes up. */
const TODAY=()=>new Date().toISOString().slice(0,10);
function streakInfo(){
 const last=S.lastDay, st=S.streak||0, today=TODAY();
 if(last===today) return {n:st, doneToday:true};
 const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 return {n:(last===y?st:0), doneToday:false};
}
function startSession(){
 const seed=Date.now()%99991;
 const pool=ALL.filter(s=>!S.d[s.id]);
 const from=(pool.length?pool:ALL).slice(0,12);
 const qs=[];
 for(let i=0;i<10;i++){
  const s=from[i%from.length];
  qs.push({s:s, q:GEN[s.g](R(seed+i*7919), i<3?1:(s.lvl||1), s.arg)});
 }
 V={s:"session",i:0,qs:qs,right:0,typed:"",pick:null,miss:0,shown:false};
 render();
}
function sessionHTML(){
 if(V.i>=V.qs.length) return sessionDone();
 const cur=V.qs[V.i];
 V.q=cur.q;
 const dots=V.qs.map((_,k)=>`<i class="${k<V.i?"on":""}"></i>`).join("");
 return `<div class="wrap">
  <p class="step">${esc(t("todays"))} \u00b7 ${V.i+1} ${esc(t("of"))} ${V.qs.length}</p>
  <div class="sesbar"><i style="width:${V.i/V.qs.length*100}%"></i></div>
  <p class="sestop">${esc(cur.s[L]||cur.s.en)}</p>
  <div class="card">${!V.shown&&V.miss>=2?stuckNote(LESSON(cur.s),"sesShow"):""}
   ${V.shown?revealHTML(cur.q,cur.s):SESBODY(cur.q)}
   <div class="tally">${dots}</div></div>
  ${V.shown?`<button class="go2" onclick="sesNext()">${esc(t("moveon"))}</button>`:""}
  </div>`;
}
function sesShow(){V.shown=true;render()}
function sesNext(){V.shown=false;V.i++;V.typed="";V.pick=null;V.miss=0;V.trap=undefined;render()}
function sessionDone(){
 const today=TODAY();
 if(S.lastDay!==today){
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.lastDay===y?(S.streak||0):0)+1;
  S.lastDay=today; S.sessions=(S.sessions||0)+1; save();
 }
 const st=S.streak||1;
 return `<div class="wrap cover">
  ${MASCOT("cheer",COURSE,150)}

}

/* v11: the page opened on a video that did not exist (a play button and a
   file name), then timecodes, then the bare steps under "not for learning
   from", then an apology, and the teaching came last. Now a child scrolling
   down meets why it matters, the worked example one step at a time, then the
   buttons. The bare steps moved into practice. */
function lessonHTML(s,T2){
 const src=(VIDEO[s.g]||{})[L];
 const back=V.resumeAt!==undefined;
 /* v14: learn it in the order a teacher would teach it. What the test asks
    and the key words first, so the child knows what they are aiming at and
    what the words mean; then why it matters; then the example. */
 const top=`${T2.inTest?`<div class="intest"><b>${esc(t("intest"))}</b><span>${esc(T2.inTest)}</span></div>`:""}
  ${(T2.key||[]).length?`<h2 class="lh">${esc(t("keywords"))}</h2><div class="card kwcard">${T2.key.map(k=>

  <h2 class="lh">${esc(t("example"))}</h2>
  ${exampleHTML(s,T2)}`;
 let film="";
 if(src){
  const marks=T2.steps.map((st,i)=>st.at!==undefined?st.at:Math.round(8+i*11));
  film=`<div class="vidbox"><video class="vid" id="theVid" controls playsinline preload="metadata" src="${esc(src)}"></video></div>
   <p class="jumph">${esc(t("vidjump"))}</p>
   <div class="jumps">${T2.steps.map((st,i)=>`<button class="jump" onclick="seekTo(${marks[i]})">
    <span class="jt num">${mmss(marks[i])}</span><span class="jx">${esc(st[L]||st.en)}</span></button>`).join("")}</div>`;
 }
 return `<div class="wrap">
  <h1 class="lt">${esc(T2.title||s[L]||s.en)}</h1>
  ${top}
  ${src?film+(V.read?`<button class="linkbtn readit" onclick="toggleRead()">${esc(t("hideit"))}</button>${written}`
    :`<button class="go2 quiet readit" onclick="toggleRead()">${esc(t("readit"))}</button>`):written}
  ${extrasHTML(T2)}

  ${back?"":`<button class="go2 quiet" onclick="skipTeach()">${esc(t("iknow"))}</button>`}</div>`;

/* the worked example, one step at a time; tap a step for its reason */
function exampleHTML(s,T2){
 const n=T2.steps.length, upto=Math.min(V.step||0,n-1), last=upto>=n-1;
 return `<div class="card lesson ex" id="ex">
  ${T2.show?`<div class="qmid${T2.show.length>24?" long":""}">${esc(seePlain(T2.show))}</div>`:""}
  ${T2.steps[upto].see?`<div class="seebox" aria-live="polite">${seeHTML(T2.steps[upto].see)}</div>`:""}
  <div class="exsteps">${T2.steps.slice(0,upto+1).map((st,i)=>{
   const open=!!(V.why||{})[i];
   return `<button class="sbtn${i<upto?" old":""}" onclick="showWhy(${i})" aria-expanded="${open}">
    <b>${esc(seePlain(st.line))}</b><span>${esc(st[L]||st.en)}</span>
    ${open?`<i>${esc(w(st,"why"))}</i>`:(i===upto?`<small>${esc(t("tapwhy"))}</small>`:"")}</button>`;
  }).join("")}</div>
  ${last?"":`<div class="exnav"><button class="go2" onclick="stepNext()">${esc(t("nextstep"))}</button>
   <button class="linkbtn" onclick="allSteps()">${esc(t("allsteps"))}</button></div>`}
 </div>`;
}

/* "A colon" / "An adverb": the definition reads as one sentence */
const An2=term=>/^[aeiou]/i.test(term)?"An":"A";
/* ---- after the main example ----
   Another one, folded away; a test-style question with the working behind a
   tap so the child can try it first; and a short set of lines with one
   mistake to find. */
function stepsList(steps,key){
 return `<div class="exsteps">${steps.map((st,i)=>{ const k=key+i, open=!!(V.why||{})[k];
  return `<button class="sbtn" onclick="showWhy('${k}')" aria-expanded="${open}">
   <b>${esc(seePlain(st.line))}</b><span>${esc(st[L]||st.en)}</span>
   ${st.see?`<div class="seebox sm">${seeHTML(st.see)}</div>`:""}
   ${open?`<i>${esc(w(st,"why"))}</i>`:""}</button>`; }).join("")}</div>`;
}
function extrasHTML(T2){
 const op=V.open||{}; let h="";
 const ex=(T2.examples||[])[0];
 if(ex) h+=`<button class="fold" onclick="openX('ex')" aria-expanded="${!!op.ex}">${esc(t("another"))}
   <small>${op.ex?esc(t("hide")):"\u25be"}</small></button>
  ${op.ex?`<div class="card lesson ex"><div class="qmid long">${esc(seePlain(ex.show))}</div>${stepsList(ex.steps,"x")}</div>`:""}`;
 const ts=T2.test;
 if(ts) h+=`<h2 class="lh">${esc(t("intest"))}</h2>
  <div class="card lesson ex"><p class="wq">${esc(ts.en)}</p><div class="qmid long">${seeHTML(ts.show)}</div>
   ${op.test?stepsList(ts.steps,"t"):`<button class="go2 quiet small" onclick="openX('test')">${esc(t("showhow"))}</button>`}</div>`;
 const m=T2.mistake;
 if(m){ const found=V.mk===m.wrong;
  h+=`<h2 class="lh">${esc(t("spot"))}</h2><p class="lhsub">${esc(t("spotsub"))}</p>
  <div class="card lesson ex"><div class="mlines">${m.lines.map((ln,i)=>{
    const cls=found&&i===m.wrong?" bad":(V.mk===i&&i!==m.wrong?" nope":"");
    return `<button class="mline${cls}" onclick="spot(${i})">${seeHTML(ln)}</button>`; }).join("")}</div>
   ${found?`<div class="note fixnote"><b>${esc(t("found"))}</b> ${esc(m.fix_en)}</div>`
    :V.mk!==undefined?`<p class="hint" style="margin-top:8px">${esc(t("notthat"))}</p>`:""}</div>`; }
 return h;
}
function openX(k){ if(!V.open) V.open={}; V.open[k]=!V.open[k]; render(); }
function spot(i){ V.mk=i; render(); }
function allSteps(){V.step=LESSON(byId(V.id)).steps.length-1;render()}
function toggleRead(){V.read=!V.read;render()}
/* the bare steps, a tap away in practice */
function peekHTML(T2){
 if(!T2) return "";
 if(!V.peek) return `<button class="linkbtn" onclick="togglePeek()">${esc(t("peek"))}</button>`;
 return `<div class="card peekcard" id="peek"><div class="peekhead">
   <div class="qmid long">${esc(seePlain(T2.show||""))}</div>
   <button class="linkbtn" onclick="togglePeek()">${esc(t("close"))}</button></div>
  <ol class="rsteps small">${T2.steps.map(st=>`<li>${esc(seePlain(st.line))}</li>`).join("")}</ol></div>`;
}
function togglePeek(){V.peek=!V.peek;if(V.peek){V.focus="peek";V.near=true}render()}
function seekTo(sec){const v=document.getElementById("theVid");if(v){try{v.currentTime=sec;v.play()}catch(e){}}}
function showWhy(i){if(!V.why)V.why={};V.why[i]=!V.why[i];render()}
function skipTeach(){V.ph="drill";V.i=0;V.bad=0;newQ();S.at={id:V.id,ph:"drill",i:0};save();render()}
function toGuided(){
 if(V.resumeAt!==undefined){const at=V.resumeAt;V.resumeAt=undefined;
  V.ph="drill";V.i=at;V.bad=0;newQ();S.at={id:V.id,ph:"drill",i:at};save();render();return}
 V.ph="guided";V.g=0;V.typed="";V.miss=0;S.at={id:V.id,ph:"guided",i:0};save();render();
}
/* three wrong: back to the lesson with every step showing, scrolled to the example */
function backToLesson(){const s=byId(V.id);V.resumeAt=V.i;V.ph="lesson";V.why={};
 V.step=LESSON(s).steps.length-1;V.read=true;if(!(VIDEO[s.g]||{})[L])V.focus="ex";render()}
function guidedHTML(s,T2){
 const steps=T2.guided.steps, q=steps[Math.min(V.g,steps.length-1)];
 return `<div class="wrap"><p class="step">${esc(s[L]||s.en)}</p>${phaseBar(1)}
  <div class="card">
   <div class="steps">${steps.slice(0,V.g).map(x=>
    `<div class="stepline done"><b>${esc(x.a)}</b><span>${esc(w(x,"ask"))}</span></div>`).join("")}</div>
   <p class="qq">${esc(w(q,"ask"))}</p>
   ${V.miss>=2?`<div class="note">${esc(t("look"))} \u2014 ${esc(w(T2.steps[Math.min(V.g,T2.steps.length-1)],"why"))}</div>`:""}
   <input class="wordin" id="win" type="text" value="${esc(V.typed)}" oninput="V.typed=this.value"
    placeholder="\u2026" autocapitalize="none" autocorrect="off" spellcheck="false">
   <button class="go2" onclick="checkGuided()">${esc(t("check"))}</button>
   ${peekHTML(T2)}
  </div></div>`;
}
function checkGuided(){
 const el=document.getElementById("win"); if(el) V.typed=el.value;
 const T2=LESSON(byId(V.id)), steps=T2.guided.steps;
 if(!V.typed.trim()) return;
 const want=norm(steps[Math.min(V.g,steps.length-1)].a), got=norm(V.typed);
 if(got===want||(/ clause$/.test(want)&&got===want.replace(/ clause$/,""))){
  V.g++; V.typed=""; V.miss=0;
  if(V.g>=steps.length){V.ph="drill";V.i=0;V.bad=0;newQ();S.at={id:V.id,ph:"drill",i:0};save()}
 } else { V.miss++; V.typed=""; }
 render();
}
function phaseBar(n){
 const ks=[{en:"Learn it",fr:"Apprendre"},{en:"Together",fr:"Ensemble"},{en:"On your own",fr:"\u00c0 toi"}];
 return `<div class="phases">${ks.map((k,i)=>
  `<span class="pz${i===n?" on":""}${i<n?" past":""}">${esc(k[L]||k.en)}</span>`).join("")}</div>`;
}
/* ---------- the question surfaces ---------- */
function qBody(q,isDiag){
 const done=isDiag?"diagCheck":"answer";
 if(q.ask==="tapWords"){
  const parts=q.sent.split("|");
  const picked=V.pick||[];
  return `<p class="hint">${esc(q.hint)}</p><p class="sent">${parts.map((p,i)=>
   i%2===1?`<button class="tw${picked.includes(p)?(q.a.includes(p)?" on":" bad"):""}"
    onclick="tapWord('${p.replace(/'/g,"\\'")}','${done}')">${esc(p)}</button>`:esc(p)).join("")}</p>`;
 }
 if(q.ask==="tapGaps"){
  /* v11: the only gap drawn was the right one, so one tap always scored and
     the question taught nothing. Now there is a gap between every pair of
     words; the right ones show the mark when tapped, a wrong one turns red. */
  const G=gapModel(q.sent), picked=V.pick||[];
  return `<p class="hint">${esc(q.hint)}</p><p class="sent gaps">${G.words.map((wd,i)=>{
   if(i===G.words.length-1) return esc(wd);
   const sl=G.slots[i], on=picked.includes(i);
   return esc(wd)+`<button class="gap${on?(sl.ok?" ok":" no"):""}" aria-label="gap after ${esc(wd)}"
    onclick="tapGap(${i},'${done}')">${on&&sl.ok?esc(sl.mark):""}</button>`;
  }).join("")}</p>`;
 }
 if(q.ask==="choose"){
  /* v11: "the underlined part" was asked about with nothing underlined */
  const sentHTML=q.marked?q.marked.split("|").map((p,i)=>i%2?`<u>${esc(p)}</u>`:esc(p)).join(""):esc(q.sent||"");
  return `${q.sent?`<p class="sent">${sentHTML}</p>`:""}
   <p class="qq">${q.q}</p>
   <div class="opts">${q.opts.map(o=>`<button class="opt${V.pick===o?(o===q.a?" yes":" no"):""}"
    onclick="tapOpt('${String(o).replace(/'/g,"\\'")}','${done}')">${esc(o)}</button>`).join("")}</div>`;
 }
 /* type */
 return `${q.sent?`<p class="sent">${esc(q.sent)}</p>`:""}
  <p class="qq">${q.q}</p>
  ${q.clip?`<button class="listen" onclick="sayTwice('${String(q.a).replace(/'/g,"\\'")}','${String(q.sent||"").replace(/'/g,"\\'")}')">
   <span>\u{1f50a}</span>${esc(t("listen"))}</button>
   <p class="covsm">${esc(t("saysyn"))}</p>`:""}
  <input class="wordin" id="win" type="text" value="${esc(V.typed)}" oninput="V.typed=this.value"
   placeholder="\u2026" autocapitalize="none" autocorrect="off" spellcheck="false">
  <button class="go2" onclick="typeCheck('${done}')">${esc(t("check"))}</button>
  ${q.hint?`<p class="covsm">${esc(q.hint)}</p>`:""}`;
}
function tapWord(word,done){
 const q=V.q||V.qs[V.i]; if(!V.pick)V.pick=[];
 if(!V.pick.includes(word))V.pick.push(word);
 const need=q.a;
 if(need.every(x=>V.pick.includes(x))){
  const clean=!V.pick.some(x=>!need.includes(x));
  finish(clean,done);
 } else if(V.pick.some(x=>!need.includes(x))){ V.miss=(V.miss||0)+1; markWrong(done); }
 render();
}
/* The sentence without its marks, split into words, with a slot after every
   word but the last. A slot is right if the mark was written straight after
   that word, so "Pepper |(|a black cat" puts the bracket in the gap after
   Pepper and "ready|-|made" puts the hyphen after ready. */
function gapModel(sent){
 const parts=String(sent).split("|"), words=[], slots=[];
 parts.forEach((p,i)=>{
  if(i%2===1){ if(words.length) slots[words.length-1]={ok:true,mark:p.trim()}; return; }
  p.split(/\s+/).filter(Boolean).forEach(wd=>{ words.push(wd); slots[words.length-1]=slots[words.length-1]||{ok:false}; });
 });
 /* a word split by a hyphen mark ("ready|-|made") arrives as two words */
 return {words, slots:words.map((_,i)=>slots[i]||{ok:false})};
}
function tapGap(i,done){
 const q=V.q||V.qs[V.i]; if(!V.pick)V.pick=[];
 if(V.pick.includes(i)) return;
 V.pick.push(i);
 const G=gapModel(q.sent), need=G.slots.map((s,k)=>s.ok?k:-1).filter(k=>k>=0);
 if(!G.slots[i].ok){ V.miss=(V.miss||0)+1; markWrong(done); }
 if(need.every(k=>V.pick.includes(k))) finish(!V.pick.some(k=>!G.slots[k].ok),done);
 render();
}
function tapOpt(o,done){
 const q=V.q||V.qs[V.i];
 V.pick=o;
 if(String(o)!==String(q.a)&&q.traps&&q.traps[o]) V.trap=q.traps[o];
 finish(String(o)===String(q.a),done);
 render();
}
function typeCheck(done){
 const el=document.getElementById("win"); if(el) V.typed=el.value;
 if(!V.typed.trim()) return;
 const q=V.q||V.qs[V.i];
 if(norm(V.typed)!==norm(q.a)&&q.trap){ const m=q.trap(V.typed); if(m) V.trap=m; }
 finish(norm(V.typed)===norm(q.a),done);
 render();
}
function markWrong(done){ if(done==="answer"){V.bad=(V.bad||0)+1} }
function finish(ok,done){
 if(done==="session"){
  if(ok){ V.right++; sesNext(); }
  else { V.miss=(V.miss||0)+1; V.typed=""; V.pick=null; }
  return;
 }
 if(done==="diagCheck"){ diagCheck(ok); return; }
 if(ok){ advance(); }
 else { V.bad=(V.bad||0)+1; V.miss=(V.miss||0)+1; V.typed=""; V.pick=null; }
}
/* v2: a wrong answer used to keep a child on the same question for ever. There
   was no skip and no reveal, so the only way out of a spelling you did not
   know was to close the app. Three wrong and the answer is offered; taking it
   costs the mark and moves on, which is what a teacher would do. */
function giveUp(){ V.shown=true; render(); }
function moveOn(){ V.shown=false; V.bad=(V.bad||0)+1; advance(); render(); }
function drillHTML(s,T2){
 const q=V.q, dots=Array.from({length:s.n}).map((_,k)=>`<i class="${k<V.i?"on":""}"></i>`).join("");
 return `<div class="wrap"><p class="step">${esc(s[L]||s.en)} \u00b7 ${V.i+1} ${esc(t("of"))} ${s.n}</p>
  ${phaseBar(2)}
  <div class="card">${!V.shown&&V.miss>=2?stuckNote(T2,"giveUp",V.bad>=3?againBtn(s):""):""}
   ${V.shown?revealHTML(q,s):(V.i<2&&QPIC[s.g]?QPIC[s.g](q,false):"")+qBody(q,false)+peekHTML(T2)}
   ${!V.shown&&V.miss<2&&V.bad>=3?againBtn(s):""}
   <div class="tally">${dots}</div></div>
  ${V.shown?`<button class="go2" onclick="moveOn()">${esc(t("moveon"))}</button>`:""}
  </div>`;
}
/* v11: the hint and the way out sit at the top of the card, where a stuck child
   is looking; under the answers they were often off the bottom of the screen. */
/* v12: the hint is about this question: what the wrong choice they made
   means if we can tell, otherwise the tip for this kind of question. */
function stuckNote(T2,giveFn,extra){
 const q=V.q||(V.qs&&V.qs[V.i]&&V.qs[V.i].q)||{};
 const txt=V.trap||q.tip||(T2?w(T2.steps[0],"why"):"");
 return `<div class="note stuck">${txt?`<span>${esc(t("look"))} \u2014 ${esc(txt)}</span>`:""}
  <span class="stuckbtns"><button class="go2 quiet small" onclick="${giveFn}()">${esc(t("giveup"))}</button>${extra||""}</span></div>`;
}
/* v12: the reveal shows the question with the answer put into it, then why */
function revealHTML(q,s){
 let sent="";
 if(q.ask==="tapWords") sent=q.sent.split("|").map((p,i)=>i%2&&q.a.includes(p)?`<mark>${esc(p)}</mark>`:esc(p)).join("");
 else if(q.ask==="tapGaps") sent=q.sent.split("|").map((p,i)=>i%2?`<mark>${esc(p.trim())}</mark>${/^\s/.test(p)?"":""}`:esc(p)).join("");
 else if(q.ask==="type"&&q.sent&&/_{3,}/.test(q.sent)) sent=esc(q.sent).replace(/_{3,}/,`<mark>${esc(q.a)}</mark>`);
 else if(q.marked) sent=q.marked.split("|").map((p,i)=>i%2?`<u>${esc(p)}</u>`:esc(p)).join("");
 else if(q.sent) sent=esc(q.sent);
 const ans=Array.isArray(q.a)?q.a.join(", "):String(q.a);
 const ask=q.ask==="choose"||(q.ask==="type"&&!/_{3,}/.test(q.sent||""));
 const pic=s&&QPIC[s.g]?QPIC[s.g](q,true):"";
 return `${sent?`<p class="sent">${sent}</p>`:""}${ask?`<p class="qq">${q.q}</p>`:""}${pic}
  <div class="reveal"><p class="rl">${esc(t("theans"))}</p><p class="ra${ans.length>16?" long":""}">${esc(ans)}</p>
   ${q.clip||q.ask==="type"?`<button class="listen" onclick="say('${String(q.a).replace(/'/g,"\\'")}')"><span>\u{1f50a}</span>${esc(t("hearit"))}</button>`:""}</div>
  ${(()=>{ const wk=(q.work||[]).filter(x=>norm(x)!==norm(ans)); return wk.length?`<div class="workbox"><p class="rl">${esc(t("whyans"))}</p>${wk.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:""; })()}`;
}
function againBtn(s){
 return `<button class="go2 warm small" onclick="backToLesson()">${(VIDEO[s.g]||{})[L]?"\u25b6 "+esc(t("vidagain")):esc(t("exagain"))}</button>`;
}
function advance(){
 const s=byId(V.id); V.i++; V.typed=""; V.pick=null; V.miss=0; V.shown=false;
 S.at={id:V.id,ph:"drill",i:V.i}; save();
 if(V.i>=s.n){ S.d[s.id]=1; S.b[s.id]=Math.max(S.b[s.id]||0,Math.max(0,s.n-V.bad)); save(); tellHost(); V.ph="done"; }
 else newQ();
}
function doneHTML(s){
 return `<div class="wrap"><div class="card res"><div class="em">\u2713</div>
  <h2>${esc(t("camp"))}</h2><p class="num">${S.b[s.id]||0} ${esc(t("of"))} ${s.n}</p></div>
  <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
  <button class="go2 quiet" onclick="openStop('${V.id}')">${esc(t("again"))}</button></div>`;
}
function resume(){
 const a=S.at; if(!a)return; const s=byId(a.id); if(!s)return;
 openStop(a.id);
 if(a.ph==="drill"){V.ph="drill";V.i=Math.min(a.i,s.n-1);V.bad=0;newQ()}
 else if(a.ph==="guided") toGuided();
 render();
}
/* ---------- the whole paper: 50 questions, 45 minutes ---------- */
const PAPERMIX=["punct","wordClass","apostrophe","syn","clause","func","standard","tense",
 "voice","prefix","suffix","contract","wcName","modal","ant","formal","punct","wordClass","spell","spell"];
let TID=null;
function openPaper(){
 const seed=Date.now()%99991, qs=[];
 for(let i=0;i<50;i++){ const g=PAPERMIX[i%PAPERMIX.length];
  qs.push(Object.assign(GEN[g](R(seed+i*7919),1),{m:1})); }
 V={s:"paper",qs,i:0,ans:qs.map(()=>null),t0:Date.now(),mark:null,typed:"",pick:null};
 tick(); render();
}
function tick(){ clearInterval(TID); TID=setInterval(()=>{
 if(V.s!=="paper"||V.mark){clearInterval(TID);return}
 const left=2700-Math.floor((Date.now()-V.t0)/1000);
 if(left<=0){clearInterval(TID);markPaper();return}
 const e=document.getElementById("clk");
 if(e){e.textContent=mmss(left); e.className="timer"+(left<300?" low":"")}
},500) }
function paperHTML(){
 if(V.mark!==null){
  return `<div class="wrap"><div class="card res"><div class="em">\u{1f4c4}</div>
   <h2 class="num">${V.mark} / 50</h2><p>${esc(t("score"))}</p>
   <div class="bar2"><i style="width:${Math.round(V.mark/50*100)}%"></i></div></div>
   <button class="go2" onclick="goMap()">${esc(t("back"))}</button>
   <button class="go2 quiet" onclick="openPaper()">${esc(t("again"))}</button></div>`;
 }
 const q=V.qs[V.i];
 return `<div class="wrap">
  <div class="step" style="display:flex;justify-content:space-between;align-items:center">
   <span>${V.i+1} ${esc(t("of"))} 50</span><span class="timer" id="clk">45:00</span></div>
  <div class="card">${qBody(q,false).replace(/'answer'/g,"'paper'")}
   <div class="pgrid">${V.qs.map((_,k)=>`<button class="pg${V.ans[k]!==null?" ans":""}${k===V.i?" now":""}"
    onclick="pgo(${k})">${k+1}</button>`).join("")}</div></div>
  <button class="go2 quiet" onclick="markPaper()">${esc(t("finish"))}</button></div>`;
}
function pgo(k){V.i=k;V.typed="";V.pick=null;render()}
function markPaper(){
 let m=0; V.ans.forEach(a=>{if(a===true)m++});
 V.mark=m; S.p=(S.p||[]).concat([m]); save(); render();
}
/* in the paper, an answer is recorded and it moves on \u2014 no marking as you go */
const _finish=finish;
finish=function(ok,done){
 if(done==="paper"){ V.ans[V.i]=ok; V.typed=""; V.pick=null;
  if(V.i<49) V.i++; render(); return; }
 _finish(ok,done);
};
render();


</script></body></html>
